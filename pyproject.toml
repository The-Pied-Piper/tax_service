# Tool configuration only. Dependencies live in requirements*.txt and are pip-installed in Docker.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", "tools/service_gen/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Stable import ordering whether or not app/ exists yet (it is created by init).
known-first-party = ["app", "tools"]

[tool.ruff.lint.per-file-ignores]
"app/generated/models.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/versions", "tools/service_gen/templates"]

[[tool.mypy.overrides]]
module = ["connexion.*", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["datamodel_code_generator.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto"

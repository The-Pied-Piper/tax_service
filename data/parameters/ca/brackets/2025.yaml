# Federal income tax brackets, 2025 tax year.
# The lowest rate fell from 15% to 14% on July 1, 2025; 14.5% is the full-year
# blended rate used on the 2025 return (T1, Step 5, Part A, lines 70-76).
# CRA states no rounding rule for these lines, so none is assumed.
family: ca/brackets
tax_year: 2025
sources:
  - https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/last-year.html
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-r/5006-r-25e.txt
  - https://www.canada.ca/en/department-finance/news/2025/05/delivering-a-middle-class-tax-cut.html
rounding: none
brackets:
  - {from: "0", rate: "0.145"}
  - {from: "57375", rate: "0.205"}
  - {from: "114750", rate: "0.26"}
  - {from: "177882", rate: "0.29"}
  - {from: "253414", rate: "0.33"}

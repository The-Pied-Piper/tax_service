# Form T2125 (2025), Chart B line 18: "($350*** ÷ 30) × the number of days in the fiscal period for
# which interest was payable (accrual method) or paid (cash method) = 18". The printed $350 is for
# a passenger vehicle bought after 2023 (footnote "***"), and is claimed whole. It
# borrows the credit kind because it is a printed constant. Line 18 is a dollars-and-cents box, so
# the quotient rounds half-up to the cent, the owner's decision, as the form states no rounding
# rule.
family: ca/business_vehicle_interest_limit
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2125/t2125-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "350"

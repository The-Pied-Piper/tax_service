# Form T2125 (2025), Chart C line 27: "[($38,000 + GST and PST, or $38,000 + HST) × amount 20] ÷
# amount 24". The printed $38,000 is the lease cost limit of a passenger vehicle, to which the sales
# tax of the province is added. It borrows the credit kind because it is a printed constant, claimed
# whole. The tax on it is a dollars-and-cents box, rounded half-up to the cent, the owner's
# decision, as the form states no rounding rule.
family: ca/business_vehicle_lease_cost_limit
tax_year: 2025
kind: credit
sources:
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2125/t2125-25e.pdf
rounding: {increment: "0.01", mode: half_up}
amount: "38000"

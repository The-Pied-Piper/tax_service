# Ontario resident, personal income tax: federal and Ontario together.
# Each selection names a capability and fills its slots (design.md §4): parameter
# slots with families, artifact slots with artifact identifiers. The order is
# derived from the capabilities' contracts in code, never from this list.
# `inputs` are the artifacts a computation starts from; `outputs` are what it returns.
jurisdiction: CA-ON
version: 1
valid_from_tax_year: 2025
inputs:
  - ca/employment_income
  - ca/capital_gain
  - ca/other_employment_income
  - ca/old_age_security
  - ca/cpp_or_qpp_benefits
  - ca/other_pensions_and_superannuation
  - ca/elected_split_pension_amount
  - ca/universal_child_care_benefit
  - ca/ei_and_other_benefits
  - ca/t3_taxable_dividends_other_than_eligible
  - ca/t4ps_taxable_dividends_other_than_eligible
  - ca/t5_taxable_dividends_other_than_eligible
  - ca/t5013_taxable_dividends_other_than_eligible
  - ca/t3_taxable_dividends
  - ca/t4ps_taxable_dividends
  - ca/t5_taxable_dividends
  - ca/t5013_taxable_dividends
  - ca/eligible_dividends_received_without_a_slip
  - ca/other_dividends_received_without_a_slip
  - ca/t3_dividend_tax_credit
  - ca/t4ps_dividend_tax_credit
  - ca/t5_dividend_tax_credit
  - ca/t5013_dividend_tax_credit
  - ca/t3_investment_income
  - ca/t5_investment_income
  - ca/t5013_investment_income
  - ca/investment_income_credited_not_received
  - ca/tax_refund_interest
  - ca/foreign_investment_income
  - ca/investment_income_without_a_slip
  - ca/investment_royalties
  - ca/investment_income_reported_in_previous_years
  - ca/net_partnership_income
  - ca/rdsp_income
  - ca/taxable_support_payments
  - ca/rrsp_income
  - ca/fhsa_income
  - ca/other_fhsa_income
  - ca/other_income
  - ca/taxable_scholarships
  - ca/workers_compensation_benefits
  - ca/social_assistance_payments
  - ca/net_federal_supplements
  - ca/uccb_repayment
  - ca/rdsp_income_repayment
  - ca/canadian_armed_forces_and_police_deduction
  - ca/security_options_deductions
  - ca/limited_partnership_losses_of_other_years
  - ca/non_capital_losses_of_other_years
  - ca/additional_deductions
  - ca/other_payments_deduction_above_limit
  - ca/other_payments_worksheet_required
  - ca/other_payments_worksheet_line_9_over_limit
  - ca/unused_rrsp_contributions
  - ca/rrsp_contributions
  - ca/rrsp_deduction_limit
  - ca/rrsp_amount_deducted
  - ca/union_dues
  - ca-on/dependent_children
  - ca-on/dependants
  - ca/eligible_dependants
  - ca/dependant_net_income
  - ca/infirm_children
  - ca/born_in_1960_or_earlier
  - ca/spouse_net_income
  - ca/spouses_claimed
  - ca/spouse_caregiver_eligible
  - ca/child_care_expenses_paid
  - ca/children_under_seven
  - ca/children_with_disability
  - ca/children_seven_to_sixteen
  - ca/cwb_eligible_dependants
  - ca/income_tax_deducted
  - ca-on/fertility_expenses
  - ca-on/seniors_transit_paid
  - ca-on/flow_through_share_slips
  - ca-on/community_food_program_donations
outputs:
  - ca/refund_or_balance_owing
  - ca/unused_rrsp_contributions_carried_forward
  - ca/taxable_dividends_other_than_eligible
  - ca/other_payments_limit_income
capabilities:
  - name: core/apply_rate
    params:
      rate: ca/capital_gains_inclusion_rate
    consumes:
      base: ca/capital_gain
    produces:
      output: ca/taxable_capital_gains
  # T1 line 9 (12000) "Amount of dividends (eligible and other than eligible)" and line
  # 12010 "Amount of dividends (other than eligible)" (use Federal Worksheet): the Federal
  # Worksheet's "Lines 12000 and 12010 - Taxable amount of dividends from taxable Canadian
  # corporations", line 5 "Add lines 1 to 4. Enter this amount on line 12010 of your
  # return." (the T3, T4PS, T5 and T5013 slip boxes of lines 1 to 4) and line 10 "Add lines
  # 6 to 9. Enter this amount on line 12000 of your return." (lines 6 to 9). For dividends
  # with no information slip, line 11 "Actual amount of eligible dividends received" and
  # line 12 "Applicable rate 138%" give line 13 "Line 11 multiplied by the percentage from
  # line 12"; line 14 "Actual amount of dividends other than eligible dividends received"
  # and line 15 "Applicable rate 115%" give line 16 "Line 14 multiplied by the percentage
  # from line 15 Include this amount on line 12010 of your return."; line 17 "Line 13 plus
  # line 16. Include this amount on line 12000 of your return." The rates are above one, so
  # they are fractions, not rates. Line 12010 is line 5 plus line 16 and line 12000 is line
  # 10 plus line 17.
  - name: core/sum
    consumes:
      parts:
        - ca/t3_taxable_dividends_other_than_eligible
        - ca/t4ps_taxable_dividends_other_than_eligible
        - ca/t5_taxable_dividends_other_than_eligible
        - ca/t5013_taxable_dividends_other_than_eligible
    produces:
      output: ca/slip_taxable_dividends_other_than_eligible
  - name: core/sum
    consumes:
      parts:
        - ca/t3_taxable_dividends
        - ca/t4ps_taxable_dividends
        - ca/t5_taxable_dividends
        - ca/t5013_taxable_dividends
    produces:
      output: ca/slip_taxable_dividends
  - name: core/apply_fraction
    params:
      fraction: ca/eligible_dividend_gross_up
    consumes:
      base: ca/eligible_dividends_received_without_a_slip
    produces:
      output: ca/eligible_dividends_grossed_up
  - name: core/apply_fraction
    params:
      fraction: ca/other_dividend_gross_up
    consumes:
      base: ca/other_dividends_received_without_a_slip
    produces:
      output: ca/other_dividends_grossed_up
  - name: core/sum
    consumes:
      parts:
        - ca/eligible_dividends_grossed_up
        - ca/other_dividends_grossed_up
    produces:
      output: ca/dividends_without_a_slip_grossed_up
  - name: core/sum
    consumes:
      parts:
        - ca/slip_taxable_dividends_other_than_eligible
        - ca/other_dividends_grossed_up
    produces:
      output: ca/taxable_dividends_other_than_eligible
  - name: core/sum
    consumes:
      parts:
        - ca/slip_taxable_dividends
        - ca/dividends_without_a_slip_grossed_up
    produces:
      output: ca/taxable_dividends
  # T1 Step 2 line 10 (12100) "Interest and other investment income (use Federal
  # Worksheet)": the Federal Worksheet's "Line 12100 - Interest and other investment
  # income" line 9 "Add lines 1 to 8.", in line order, then line 11 "Line 9 minus line
  # 10. Enter this amount on line 12100 of your return." with line 10 "Interest and other
  # investment income, included on line 9, received and reported in previous years".
  - name: core/sum
    consumes:
      parts:
        - ca/t3_investment_income
        - ca/t5_investment_income
        - ca/t5013_investment_income
        - ca/investment_income_credited_not_received
        - ca/tax_refund_interest
        - ca/foreign_investment_income
        - ca/investment_income_without_a_slip
        - ca/investment_royalties
    produces:
      output: ca/investment_income_before_prior_years
  - name: core/subtract
    consumes:
      amount: ca/investment_income_before_prior_years
      less: ca/investment_income_reported_in_previous_years
    produces:
      output: ca/interest_and_other_investment_income
  # T1 line 32 and line 14700 "Add lines 29 to 31 (see line 25000 in Step 4).": workers'
  # compensation benefits (14400), social assistance payments (14500) and net federal
  # supplements paid (14600), in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/workers_compensation_benefits
        - ca/social_assistance_payments
        - ca/net_federal_supplements
    produces:
      output: ca/income_support_benefits
  # T1 line 33 and line 15000 "Line 28 plus line 32 Total income": every income line the
  # return lists, in line order (lines 1 to 20, here with the amount of dividends of line
  # 9 (12000), the taxable capital gains of line 14 and the taxable support payments of
  # line 15, then line 32); rental income (line 13) and self-employment income (lines 22
  # to 26) are not wired yet.
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
        - ca/other_employment_income
        - ca/old_age_security
        - ca/cpp_or_qpp_benefits
        - ca/other_pensions_and_superannuation
        - ca/elected_split_pension_amount
        - ca/universal_child_care_benefit
        - ca/ei_and_other_benefits
        - ca/taxable_dividends
        - ca/interest_and_other_investment_income
        - ca/net_partnership_income
        - ca/rdsp_income
        - ca/taxable_capital_gains
        - ca/taxable_support_payments
        - ca/rrsp_income
        - ca/fhsa_income
        - ca/other_fhsa_income
        - ca/other_income
        - ca/taxable_scholarships
        - ca/income_support_benefits
    produces:
      output: ca/total_income
  # Schedule 8 Part 3, each contribution on employment income: line 11 (base, 4.95% of the
  # earnings between the $3,500 exemption and the $71,300 ceiling, lines 2 to 7), line 12
  # (first additional, 1% of the same band) and line 22 (second additional, 4% of the
  # earnings between the $71,300 and $81,200 ceilings, lines 2 to 4).
  - name: core/contribution_tier
    params:
      tier: ca/cpp_base_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_base_contributions
  - name: core/contribution_tier
    params:
      tier: ca/cpp_first_additional_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_first_additional_contributions
  - name: core/contribution_tier
    params:
      tier: ca/cpp_second_additional_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_second_additional_contributions
  # T1 line 31200 "through employment (boxes 18 and 55 of all T4 slips) (maximum
  # $1,077.48)": the EI premiums, 1.64% of the employment income up to the $65,700
  # maximum insurable earnings, with no exemption (the EI premium rates and maximums,
  # 2025 federal row).
  - name: core/contribution_tier
    params:
      tier: ca/ei_premium
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/ei_premiums
  # Schedule 8 Part 3a line 28 "Line 26 plus line 27": the first and second additional
  # contributions together, the T1 line 22215 deduction.
  - name: core/sum
    consumes:
      parts:
        - ca/cpp_first_additional_contributions
        - ca/cpp_second_additional_contributions
    produces:
      output: ca/cpp_enhanced_contributions
  # Schedule 7 line 5 "Line 1 plus line 4 ... Total contributions", line 6 "Total
  # contributions from line 5" and line 10 "Line 6 minus line 9 Contributions available
  # to deduct": with no HBP or LLP repayments (line 9), line 10 is line 5. In line 5's
  # order: the unused contributions (line 1), then the contributions (line 4).
  - name: core/sum
    consumes:
      parts:
        - ca/unused_rrsp_contributions
        - ca/rrsp_contributions
    produces:
      output: ca/rrsp_contributions_available
  # Schedule 7 line 17 "Enter whichever is less: amount from line 13 or line 16.": with
  # no employer PRPP contributions (line 12) and no transfers (line 15), line 13 is the
  # limit and line 16 the contributions available to deduct. The parts keep line 20's
  # order (line 10, then the limit).
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/rrsp_contributions_available
        - ca/rrsp_deduction_limit
    produces:
      output: ca/rrsp_deduction_maximum
  # Schedule 7 line 18 "Enter your RRSP, PRPP, or SPP contributions you are deducting for
  # 2025 (cannot be more than the amount on line 17).", line 19 "Line 15 plus line 18"
  # and line 20 "Enter whichever is less: amount from line 10 or line 19. Enter this
  # amount on line 20800 of your return. RRSP deduction": with no transfers (line 15),
  # line 19 is line 18, at most line 17 and so at most line 10, and line 20 is line 18
  # itself. A claim above line 17 is refused, not capped.
  - name: core/at_most
    consumes:
      amount: ca/rrsp_amount_deducted
      bound: ca/rrsp_deduction_maximum
    produces:
      output: ca/rrsp_deduction
  # Schedule 7 line 23 "Line 21 minus line 22 Your unused contributions available to
  # carry forward to a future year": line 21 "Enter your contributions available to
  # deduct from line 10 of the previous page." less line 22 "Enter your RRSP deduction
  # from line 20 of the previous page."; never negative, as line 20 is at most line 10.
  - name: core/subtract
    consumes:
      amount: ca/rrsp_contributions_available
      less: ca/rrsp_deduction
    produces:
      output: ca/unused_rrsp_contributions_carried_forward
  # Form T778 Part B line 1 "Number of eligible children born in 2019 or later whom the
  # disability amount cannot be claimed for" "multiplied by $8,000", line 2 (line 67960)
  # "Number of eligible children born in 2025 or earlier whom the disability amount can
  # be claimed for" "multiplied by $11,000" and line 3 "Number of eligible children born
  # in 2009 to 2018 (and born in 2008 or earlier with a mental or physical infirmity whom
  # the disability amount cannot be claimed for)" "multiplied by $5,000".
  - name: core/per_unit_amount
    params:
      amount: ca/child_care_limit_under_seven
    consumes:
      count: ca/children_under_seven
    produces:
      output: ca/child_care_limit_for_children_under_seven
  - name: core/per_unit_amount
    params:
      amount: ca/child_care_limit_disability
    consumes:
      count: ca/children_with_disability
    produces:
      output: ca/child_care_limit_for_children_with_disability
  - name: core/per_unit_amount
    params:
      amount: ca/child_care_limit_seven_to_sixteen
    consumes:
      count: ca/children_seven_to_sixteen
    produces:
      output: ca/child_care_limit_for_children_seven_to_sixteen
  # T778 line 4 "Add lines 1 to 3.", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/child_care_limit_for_children_under_seven
        - ca/child_care_limit_for_children_with_disability
        - ca/child_care_limit_for_children_seven_to_sixteen
    produces:
      output: ca/child_care_basic_limit
  # T778 line 6 "Enter your earned income.", "the total of the following: employment
  # income (including tips and gratuities, and the non-taxable part of an allowance
  # received as an emergency volunteer) ...": the employment income, the other earned
  # income lines not triggered; then "multiplied by two-thirds": one part.
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
    produces:
      output: ca/child_care_earned_income
  - name: core/apply_fraction
    params:
      fraction: ca/child_care_earned_income_fraction
    consumes:
      base: ca/child_care_earned_income
    produces:
      output: ca/child_care_earned_income_limit
  # T778 line 7 "Enter whichever amount is the least: line 4, line 5 or line 6.", in that
  # order, line 5 "Enter the amount from line 67950." being the expenses paid; with line
  # 8 (the other person with the higher net income) not triggered, line 9 "Line 7 minus
  # line 8. ... enter this amount on line 21400 of your return. Allowable deduction" is
  # line 7.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/child_care_basic_limit
        - ca/child_care_expenses_paid
        - ca/child_care_earned_income_limit
    produces:
      output: ca/child_care_expenses
  # T1 line 23300 "Add lines 35 to 52.": the deductions in the form's line order (20800,
  # 21200, 21400, 22215).
  - name: core/sum
    consumes:
      parts:
        - ca/rrsp_deduction
        - ca/union_dues
        - ca/child_care_expenses
        - ca/cpp_enhanced_contributions
    produces:
      output: ca/deductions_from_total_income
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/total_income
      less: ca/deductions_from_total_income
    produces:
      output: ca/net_income
  # Federal Worksheet "Line 25000 - Other payments deduction", "Complete the following
  # calculation if you reported net federal supplements on line 14600 of your return.":
  # line 1 "Amount from line 23400 of your return (if negative, enter "0")" is the net
  # income artifact (line 23400 floored at 0, as line 23500 is not wired yet); line 4 "Line
  # 2 plus line 3 =" adds line 2 "Amount from line 11700 of your return" (the universal
  # child care benefit) and line 3 "Amount from line 12500 of your return" (the RDSP
  # income), in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/universal_child_care_benefit
        - ca/rdsp_income
    produces:
      output: ca/uccb_and_rdsp_income
  # Line 5 "Line 1 minus line 4 =" prints no "(if negative, enter "0")", unlike line 1, so
  # it may be negative.
  - name: core/subtract
    consumes:
      amount: ca/net_income
      less: ca/uccb_and_rdsp_income
    produces:
      output: ca/net_income_less_uccb_and_rdsp_income
  # Line 8 "Line 6 plus line 7 =": line 6 "Amount from line 21300 of your return" (the UCCB
  # repayment, a starting amount as line 21300 is not wired yet) and line 7 "RDSP income
  # repayment (included in the amount on line 23200 of your return)", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/uccb_repayment
        - ca/rdsp_income_repayment
    produces:
      output: ca/uccb_and_rdsp_income_repayments
  # Line 9 "Line 5 plus line 8 =", the amount the worksheet compares with $93,454.
  - name: core/sum
    consumes:
      parts:
        - ca/net_income_less_uccb_and_rdsp_income
        - ca/uccb_and_rdsp_income_repayments
    produces:
      output: ca/other_payments_limit_income
  # "If the amount on line 9 is more than $93,454, go to canada.ca/line-25000 to find out
  # how much you can deduct. Otherwise, enter the amount from line 14700 of your return on
  # line 25000 of your return.": a count of 1 when line 9 is more than $93,454 (a starting
  # count, 0 or 1, until a comparison capability derives it) chooses the amount that chart
  # gives (a starting amount) over line 14700.
  - name: core/choose_by_count
    consumes:
      count: ca/other_payments_worksheet_line_9_over_limit
      when_none: ca/income_support_benefits
      when_any: ca/other_payments_deduction_above_limit
    produces:
      output: ca/other_payments_deduction_after_limit
  # T1 line 60 and line 25000 "Other payments deduction (enter the amount from line 14700
  # if you did not enter an amount on line 14600; otherwise, use Federal Worksheet)": a
  # count of 1 when an amount was entered on line 14600 (a starting count, 0 or 1, until a
  # comparison capability derives it) chooses the worksheet's result over line 14700.
  - name: core/choose_by_count
    consumes:
      count: ca/other_payments_worksheet_required
      when_none: ca/income_support_benefits
      when_any: ca/other_payments_deduction_after_limit
    produces:
      output: ca/other_payments_deduction
  # T1 line 68 and line 25700 "Add lines 58 to 67.": lines 58, 59, 60, 61, 62 and 67 (lines
  # 24400, 24900, 25000, 25100, 25200 and 25600), in line order; lines 63 to 66 (25300,
  # 25395, 25400 and 25500) are not wired yet.
  - name: core/sum
    consumes:
      parts:
        - ca/canadian_armed_forces_and_police_deduction
        - ca/security_options_deductions
        - ca/other_payments_deduction
        - ca/limited_partnership_losses_of_other_years
        - ca/non_capital_losses_of_other_years
        - ca/additional_deductions
    produces:
      output: ca/deductions_from_net_income
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/net_income
      less: ca/deductions_from_net_income
    produces:
      output: ca/taxable_income
  - name: core/progressive_tax
    params:
      schedule: ca/brackets
    consumes:
      base: ca/taxable_income
    produces:
      output: ca/federal_basic_tax
  - name: core/progressive_tax
    params:
      schedule: ca-on/brackets
    consumes:
      base: ca/taxable_income
    produces:
      output: ca-on/ontario_basic_tax
  # T1 line 30000 "If the amount on line 23600 is $177,882 or less, enter $16,129. If
  # the amount on line 23600 is $253,414 or more, enter $14,538. Otherwise, use the
  # Federal Worksheet to calculate the amount to enter. (maximum $16,129)": the federal
  # basic personal amount is the worksheet's taper on net income (line 23600), the first
  # part of the T1's total of credit amounts.
  - name: core/tapered_amount
    params:
      taper: ca/basic_personal_amount
    consumes:
      base: ca/net_income
    produces:
      output: ca/basic_personal_amount
  # ON428 line 58040 has no reduction: the Ontario basic personal amount dataset becomes
  # an artifact of the same name, the first part of ON428's total of credit amounts.
  - name: core/credit_amount
    params:
      amount: ca-on/basic_personal_amount
    produces:
      output: ca-on/basic_personal_amount
  # The Canada employment amount: the lesser of the T1's cap and employment income.
  - name: core/capped_amount
    params:
      cap: ca/canada_employment_amount
    consumes:
      base: ca/employment_income
    produces:
      output: ca/canada_employment_amount
  # Federal Worksheet, "Line 30100 - Age amount": line 1 "Maximum amount 9,028.00", the
  # dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/age_maximum
    produces:
      output: ca/age_maximum
  # Line 3 "Income threshold 45,522.00", the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/age_income_threshold
    produces:
      output: ca/age_income_threshold
  # Line 2 "Amount from line 23600 of your return", the net income, and line 4 "Line 2 minus
  # line 3 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/net_income
      less: ca/age_income_threshold
    produces:
      output: ca/age_income_over_threshold
  # Line 5 "Applicable rate 15%" and line 6 "Line 4 multiplied by the percentage from line
  # 5".
  - name: core/apply_rate
    params:
      rate: ca/age_rate
    consumes:
      base: ca/age_income_over_threshold
    produces:
      output: ca/age_reduction
  # Line 7 "Line 1 minus line 6 (if negative, enter "0") Enter this amount on line 30100
  # of your return."
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/age_maximum
      less: ca/age_reduction
    produces:
      output: ca/age_amount_before_count
  # T1 line 78 (line 30100) "Age amount (if you were born in 1960 or earlier) (use
  # Federal Worksheet) (maximum $9,028)": line 7 once if born in 1960 or earlier, else 0.
  - name: core/times_count
    consumes:
      amount: ca/age_amount_before_count
      count: ca/born_in_1960_or_earlier
    produces:
      output: ca/age_amount
  # Schedule 5, "Line 30300 - Spouse or common-law partner amount": line 2 and line 51090
  # "If you are eligible for the Canada caregiver amount for your spouse or common-law
  # partner, enter $2,687", for each spouse eligible for it, at most one.
  - name: core/per_unit_amount
    params:
      amount: ca/spouse_infirmity_amount
    consumes:
      count: ca/spouse_caregiver_eligible
    produces:
      output: ca/spouse_infirmity_supplement
  # Line 3 "Line 1 plus line 2", line 1 "Basic personal amount from line 30000 of your
  # return".
  - name: core/sum
    consumes:
      parts:
        - ca/basic_personal_amount
        - ca/spouse_infirmity_supplement
    produces:
      output: ca/spouse_amount_basis
  # Line 4 "Your spouse's or common-law partner's net income from line 23600 of their
  # return (Note 1)" and line 5 "Line 3 minus line 4 (if negative, enter "0") Enter this
  # amount on line 30300 of your return."
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/spouse_amount_basis
      less: ca/spouse_net_income
    produces:
      output: ca/spouse_amount_before_count
  # T1 line 79 (line 30300) "Spouse or common-law partner amount (complete Schedule 5)":
  # line 5 once if the filer claims it ("Only one spouse or common-law partner can claim
  # the amount on line 30300 for each other for the same year"), else 0.
  - name: core/times_count
    consumes:
      amount: ca/spouse_amount_before_count
      count: ca/spouses_claimed
    produces:
      output: ca/spouse_amount
  # Schedule 5, "Line 30400 - Amount for an eligible dependant": line 1 "Basic personal
  # amount from line 30000 of your return", line 3 "Line 1 plus line 2" with line 2 (an
  # infirm eligible dependant 18 or older) not triggered, line 4 (51106) "Dependant's net
  # income from line 23600 of their return" and line 5 "Line 3 minus line 4 (if
  # negative, enter "0") Enter this amount on line 30400 of your return.".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/basic_personal_amount
      less: ca/dependant_net_income
    produces:
      output: ca/eligible_dependant_amount_before_count
  # T1 line 80 (line 30400) "Amount for an eligible dependant (complete Schedule 5)":
  # line 5 for each eligible dependant claimed, at most one ("Each household is allowed
  # only one claim for this amount").
  - name: core/times_count
    consumes:
      amount: ca/eligible_dependant_amount_before_count
      count: ca/eligible_dependants
    produces:
      output: ca/eligible_dependant_amount
  # Schedule 5, "Line 30425 - Canada caregiver amount for spouse or common-law partner,
  # or eligible dependant age 18 or older": line 1 "Base amount 28,798.00", the dataset
  # as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/spouse_caregiver_base
    produces:
      output: ca/spouse_caregiver_base
  # Line 2 "Net income for this person from line 23600 of their return", the spouse's
  # net income, and line 3 "Line 1 minus line 2 (if negative, enter "0") (maximum
  # $8,601)", before its maximum, then at most it.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/spouse_caregiver_base
      less: ca/spouse_net_income
    produces:
      output: ca/spouse_caregiver_before_maximum
  - name: core/capped_amount
    params:
      cap: ca/spouse_caregiver_maximum
    consumes:
      base: ca/spouse_caregiver_before_maximum
    produces:
      output: ca/spouse_caregiver_limit
  # Line 4 "Amount claimed on line 30300 or line 30400 of your return, if applicable", the
  # spouse amount, and line 5 "Line 3 minus line 4 (if negative, enter "0") Enter this
  # amount on line 30425 of your return."
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/spouse_caregiver_limit
      less: ca/spouse_amount
    produces:
      output: ca/spouse_caregiver_amount_before_count
  # T1 line 81 (line 30425) "Canada caregiver amount for spouse or common-law partner,
  # or eligible dependant age 18 or older (complete Schedule 5)": line 5 once if the
  # spouse is eligible for the Canada caregiver amount (line 51090), else 0. The eligible
  # dependant 18 or older (line 30400) is not wired here.
  - name: core/times_count
    consumes:
      amount: ca/spouse_caregiver_amount_before_count
      count: ca/spouse_caregiver_eligible
    produces:
      output: ca/spouse_caregiver_amount
  # T1 line 83 (line 30500) "Canada caregiver amount for infirm children under 18 years
  # of age (see Schedule 5) Number of children you are claiming this amount for Line
  # 30499" "multiplied by $2,687".
  - name: core/per_unit_amount
    params:
      amount: ca/infirm_child_amount
    consumes:
      count: ca/infirm_children
    produces:
      output: ca/infirm_children_amount
  # ON428 line 14 "Base amount 11,905.00": the dataset becomes an artifact of the same
  # name.
  - name: core/credit_amount
    params:
      amount: ca-on/eligible_dependant_base
    produces:
      output: ca-on/eligible_dependant_base
  # ON428 line 15 "Your eligible dependant's net income from line 23600 of their
  # return", the federal Schedule 5 line 4 figure, and line 16 (line 58160) "Line 14
  # minus line 15 (if negative, enter "0") (maximum $10,823)", before its maximum, then
  # at most it.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/eligible_dependant_base
      less: ca/dependant_net_income
    produces:
      output: ca-on/eligible_dependant_amount_before_maximum
  - name: core/capped_amount
    params:
      cap: ca-on/eligible_dependant_maximum
    consumes:
      base: ca-on/eligible_dependant_amount_before_maximum
    produces:
      output: ca-on/eligible_dependant_amount_before_count
  # Line 58160 for each eligible dependant claimed, the T1 line 30400 count.
  - name: core/times_count
    consumes:
      amount: ca-on/eligible_dependant_amount_before_count
      count: ca/eligible_dependants
    produces:
      output: ca-on/eligible_dependant_amount
  # T1 line 33500 (lines 30000, 30100, 30300, 30400, 30425, 30500, 30800, 31200, 31260)
  # and ON428 line 58800 (lines 58040, 58160, 58240, 58300), in the forms' line order.
  # ON428 lines 58240 and 58300 are "Amount from line 30800 / 31200 of your return", so
  # the Ontario sum reads the federal kinds; it has no Canada employment amount.
  - name: core/sum
    consumes:
      parts:
        - ca/basic_personal_amount
        - ca/age_amount
        - ca/spouse_amount
        - ca/eligible_dependant_amount
        - ca/spouse_caregiver_amount
        - ca/infirm_children_amount
        - ca/cpp_base_contributions
        - ca/ei_premiums
        - ca/canada_employment_amount
    produces:
      output: ca/non_refundable_credit_amounts
  - name: core/sum
    consumes:
      parts:
        - ca-on/basic_personal_amount
        - ca-on/eligible_dependant_amount
        - ca/cpp_base_contributions
        - ca/ei_premiums
    produces:
      output: ca-on/non_refundable_credit_amounts
  # The rate is applied once, to each form's total of credit amounts (T1 line 33800, ON428
  # line 58840), giving its non-refundable tax credits (T1 line 35000, ON428 line 61500).
  - name: core/apply_rate
    params:
      rate: ca/credit_rate
    consumes:
      base: ca/non_refundable_credit_amounts
    produces:
      output: ca/non_refundable_tax_credits
  - name: core/apply_rate
    params:
      rate: ca-on/credit_rate
    consumes:
      base: ca-on/non_refundable_credit_amounts
    produces:
      output: ca-on/non_refundable_tax_credits
  # T1 line 123 (40425) "Federal dividend tax credit (use Federal Worksheet)": the Federal
  # Worksheet's "Line 40425 - Federal dividend tax credit", line 5 "Add lines 1 to 4." of
  # the credits shown on the T3, T4PS, T5 and T5013 slips. For dividends with no
  # information slip, line A "Amount from line 12000 of your return (Note 1)" and line B
  # "Amount from line 12010 of your return (Note 1)", Note 1 being "Enter only the amount
  # of dividends that were not shown on an information slip.", so line A is the
  # Worksheet's line 17 and line B its line 16, each its own step; line 6 is "Line B,
  # multiplied by 9.0301%"; line C is "Amount A minus amount B", and line 7 (printed "Line
  # 2") is line C "multiplied by 15.0198%"; line 8 is "Line 6 plus line 7" and line 9 "Line
  # 5 plus line 8 Enter this amount on line 40425 of your return."
  - name: core/sum
    consumes:
      parts:
        - ca/t3_dividend_tax_credit
        - ca/t4ps_dividend_tax_credit
        - ca/t5_dividend_tax_credit
        - ca/t5013_dividend_tax_credit
    produces:
      output: ca/slip_dividend_tax_credit
  - name: core/sum
    consumes:
      parts:
        - ca/dividends_without_a_slip_grossed_up
    produces:
      output: ca/dividends_amount_a
  - name: core/sum
    consumes:
      parts:
        - ca/other_dividends_grossed_up
    produces:
      output: ca/dividends_amount_b
  - name: core/apply_rate
    params:
      rate: ca/dividend_credit_rate_other_than_eligible
    consumes:
      base: ca/dividends_amount_b
    produces:
      output: ca/other_dividends_credit
  - name: core/subtract
    consumes:
      amount: ca/dividends_amount_a
      less: ca/dividends_amount_b
    produces:
      output: ca/dividends_amount_a_less_b
  - name: core/apply_rate
    params:
      rate: ca/dividend_credit_rate_eligible
    consumes:
      base: ca/dividends_amount_a_less_b
    produces:
      output: ca/eligible_dividends_credit
  - name: core/sum
    consumes:
      parts:
        - ca/other_dividends_credit
        - ca/eligible_dividends_credit
    produces:
      output: ca/no_slip_dividend_tax_credit
  - name: core/sum
    consumes:
      parts:
        - ca/slip_dividend_tax_credit
        - ca/no_slip_dividend_tax_credit
    produces:
      output: ca/dividend_tax_credit
  # T1 line 125 "Add lines 122 to 124.": line 122 "Amount from line 35000" and line 123
  # (40425), in line order; line 124 (40427, minimum tax carryover) is not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca/non_refundable_tax_credits
        - ca/dividend_tax_credit
    produces:
      output: ca/credits_against_basic_federal_tax
  # Each form's credits come off its basic tax, not below zero: the unused part is lost.
  # Federally the credits are line 125 (T1 line 126 "Line 121 minus line 125 (if negative,
  # enter "0")").
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/federal_basic_tax
      less: ca/credits_against_basic_federal_tax
    produces:
      output: ca/federal_tax_after_credits
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_basic_tax
      less: ca-on/non_refundable_tax_credits
    produces:
      output: ca-on/ontario_tax_after_credits
  # ON428 lines 66 to 68: the surtax on line 65, which is the Ontario tax after credits
  # while line 64 (tax on split income) is not modelled.
  - name: core/tiered_surcharge
    params:
      tiers: ca-on/surtax
    consumes:
      base: ca-on/ontario_tax_after_credits
    produces:
      output: ca-on/ontario_surtax
  # ON428 line 69 "Line 62 plus line 68": the Ontario tax after credits plus the surtax.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_after_credits
        - ca-on/ontario_surtax
    produces:
      output: ca-on/ontario_tax_with_surtax
  # ON428 line 74 "Basic reduction 294.00": the dataset becomes an artifact of the same
  # name, the first part of line 77.
  - name: core/credit_amount
    params:
      amount: ca-on/tax_reduction_basic
    produces:
      output: ca-on/tax_reduction_basic
  # ON428 line 75 (line 60969) "Number of dependent children multiplied by $544" and line
  # 76 (line 60970) "Number of dependants multiplied by $544".
  - name: core/per_unit_amount
    params:
      amount: ca-on/tax_reduction_per_dependant
    consumes:
      count: ca-on/dependent_children
    produces:
      output: ca-on/tax_reduction_for_children
  - name: core/per_unit_amount
    params:
      amount: ca-on/tax_reduction_per_dependant
    consumes:
      count: ca-on/dependants
    produces:
      output: ca-on/tax_reduction_for_dependants
  # ON428 line 77 "Add lines 74 to 76.", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca-on/tax_reduction_basic
        - ca-on/tax_reduction_for_children
        - ca-on/tax_reduction_for_dependants
    produces:
      output: ca-on/tax_reduction_amounts
  # ON428 line 78 "Amount from line 77 above multiplied by 2", line 79 "Amount from line
  # 73 above" and line 80 "Line 78 minus line 79 (if negative, enter "0") Ontario tax
  # reduction": line 73 is the Ontario tax with surtax while neither the dividend tax
  # credit (line 70) nor the minimum tax (line 72) is modelled.
  - name: core/multiple_over
    params:
      factor: ca-on/tax_reduction_factor
    consumes:
      amount: ca-on/tax_reduction_amounts
      less: ca-on/ontario_tax_with_surtax
    produces:
      output: ca-on/ontario_tax_reduction
  # ON428 line 81 "Line 73 minus line 80 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_with_surtax
      less: ca-on/ontario_tax_reduction
    produces:
      output: ca-on/ontario_tax_after_reduction
  # Schedule ON428-A line 3 "Line 1 plus line 2", line 1 "Amount from line 10100 of your
  # return" (line 2, line 10400, not triggered), and line 5 "Line 3 multiplied by the
  # percentage from line 4 (maximum $875)", line 4 "Applicable rate 5.05%": the rate on
  # employment income, before its maximum.
  - name: core/apply_rate
    params:
      rate: ca-on/lift_rate
    consumes:
      base: ca/employment_income
    produces:
      output: ca-on/lift_credit_before_maximum
  # Line 5's "(maximum $875)" and Part A line 14 "Amount from line 5 above (maximum
  # $875)".
  - name: core/capped_amount
    params:
      cap: ca-on/lift_maximum
    consumes:
      base: ca-on/lift_credit_before_maximum
    produces:
      output: ca-on/lift_maximum_credit
  # Lines 15 to 19: line 15 "Amount from line 13 above", the adjusted net income, which
  # is net income (line 23600) while lines 7, 8, 10 and 11 are not triggered; line 16
  # "Individual income threshold 32,500.00"; line 17 "Line 15 minus line 16 (if
  # negative, enter "0")"; line 18 "Applicable rate 5%"; line 19 "Line 17 multiplied by
  # the percentage from line 18".
  - name: core/tiered_surcharge
    params:
      tiers: ca-on/lift_reduction
    consumes:
      base: ca/net_income
    produces:
      output: ca-on/lift_reduction
  # Line 20 "Line 14 minus line 19 (if negative, enter "0") Enter this amount on line
  # 62140 of your Form ON428.", ON428 line 85.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/lift_maximum_credit
      less: ca-on/lift_reduction
    produces:
      output: ca-on/lift_credit
  # ON428 line 86 "Line 84 minus line 85 (if negative, enter "0")": line 84 "Amount from
  # line 83 of the previous page" carries line 83 "Line 81 minus line 82 (if negative,
  # enter "0")", which is line 81 while line 82 (the provincial foreign tax credit) is not
  # triggered.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_after_reduction
      less: ca-on/lift_credit
    produces:
      output: ca-on/ontario_tax_after_lift_credit
  # ON428 line 87 and line 62150 "Enter the amount of qualifying donations that have also
  # been claimed as a charitable donation." "multiplied by 25%", under "Community food
  # program donation tax credit for farmers:": the donations are a caller input, taken as
  # entered.
  - name: core/apply_rate
    params:
      rate: ca-on/community_food_program_rate
    consumes:
      base: ca-on/community_food_program_donations
    produces:
      output: ca-on/community_food_program_credit
  # ON428 line 88 "Line 86 minus line 87 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_after_lift_credit
      less: ca-on/community_food_program_credit
    produces:
      output: ca-on/ontario_tax_after_food_credit
  # ON428 line 89 "Ontario health premium (complete the chart below)": the chart's tiers
  # on line 1 "Enter your taxable income from line 26000 of your return", each the
  # previous plateau plus a rate on the income over its threshold, at most the next
  # plateau.
  - name: core/tiered_surcharge
    params:
      tiers: ca-on/health_premium
    consumes:
      base: ca/taxable_income
    produces:
      output: ca-on/ontario_health_premium
  # ON428 line 90 "Line 88 plus line 89 Enter this amount on line 42800 of your return.
  # Ontario tax".
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_after_food_credit
        - ca-on/ontario_health_premium
    produces:
      output: ca-on/ontario_tax
  # T1 line 142 (line 42000) "Add lines 139 to 141. Net federal tax": line 126 (42900)
  # "Line 121 minus line 125 (if negative, enter "0") Basic federal tax" is the federal
  # tax after credits, as lines 120 and 124, 127 to 133 and 135 to 141 are not
  # modelled or not triggered, and lines 134 (40600) and 139 (41700) carry it: one part.
  - name: core/sum
    consumes:
      parts:
        - ca/federal_tax_after_credits
    produces:
      output: ca/net_federal_tax
  # T1 line 148 (line 43500) "Add lines 143 to 147. Total payable": line 143 "Amount
  # from line 42000" and line 147 (42800), the Ontario tax, in line order; lines 144 to
  # 146 are not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca/net_federal_tax
        - ca-on/ontario_tax
    produces:
      output: ca/total_payable
  # Schedule 6 line 5 "Add lines 1 to 4. Enter the result, even if it is "0". Working
  # income", line 1 "Employment income and other employment income from line 10100 and
  # line 10400 of the return" (line 10400 and lines 2 to 4 not triggered), carried by
  # line 6 "Add the amounts from line 5 in columns 1 and 2. Enter this amount on line
  # 16. Family working income" with no eligible spouse: one part.
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
    produces:
      output: ca/working_income
  # Schedule 6 line 15 "Line 13 minus line 14 Enter this amount on line 23 and line 35.
  # Adjusted family net income": line 7 "Net income from line 23600 of the return",
  # through lines 10, 12 and 13 with lines 8, 9 and 11 not triggered and no eligible
  # spouse (line 14 not triggered): one part.
  - name: core/sum
    consumes:
      parts:
        - ca/net_income
    produces:
      output: ca/adjusted_family_net_income
  # Schedule 6 lines 16 to 22: line 16 "Family working income from line 6"; line 17
  # "Base amount 3,000.00"; line 18 "Line 16 minus line 17 (if negative, enter "0")";
  # line 19 "Rate 27%"; line 20 "Line 18 multiplied by the percentage from line 19";
  # line 21 "If you had an eligible spouse or an eligible dependant, enter $2,813. If
  # not, enter $1,633."; line 22 "Enter whichever is less: amount from line 20 or line
  # 21.": one tier with a maximum, with no eligible spouse or dependant.
  - name: core/tiered_surcharge
    params:
      tiers: ca/cwb_basic
    consumes:
      base: ca/working_income
    produces:
      output: ca/cwb_before_reduction_without_dependant
  # The same lines with an eligible dependant: line 21's $2,813 as the tier's maximum.
  - name: core/tiered_surcharge
    params:
      tiers: ca/cwb_basic_with_dependant
    consumes:
      base: ca/working_income
    produces:
      output: ca/cwb_before_reduction_with_dependant
  # Schedule 6 lines 23 to 27: line 23 "Adjusted family net income from line 15"; line
  # 24 "If you had an eligible spouse or an eligible dependant, enter $30,639. If not,
  # enter $26,855."; line 25 "Line 23 minus line 24 (if negative, enter "0")"; line 26
  # "Rate 15%"; line 27 "Line 25 multiplied by the percentage from line 26": one tier,
  # with no eligible spouse or dependant.
  - name: core/tiered_surcharge
    params:
      tiers: ca/cwb_reduction
    consumes:
      base: ca/adjusted_family_net_income
    produces:
      output: ca/cwb_reduction_without_dependant
  # The same lines with an eligible dependant: line 24's $30,639 as the tier's threshold.
  - name: core/tiered_surcharge
    params:
      tiers: ca/cwb_reduction_with_dependant
    consumes:
      base: ca/adjusted_family_net_income
    produces:
      output: ca/cwb_reduction_with_dependant
  # Schedule 6 line 28 "Line 22 minus line 27 (if negative, enter "0") If you are not
  # completing Step 3, enter this amount on line 45300 of your return.", with no
  # eligible spouse or dependant: Step 3 (the disability supplement) is not triggered.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cwb_before_reduction_without_dependant
      less: ca/cwb_reduction_without_dependant
    produces:
      output: ca/canada_workers_benefit_without_dependant
  # Line 28 with an eligible dependant.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cwb_before_reduction_with_dependant
      less: ca/cwb_reduction_with_dependant
    produces:
      output: ca/canada_workers_benefit_with_dependant
  # Line 28 for the filer's family status, which lines 21 and 24 read ("If you had an
  # eligible spouse or an eligible dependant ... If not ..."): the line with no eligible
  # spouse or dependant when the number of Schedule 6 eligible dependants (line 38100) is
  # 0, else the line with one; an eligible spouse is not modelled.
  - name: core/choose_by_count
    consumes:
      count: ca/cwb_eligible_dependants
      when_none: ca/canada_workers_benefit_without_dependant
      when_any: ca/canada_workers_benefit_with_dependant
    produces:
      output: ca/canada_workers_benefit
  # Form ON479 line 1 and line 61268 "Eligible medical expenses for fertility treatment
  # multiplied by 25% (maximum $5,000) =": the rate on the expenses, before its maximum.
  - name: core/apply_rate
    params:
      rate: ca-on/fertility_credit_rate
    consumes:
      base: ca-on/fertility_expenses
    produces:
      output: ca-on/fertility_credit_before_maximum
  # Line 1's "(maximum $5,000)", printed after the percentage, so it caps the credit.
  - name: core/capped_amount
    params:
      cap: ca-on/fertility_credit_maximum
    consumes:
      base: ca-on/fertility_credit_before_maximum
    produces:
      output: ca-on/fertility_credit
  # Line 14 "Amount paid in the year for eligible seniors' use of Ontario public transit
  # services (maximum $3,000) Line 63100 multiplied by 15% =": the "(maximum $3,000)" is
  # printed before the percentage, so it caps the amount paid.
  - name: core/capped_amount
    params:
      cap: ca-on/seniors_transit_maximum
    consumes:
      base: ca-on/seniors_transit_paid
    produces:
      output: ca-on/seniors_transit_amount_paid_at_most_maximum
  # Line 14's "multiplied by 15% =", on the capped amount.
  - name: core/apply_rate
    params:
      rate: ca-on/seniors_transit_rate
    consumes:
      base: ca-on/seniors_transit_amount_paid_at_most_maximum
    produces:
      output: ca-on/seniors_transit_credit
  # Form T1221 lines 1 to 3 "Enter the amount of qualifying expenses." (one line for each
  # corporation or slip) and line 4 "Add lines 1 to 3. Enter this amount on line 63220 of your
  # Form ON479.": the expenses of every slip in the list, added.
  - name: ca-on/flow_through_share_expenses
    consumes:
      slips: ca-on/flow_through_share_slips
    produces:
      output: ca-on/flow_through_share_expenses
  # Form ON479 line 17 and line 63220 "Enter your total expenses from your Form T1221.
  # multiplied by 5% =": the 5% on T1221 line 4.
  - name: core/apply_rate
    params:
      rate: ca-on/flow_through_share_rate
    consumes:
      base: ca-on/flow_through_share_expenses
    produces:
      output: ca-on/flow_through_share_credit
  # Line 18 "Add lines 1, 2, 13, 14, 16, and 17. =": lines 1, 14 and 17, in line order, as
  # lines 2, 13 and 16 are not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca-on/fertility_credit
        - ca-on/seniors_transit_credit
        - ca-on/flow_through_share_credit
    produces:
      output: ca-on/ontario_credits_subtotal
  # Line 21 "Line 19 plus line 20 Enter this amount online 47900 of your return. Ontario
  # credits =": line 19 "Amount from line 18 of the previous page" carries line 18, and
  # line 20 (the co-operative education credit) is not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_credits_subtotal
    produces:
      output: ca-on/ontario_credits
  # T1 line 165 and line 47900 "Provincial or territorial credits (complete Form 479, if it
  # applies)": ON479 line 21, the Ontario credits.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_credits
    produces:
      output: ca/provincial_credits
  # T1 line 166 (line 48200) "Add lines 150 to 165. Total credits": line 150 (43700), line
  # 155 (45300) "Canada workers benefit (CWB) (complete Schedule 6)" and line 165 (47900), in
  # line order, as the other lines are not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca/income_tax_deducted
        - ca/canada_workers_benefit
        - ca/provincial_credits
    produces:
      output: ca/total_credits
  # T1 line 167 "Line 149 minus line 166 If the amount is negative, enter it on line
  # 48400 below. If the amount is positive, enter it on line 48500 below. Refund or
  # balance owing": not floored, so a negative result is a refund and a positive one a
  # balance owing.
  - name: core/subtract
    consumes:
      amount: ca/total_payable
      less: ca/total_credits
    produces:
      output: ca/refund_or_balance_owing

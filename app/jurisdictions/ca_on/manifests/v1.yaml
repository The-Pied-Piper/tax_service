# Ontario resident, personal income tax: federal and Ontario together.
# Each selection names a capability and fills its slots (design.md §4): parameter
# slots with families, artifact slots with artifact identifiers. The order is
# derived from the capabilities' contracts in code, never from this list.
# `inputs` are the artifacts a computation starts from; `outputs` are what it returns.
jurisdiction: CA-ON
version: 1
valid_from_tax_year: 2025
inputs:
  - ca/employment_income
  - ca/capital_gain
  - ca/unused_rrsp_contributions
  - ca/rrsp_contributions
  - ca/rrsp_deduction_limit
  - ca/rrsp_amount_deducted
  - ca/union_dues
  - ca-on/dependent_children
  - ca-on/dependants
  - ca/income_tax_deducted
outputs:
  - ca/refund_or_balance_owing
  - ca/unused_rrsp_contributions_carried_forward
capabilities:
  - name: core/apply_rate
    params:
      rate: ca/capital_gains_inclusion_rate
    consumes:
      base: ca/capital_gain
    produces:
      output: ca/taxable_capital_gains
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
        - ca/taxable_capital_gains
    produces:
      output: ca/total_income
  # Schedule 8 Part 3, each contribution on employment income: line 11 (base, 4.95% of the
  # earnings between the $3,500 exemption and the $71,300 ceiling, lines 2 to 7), line 12
  # (first additional, 1% of the same band) and line 22 (second additional, 4% of the
  # earnings between the $71,300 and $81,200 ceilings, lines 2 to 4).
  - name: core/contribution_tier
    params:
      tier: ca/cpp_base_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_base_contributions
  - name: core/contribution_tier
    params:
      tier: ca/cpp_first_additional_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_first_additional_contributions
  - name: core/contribution_tier
    params:
      tier: ca/cpp_second_additional_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_second_additional_contributions
  # T1 line 31200 "through employment (boxes 18 and 55 of all T4 slips) (maximum
  # $1,077.48)": the EI premiums, 1.64% of the employment income up to the $65,700
  # maximum insurable earnings, with no exemption (the EI premium rates and maximums,
  # 2025 federal row).
  - name: core/contribution_tier
    params:
      tier: ca/ei_premium
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/ei_premiums
  # Schedule 8 Part 3a line 28 "Line 26 plus line 27": the first and second additional
  # contributions together, the T1 line 22215 deduction.
  - name: core/sum
    consumes:
      parts:
        - ca/cpp_first_additional_contributions
        - ca/cpp_second_additional_contributions
    produces:
      output: ca/cpp_enhanced_contributions
  # Schedule 7 line 5 "Line 1 plus line 4 ... Total contributions", line 6 "Total
  # contributions from line 5" and line 10 "Line 6 minus line 9 Contributions available
  # to deduct": with no HBP or LLP repayments (line 9), line 10 is line 5. In line 5's
  # order: the unused contributions (line 1), then the contributions (line 4).
  - name: core/sum
    consumes:
      parts:
        - ca/unused_rrsp_contributions
        - ca/rrsp_contributions
    produces:
      output: ca/rrsp_contributions_available
  # Schedule 7 line 17 "Enter whichever is less: amount from line 13 or line 16.": with
  # no employer PRPP contributions (line 12) and no transfers (line 15), line 13 is the
  # limit and line 16 the contributions available to deduct. The parts keep line 20's
  # order (line 10, then the limit).
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/rrsp_contributions_available
        - ca/rrsp_deduction_limit
    produces:
      output: ca/rrsp_deduction_maximum
  # Schedule 7 line 18 "Enter your RRSP, PRPP, or SPP contributions you are deducting for
  # 2025 (cannot be more than the amount on line 17).", line 19 "Line 15 plus line 18"
  # and line 20 "Enter whichever is less: amount from line 10 or line 19. Enter this
  # amount on line 20800 of your return. RRSP deduction": with no transfers (line 15),
  # line 19 is line 18, at most line 17 and so at most line 10, and line 20 is line 18
  # itself. A claim above line 17 is refused, not capped.
  - name: core/at_most
    consumes:
      amount: ca/rrsp_amount_deducted
      bound: ca/rrsp_deduction_maximum
    produces:
      output: ca/rrsp_deduction
  # Schedule 7 line 23 "Line 21 minus line 22 Your unused contributions available to
  # carry forward to a future year": line 21 "Enter your contributions available to
  # deduct from line 10 of the previous page." less line 22 "Enter your RRSP deduction
  # from line 20 of the previous page."; never negative, as line 20 is at most line 10.
  - name: core/subtract
    consumes:
      amount: ca/rrsp_contributions_available
      less: ca/rrsp_deduction
    produces:
      output: ca/unused_rrsp_contributions_carried_forward
  - name: core/sum
    consumes:
      parts:
        - ca/rrsp_deduction
        - ca/union_dues
        - ca/cpp_enhanced_contributions
    produces:
      output: ca/deductions_from_total_income
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/total_income
      less: ca/deductions_from_total_income
    produces:
      output: ca/net_income
  - name: core/sum
    consumes:
      parts: []
    produces:
      output: ca/deductions_from_net_income
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/net_income
      less: ca/deductions_from_net_income
    produces:
      output: ca/taxable_income
  - name: core/progressive_tax
    params:
      schedule: ca/brackets
    consumes:
      base: ca/taxable_income
    produces:
      output: ca/federal_basic_tax
  - name: core/progressive_tax
    params:
      schedule: ca-on/brackets
    consumes:
      base: ca/taxable_income
    produces:
      output: ca-on/ontario_basic_tax
  # T1 line 30000 "If the amount on line 23600 is $177,882 or less, enter $16,129. If
  # the amount on line 23600 is $253,414 or more, enter $14,538. Otherwise, use the
  # Federal Worksheet to calculate the amount to enter. (maximum $16,129)": the federal
  # basic personal amount is the worksheet's taper on net income (line 23600), the first
  # part of the T1's total of credit amounts.
  - name: core/tapered_amount
    params:
      taper: ca/basic_personal_amount
    consumes:
      base: ca/net_income
    produces:
      output: ca/basic_personal_amount
  # ON428 line 58040 has no reduction: the Ontario basic personal amount dataset becomes
  # an artifact of the same name, the first part of ON428's total of credit amounts.
  - name: core/credit_amount
    params:
      amount: ca-on/basic_personal_amount
    produces:
      output: ca-on/basic_personal_amount
  # The Canada employment amount: the lesser of the T1's cap and employment income.
  - name: core/capped_amount
    params:
      cap: ca/canada_employment_amount
    consumes:
      base: ca/employment_income
    produces:
      output: ca/canada_employment_amount
  # Each form's total of credit amounts is its basic personal amount, the base CPP
  # contributions and the EI premiums, in the forms' line order; the T1's also holds the
  # Canada employment amount. ON428 lines 58240 and 58300 are "Amount from line 30800 /
  # 31200 of your return", so the Ontario sum reads the federal kinds.
  - name: core/sum
    consumes:
      parts:
        - ca/basic_personal_amount
        - ca/cpp_base_contributions
        - ca/ei_premiums
        - ca/canada_employment_amount
    produces:
      output: ca/non_refundable_credit_amounts
  - name: core/sum
    consumes:
      parts:
        - ca-on/basic_personal_amount
        - ca/cpp_base_contributions
        - ca/ei_premiums
    produces:
      output: ca-on/non_refundable_credit_amounts
  # The rate is applied once, to each form's total of credit amounts (T1 line 33800, ON428
  # line 58840), giving its non-refundable tax credits (T1 line 35000, ON428 line 61500).
  - name: core/apply_rate
    params:
      rate: ca/credit_rate
    consumes:
      base: ca/non_refundable_credit_amounts
    produces:
      output: ca/non_refundable_tax_credits
  - name: core/apply_rate
    params:
      rate: ca-on/credit_rate
    consumes:
      base: ca-on/non_refundable_credit_amounts
    produces:
      output: ca-on/non_refundable_tax_credits
  # Each form's credits come off its basic tax, not below zero: the unused part is lost.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/federal_basic_tax
      less: ca/non_refundable_tax_credits
    produces:
      output: ca/federal_tax_after_credits
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_basic_tax
      less: ca-on/non_refundable_tax_credits
    produces:
      output: ca-on/ontario_tax_after_credits
  # ON428 lines 66 to 68: the surtax on line 65, which is the Ontario tax after credits
  # while line 64 (tax on split income) is not modelled.
  - name: core/tiered_surcharge
    params:
      tiers: ca-on/surtax
    consumes:
      base: ca-on/ontario_tax_after_credits
    produces:
      output: ca-on/ontario_surtax
  # ON428 line 69 "Line 62 plus line 68": the Ontario tax after credits plus the surtax.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_after_credits
        - ca-on/ontario_surtax
    produces:
      output: ca-on/ontario_tax_with_surtax
  # ON428 line 74 "Basic reduction 294.00": the dataset becomes an artifact of the same
  # name, the first part of line 77.
  - name: core/credit_amount
    params:
      amount: ca-on/tax_reduction_basic
    produces:
      output: ca-on/tax_reduction_basic
  # ON428 line 75 (line 60969) "Number of dependent children multiplied by $544" and line
  # 76 (line 60970) "Number of dependants multiplied by $544".
  - name: core/per_unit_amount
    params:
      amount: ca-on/tax_reduction_per_dependant
    consumes:
      count: ca-on/dependent_children
    produces:
      output: ca-on/tax_reduction_for_children
  - name: core/per_unit_amount
    params:
      amount: ca-on/tax_reduction_per_dependant
    consumes:
      count: ca-on/dependants
    produces:
      output: ca-on/tax_reduction_for_dependants
  # ON428 line 77 "Add lines 74 to 76.", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca-on/tax_reduction_basic
        - ca-on/tax_reduction_for_children
        - ca-on/tax_reduction_for_dependants
    produces:
      output: ca-on/tax_reduction_amounts
  # ON428 line 78 "Amount from line 77 above multiplied by 2", line 79 "Amount from line
  # 73 above" and line 80 "Line 78 minus line 79 (if negative, enter "0") Ontario tax
  # reduction": line 73 is the Ontario tax with surtax while neither the dividend tax
  # credit (line 70) nor the minimum tax (line 72) is modelled.
  - name: core/multiple_over
    params:
      factor: ca-on/tax_reduction_factor
    consumes:
      amount: ca-on/tax_reduction_amounts
      less: ca-on/ontario_tax_with_surtax
    produces:
      output: ca-on/ontario_tax_reduction
  # ON428 line 81 "Line 73 minus line 80 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_with_surtax
      less: ca-on/ontario_tax_reduction
    produces:
      output: ca-on/ontario_tax_after_reduction
  # ON428 line 89 "Ontario health premium (complete the chart below)": the chart's tiers
  # on line 1 "Enter your taxable income from line 26000 of your return", each the
  # previous plateau plus a rate on the income over its threshold, at most the next
  # plateau.
  - name: core/tiered_surcharge
    params:
      tiers: ca-on/health_premium
    consumes:
      base: ca/taxable_income
    produces:
      output: ca-on/ontario_health_premium
  # ON428 line 90 "Line 88 plus line 89 Enter this amount on line 42800 of your return.
  # Ontario tax": line 88 carries line 81, as the LIFT credit (line 85) is not yet
  # computed and neither the provincial foreign tax credit (line 82) nor the community
  # food program donation tax credit for farmers (line 87) is triggered.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_after_reduction
        - ca-on/ontario_health_premium
    produces:
      output: ca-on/ontario_tax
  # T1 line 142 (line 42000) "Add lines 139 to 141. Net federal tax": line 126 (42900)
  # "Line 121 minus line 125 (if negative, enter "0") Basic federal tax" is the federal
  # tax after credits, as lines 120, 123, 124, 127 to 133 and 135 to 141 are not
  # modelled or not triggered, and lines 134 (40600) and 139 (41700) carry it: one part.
  - name: core/sum
    consumes:
      parts:
        - ca/federal_tax_after_credits
    produces:
      output: ca/net_federal_tax
  # T1 line 148 (line 43500) "Add lines 143 to 147. Total payable": line 143 "Amount
  # from line 42000" and line 147 (42800), the Ontario tax, in line order; lines 144 to
  # 146 are not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca/net_federal_tax
        - ca-on/ontario_tax
    produces:
      output: ca/total_payable
  # T1 line 166 (line 48200) "Add lines 150 to 165. Total credits": line 150 (43700)
  # alone, as lines 151 to 165 are not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca/income_tax_deducted
    produces:
      output: ca/total_credits
  # T1 line 167 "Line 149 minus line 166 If the amount is negative, enter it on line
  # 48400 below. If the amount is positive, enter it on line 48500 below. Refund or
  # balance owing": not floored, so a negative result is a refund and a positive one a
  # balance owing.
  - name: core/subtract
    consumes:
      amount: ca/total_payable
      less: ca/total_credits
    produces:
      output: ca/refund_or_balance_owing

  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/medical_expenses
      less: ca-on/medical_threshold
    produces:
      output: ca-on/medical_expenses_over_threshold
  # ON428 line 42 and line 58729 "Allowable amount of medical expenses for other dependants
  # (use Worksheet ON428)"; Worksheet ON428, line 58729, for each dependant: line 1 "Medical
  # expenses for other dependant", line 2 "Enter the amount from line 40 of the dependant's
  # Form ON428.", line 3 "Line 1 minus line 2 (if negative, enter "0") (maximum $15,551 per
  # dependant)", and line 4 "Add the amounts from line 3 of columns 1, 2, and 3 (and others,
  # if any). Enter this amount on line 58729 of your Form ON428." The same people as T1 line
  # 33199, so the same record list.
  - name: ca/other_dependants_medical
    params:
      reduction: ca-on/other_dependants_medical_reduction
    consumes:
      dependants: ca/other_dependants
    produces:
      output: ca-on/other_dependants_medical
  # ON428 line 43 and line 58769 "Line 41 plus line 42".
  - name: core/sum
    consumes:
      parts:
        - ca-on/medical_expenses_over_threshold
        - ca-on/other_dependants_medical
    produces:
      output: ca-on/medical_claim
  # T1 line 108 "Amount from line 23600" "multiplied by 3%": 3% of the net income.
  - name: core/apply_rate
    params:
      rate: ca/medical_net_income_rate
    consumes:
      base: ca/net_income
    produces:
      output: ca/medical_net_income_share
  # T1 line 109 "Enter whichever is less: $2,834 or the amount from line 108."
  - name: core/capped_amount
    params:
      cap: ca/medical_threshold_ceiling
    consumes:
      base: ca/medical_net_income_share
    produces:
      output: ca/medical_threshold
  # T1 line 107 and line 33099 "Medical expenses for self, spouse or common-law partner and
  # your dependent children under 18 years of age", a caller input, and line 110 "Line 107
  # minus line 109 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/medical_expenses
      less: ca/medical_threshold
    produces:
      output: ca/medical_expenses_over_threshold
  # T1 line 111 and line 33199 "Allowable amount of medical expenses for other dependants
  # (use Federal Worksheet)"; Federal Worksheet, line 33199, for each dependant: line 1
  # "Medical expenses for other dependant", line 2 "For provinces and territories other
  # than Quebec: amount from line 109 of the dependant's return.", line 3 "Line 1 minus
  # line 2 (if negative, enter "0")", and line 4 "Add the amounts from line 3 of columns 1,
  # 2, and 3 (and others, if any). Enter this amount on line 33199 of your return."
  - name: ca/other_dependants_medical
    params:
      reduction: ca/other_dependants_medical_reduction
    consumes:
      dependants: ca/other_dependants
    produces:
      output: ca/other_dependants_medical
  # T1 line 112 and line 33200 "Line 110 plus line 111".
  - name: core/sum
    consumes:
      parts:
        - ca/medical_expenses_over_threshold
        - ca/other_dependants_medical
    produces:
      output: ca/medical_claim
  # ON428 line 17 and line 58185 "Ontario caregiver amount (use Worksheet ON428)", Worksheet
  # ON428 "Line 58185 - Ontario caregiver amount": for each dependant, line 1 "Base amount
  # 26,562.00" less line 2 "Dependant's net income from line 23600 of their return", line 3
  # "Line 1 minus line 2 (if negative, enter "0") (maximum $6,008 per dependant)", line 4
  # "Amount claimed for this dependant on line 58160 of your Form ON428, if any", line 5
  # "Allowable amount for this dependant: line 3 minus line 4 (if negative, enter "0")" and
  # line 6 "Add the amounts from line 5 of columns 1, 2, and 3 (and others, if any). Enter
  # this amount on line 58185 of your Form ON428."
  - name: ca-on/caregiver_amount
    params:
      base: ca-on/caregiver_base_amount
      maximum: ca-on/caregiver_maximum_amount
    consumes:
      dependants: ca-on/caregiver_dependants
      eligible_dependant_amount: ca-on/eligible_dependant_amount
    produces:
      output: ca-on/caregiver_amount
  # T1 line 33500 (lines 30000, 30100, 30300, 30400, 30425, 30450, 30500, 30800, 31200,
  # 31260, 31800, 33200) and ON428 line 58800 (lines 58040, 58080, 58120, 58160, 58185, 58240,
  # 58300, 58769), in the forms' line order. T1 line 113 and line 33500 is "Line 106 plus line
  # 112", and line 112 (line 33200) follows the lines that line 106 adds; ON428 line 44 and line
  # 58800 is "Line 35 plus line 43", and line 43 (line 58769) follows the lines that line 35
  # adds. ON428 lines 58240 and 58300 are "Amount from line 30800 / 31200 of your return", so the
  # Ontario sum reads the federal kinds; it has no Canada employment amount.
  - name: core/sum
    consumes:
      parts:
        - ca/basic_personal_amount
        - ca/age_amount
        - ca/spouse_amount
        - ca/eligible_dependant_amount
        - ca/spouse_caregiver_amount
        - ca/caregiver_amount
        - ca/infirm_children_amount
        - ca/cpp_base_contributions
        - ca/ei_premiums
        - ca/canada_employment_amount
        - ca/disability_transferred_amount
        - ca/medical_claim
    produces:
      output: ca/non_refundable_credit_amounts
  - name: core/sum
    consumes:
      parts:
        - ca-on/basic_personal_amount
        - ca-on/age_amount
        - ca-on/spouse_amount
        - ca-on/eligible_dependant_amount
        - ca-on/caregiver_amount
        - ca/cpp_base_contributions
        - ca/ei_premiums
        - ca-on/medical_claim
    produces:
      output: ca-on/non_refundable_credit_amounts
  # Schedule 9 chart for line 33700 "Gifts of capital property that is depreciable
  # property", line 4 "Enter whichever is less: amount from line 2 or line 3.": the net
  # proceeds of disposition of the property donated in 2025 (line 2) and its capital cost
  # (line 3), caller inputs for the one class and property the return claims.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/depreciable_gift_net_proceeds
        - ca/depreciable_gift_capital_cost
    produces:
      output: ca/depreciable_gift_proceeds_or_cost
  # Schedule 9 chart for line 33700, line 5 "Enter whichever is less: amount from line 1 or
  # line 4. Enter this amount on line 33700 of the previous page.": line 1 "Amount of
  # recaptured depreciation included on your 2025 return" is a caller input. This is the
  # previous page's line B, "Gifts of capital property that are depreciable property".
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/depreciable_gift_recaptured_depreciation
        - ca/depreciable_gift_proceeds_or_cost
    produces:
      output: ca/depreciable_gifts
  # Schedule 9 chart for line 33900 "Gifts of capital property", line 3 "Line 1 minus Line 2
  # Enter this amount on line 33900 on the previous page.": line 1 "Amount of current-year
  # taxable capital gains from capital property donated in 2025" and line 2 "Amount of
  # current-year capital gains deduction from capital property donated in 2025" are caller
  # inputs. This is the previous page's line C, "Gifts of capital property".
  - name: core/subtract
    consumes:
      amount: ca/capital_gift_taxable_gains
      less: ca/capital_gift_gains_deduction
    produces:
      output: ca/capital_property_gifts
  # Schedule 9 line 5 "Add lines 1 to 4. Total eligible amount of charitable donations":
  # line 1 donations to registered charities and similar organizations, line 2 (line 32900)
  # donations to the Government of Canada, a province or territory and similar bodies, line
  # 3 (line 33300) donations to registered universities outside Canada and line 4 (line
  # 33400) donations to the United Nations and its agencies and registered foreign
  # charities, caller inputs taken as the receipts state them, with any unused donations of
  # the previous five years that the filer chooses to claim.
  - name: core/sum
    consumes:
      parts:
        - ca/charitable_donations
        - ca/government_donations
        - ca/university_donations_outside_canada
        - ca/foreign_charity_donations
    produces:
      output: ca/total_charitable_donations
  # Schedule 9 line 6 "Enter your net income from line 23600 of your return. Line A"
  # "multiplied by 75%": 75% of the net income.
  - name: core/apply_rate
    params:
      rate: ca/donation_net_income_rate
    consumes:
      base: ca/net_income
    produces:
      output: ca/donation_limit_on_net_income
  # Schedule 9 line 7 "Amount B plus amount C Line D" "multiplied by 25%": line D is the
  # gifts of capital property that are depreciable property (line B, line 33700) plus the
  # gifts of capital property (line C, line 33900), and line 7 is 25% of it.
  - name: core/sum
    consumes:
      parts:
        - ca/depreciable_gifts
        - ca/capital_property_gifts
    produces:
      output: ca/capital_gifts_total
  - name: core/apply_rate
    params:
      rate: ca/capital_gifts_limit_rate
    consumes:
      base: ca/capital_gifts_total
    produces:
      output: ca/capital_gifts_limit_addition
  # Schedule 9 line 8 "Line 6 plus line 7".
  - name: core/sum
    consumes:
      parts:
        - ca/donation_limit_on_net_income
        - ca/capital_gifts_limit_addition
    produces:
      output: ca/donation_limit_with_capital_gifts
  # Schedule 9 line 9 "Enter whichever is less: amount A or line 8. Total charitable
  # donations limit": amount A is the net income of line 6, so the 25% of the gifts of
  # capital property can raise the limit above 75% of the net income, but not above the net
  # income itself.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/net_income
        - ca/donation_limit_with_capital_gifts
    produces:
      output: ca/charitable_donations_limit
  # Schedule 9 line 10 and line 34000 "Enter whichever is less: amount from line 5 or line
  # 9."
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/total_charitable_donations
        - ca/charitable_donations_limit
    produces:
      output: ca/charitable_donations_claimed
  # Schedule 9 line 11 and line 34200 "Eligible amount of ecological gifts and cultural
  # gifts (see Guide P113)", a caller input, and line 12 "Line 10 plus line 11".
  - name: core/sum
    consumes:
      parts:
        - ca/charitable_donations_claimed
        - ca/ecological_and_cultural_gifts
    produces:
      output: ca/donations_and_gifts_total
  # Schedule 9 line 13 "Enter whichever is less: amount from line 12 or $200.": the $200 is
  # a dataset, claimed whole.
  - name: core/credit_amount
    params:
      amount: ca/donation_first_tier_maximum
    produces:
      output: ca/donation_first_tier_maximum
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/donations_and_gifts_total
        - ca/donation_first_tier_maximum
    produces:
      output: ca/donations_first_tier
  # Schedule 9 line 14 "Line 12 minus line 13".
  - name: core/subtract
    consumes:
      amount: ca/donations_and_gifts_total
      less: ca/donations_first_tier
    produces:
      output: ca/donations_over_first_tier
  # Schedule 9 line 15 and line 34210 "Total ecological gifts made after February 10, 2014,
  # and before 2016 included in the amount on line 11", a caller input, and line 16 "Line 14
  # minus line 15 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/donations_over_first_tier
      less: ca/ecological_gifts_before_2016
    produces:
      output: ca/donations_over_first_tier_after_2016_gifts
  # Schedule 9 line 18 "Income threshold 253,414.00": the dataset becomes an artifact of the
  # same name.
  - name: core/credit_amount
    params:
      amount: ca/donation_high_income_threshold
    produces:
      output: ca/donation_high_income_threshold
  # Schedule 9 line 17 "Enter your taxable income from line 26000 of your return." and line
  # 19 "Line 17 minus line 18 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/taxable_income
      less: ca/donation_high_income_threshold
    produces:
      output: ca/taxable_income_over_donation_threshold
  # Schedule 9 line 20 "Enter whichever is less: amount from line 16 or line 19. Line F"
  # "multiplied by 33%": line F, then 33% of it.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/donations_over_first_tier_after_2016_gifts
        - ca/taxable_income_over_donation_threshold
    produces:
      output: ca/high_income_donations
  - name: core/apply_rate
    params:
      rate: ca/donation_high_income_rate
    consumes:
      base: ca/high_income_donations
    produces:
      output: ca/high_income_donation_credit
  # Schedule 9 line 21 "Amount E minus amount F Line G" "multiplied by 29%": amount E is the
  # amount from line 14 of the previous page and amount F is line F; line G, then 29% of it.
  - name: core/subtract
    consumes:
      amount: ca/donations_over_first_tier
      less: ca/high_income_donations
    produces:
      output: ca/regular_rate_donations
  - name: core/apply_rate
    params:
      rate: ca/donation_regular_rate
    consumes:
      base: ca/regular_rate_donations
    produces:
      output: ca/regular_rate_donation_credit
  # Schedule 9 line 22 "Amount from line 13 of the previous page Line H" "multiplied by
  # 14.5%".
  - name: core/apply_rate
    params:
      rate: ca/donation_first_tier_rate
    consumes:
      base: ca/donations_first_tier
    produces:
      output: ca/first_tier_donation_credit
  # Schedule 9 line 23 "Add lines 20 to 22. Enter this amount on line 34900 of your return.
  # Allowable donations for 2025", T1 line 116 (line 34900) "Donations and gifts (complete
  # Schedule 9)".
  - name: core/sum
    consumes:
      parts:
        - ca/high_income_donation_credit
        - ca/regular_rate_donation_credit
        - ca/first_tier_donation_credit
    produces:
      output: ca/donations_and_gifts_credit
  # T1 line 115 (line 33800) "Line 113 multiplied by the percentage from line 114": the
  # federal credit rate is applied once, to the total of credit amounts. It is the first of
  # the three lines that line 35000 adds, and the base of the top-up tax credit.
  - name: core/apply_rate
    params:
      rate: ca/credit_rate
    consumes:
      base: ca/non_refundable_credit_amounts
    produces:
      output: ca/credit_amounts_at_credit_rate
  # ON428 line 46 (line 58840) "Line 44 multiplied by the percentage from line 45": the
  # Ontario credit rate is applied once, to the total of credit amounts. It is the first of
  # the two lines that line 50 adds.
  - name: core/apply_rate
    params:
      rate: ca-on/credit_rate
    consumes:
      base: ca-on/non_refundable_credit_amounts
    produces:
      output: ca-on/credit_amounts_at_credit_rate
  # ON428 line 47 "Amount from line 13 of your federal Schedule 9" "multiplied by 5.05%":
  # 5.05% of the first $200 of the donations and gifts, the federal Schedule 9 line 13.
  - name: core/apply_rate
    params:
      rate: ca-on/donation_first_tier_rate
    consumes:
      base: ca/donations_first_tier
    produces:
      output: ca-on/donations_first_tier_credit
  # ON428 line 48 "Amount from line 14 of your federal Schedule 9" "multiplied by 11.16%":
  # 11.16% of the rest of the donations and gifts, the federal Schedule 9 line 14.
  - name: core/apply_rate
    params:
      rate: ca-on/donation_over_first_tier_rate
    consumes:
      base: ca/donations_over_first_tier
    produces:
      output: ca-on/donations_over_first_tier_credit
  # ON428 line 49 and line 58969 "Line 47 plus line 48".
  - name: core/sum
    consumes:
      parts:
        - ca-on/donations_first_tier_credit
        - ca-on/donations_over_first_tier_credit
    produces:
      output: ca-on/donations_and_gifts_credit
  # ON428 line 50 and line 61500 "Line 46 plus line 49 Enter this amount on line 52.
  # Ontario non-refundable tax credits": line 46 (line 58840) and line 49 (line 58969), in
  # line order.
  - name: core/sum
    consumes:
      parts:
        - ca-on/credit_amounts_at_credit_rate
        - ca-on/donations_and_gifts_credit
    produces:
      output: ca-on/non_refundable_tax_credits
  # Federal Worksheet 5000-D1, "Line 34990 - Top-up tax credit": line 1 "Amount from line
  # 33800 of your return", line 2 "Amount from line 22 of your Schedule 9" and line 3 "Line
  # 1 plus line 2".
  - name: core/sum
    consumes:
      parts:
        - ca/credit_amounts_at_credit_rate
        - ca/first_tier_donation_credit
    produces:
      output: ca/top_up_credits_base
  # Federal Worksheet 5000-D1, "Line 34990 - Top-up tax credit", line 4 "8,319.38": the
  # dataset becomes an artifact of the same name; line 5 "Line 3 minus line 4 (if negative,
  # enter "0")".
  - name: core/credit_amount
    params:
      amount: ca/top_up_threshold
    produces:
      output: ca/top_up_threshold
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/top_up_credits_base
      less: ca/top_up_threshold
    produces:
      output: ca/top_up_excess
  # Federal Worksheet 5000-D1, "Line 34990 - Top-up tax credit", line 6 "Applicable rate
  # 3.45%" and line 7 "Line 5 multiplied by the percentage from line 6 Enter this amount on
  # line 34990 of your return.", T1 line 117 (line 34990) "Top-up tax credit (use Federal
  # Worksheet)".
  - name: core/apply_rate
    params:
      rate: ca/top_up_rate
    consumes:
      base: ca/top_up_excess
    produces:
      output: ca/top_up_tax_credit
  # T1 line 118 (line 35000) "Add lines 115 to 117. Total federal non-refundable tax
  # credits": line 115 (line 33800), line 116 (line 34900) and line 117 (line 34990), in
  # line order.
  - name: core/sum
    consumes:
      parts:
        - ca/credit_amounts_at_credit_rate
        - ca/donations_and_gifts_credit
        - ca/top_up_tax_credit
    produces:
      output: ca/non_refundable_tax_credits
  # T1 line 123 (40425) "Federal dividend tax credit (use Federal Worksheet)": the Federal
  # Worksheet's "Line 40425 - Federal dividend tax credit", line 5 "Add lines 1 to 4." of
  # the credits shown on the T3, T4PS, T5 and T5013 slips. For dividends with no
  # information slip, line A "Amount from line 12000 of your return (Note 1)" and line B
  # "Amount from line 12010 of your return (Note 1)", Note 1 being "Enter only the amount
  # of dividends that were not shown on an information slip.", so line A is the
  # Worksheet's line 17 and line B its line 16, each its own step; line 6 is "Line B,
  # multiplied by 9.0301%"; line C is "Amount A minus amount B", and line 7 (printed "Line
  # 2") is line C "multiplied by 15.0198%"; line 8 is "Line 6 plus line 7" and line 9 "Line
  # 5 plus line 8 Enter this amount on line 40425 of your return."
  - name: core/sum
    consumes:
      parts:
        - ca/t3_dividend_tax_credit
        - ca/t4ps_dividend_tax_credit
        - ca/t5_dividend_tax_credit
        - ca/t5013_dividend_tax_credit
    produces:
      output: ca/slip_dividend_tax_credit
  - name: core/sum
    consumes:
      parts:
        - ca/dividends_without_a_slip_grossed_up
    produces:
      output: ca/dividends_amount_a
  - name: core/sum
    consumes:
      parts:
        - ca/other_dividends_grossed_up
    produces:
      output: ca/dividends_amount_b
  - name: core/apply_rate
    params:
      rate: ca/dividend_credit_rate_other_than_eligible
    consumes:
      base: ca/dividends_amount_b
    produces:
      output: ca/other_dividends_credit
  - name: core/subtract
    consumes:
      amount: ca/dividends_amount_a
      less: ca/dividends_amount_b
    produces:
      output: ca/dividends_amount_a_less_b
  - name: core/apply_rate
    params:
      rate: ca/dividend_credit_rate_eligible
    consumes:
      base: ca/dividends_amount_a_less_b
    produces:
      output: ca/eligible_dividends_credit
  - name: core/sum
    consumes:
      parts:
        - ca/other_dividends_credit
        - ca/eligible_dividends_credit
    produces:
      output: ca/no_slip_dividend_tax_credit
  - name: core/sum
    consumes:
      parts:
        - ca/slip_dividend_tax_credit
        - ca/no_slip_dividend_tax_credit
    produces:
      output: ca/dividend_tax_credit
  # T1 line 125 "Add lines 122 to 124.": line 122 "Amount from line 35000" and line 123
  # (40425), in line order; line 124 (40427, minimum tax carryover) is not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca/non_refundable_tax_credits
        - ca/dividend_tax_credit
    produces:
      output: ca/credits_against_basic_federal_tax
  # Each form's credits come off its basic tax, not below zero: the unused part is lost.
  # Federally the credits are line 125 (T1 line 126 "Line 121 minus line 125 (if negative,
  # enter "0")").
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/federal_basic_tax
      less: ca/credits_against_basic_federal_tax
    produces:
      output: ca/federal_tax_after_credits
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_basic_tax
      less: ca-on/non_refundable_tax_credits
    produces:
      output: ca-on/ontario_tax_after_credits
  # ON428 lines 66 to 68: the surtax on line 65, which is the Ontario tax after credits
  # while line 64 (tax on split income) is not modelled.
  - name: core/tiered_surcharge
    params:
      tiers: ca-on/surtax
    consumes:
      base: ca-on/ontario_tax_after_credits
    produces:
      output: ca-on/ontario_surtax
  # ON428 line 69 "Line 62 plus line 68": the Ontario tax after credits plus the surtax.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_after_credits
        - ca-on/ontario_surtax
    produces:
      output: ca-on/ontario_tax_with_surtax
  # ON428 line 56 "Enter the amount from line 53 above.", line 57 (printed "Line 57 and
  # line and line 61520") "Ontario dividend tax credit (use Worksheet ON428)" and line 58
  # "Line 56 minus line 57 (if negative, enter "0")". Worksheet ON428's "Line 61520 -
  # Ontario dividend tax credit": line A "Amount from line 12000 of your return" and line
  # 1 "Amount from line 12010 of your return Line B" "multiplied by 2.9863%", with no Note
  # 1, so A and B are the whole lines 12000 and 12010, each its own step; line 2 "Amount
  # A minus amount B Line C" "multiplied by 10%"; line 3 "Line 1 plus line 2 Enter this
  # amount on line 61520 of your Form ON428.", which is line 57.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_after_credits
    produces:
      output: ca-on/ontario_tax_before_dividend_credit
  - name: core/sum
    consumes:
      parts:
        - ca/taxable_dividends
    produces:
      output: ca-on/dividends_amount_a
  - name: core/sum
    consumes:
      parts:
        - ca/taxable_dividends_other_than_eligible
    produces:
      output: ca-on/dividends_amount_b
  - name: core/apply_rate
    params:
      rate: ca-on/dividend_credit_rate_other_than_eligible
    consumes:
      base: ca-on/dividends_amount_b
    produces:
      output: ca-on/other_dividends_credit
  - name: core/subtract
    consumes:
      amount: ca-on/dividends_amount_a
      less: ca-on/dividends_amount_b
    produces:
      output: ca-on/dividends_amount_a_less_b
  - name: core/apply_rate
    params:
      rate: ca-on/dividend_credit_rate_eligible
    consumes:
      base: ca-on/dividends_amount_a_less_b
    produces:
      output: ca-on/eligible_dividends_credit
  - name: core/sum
    consumes:
      parts:
        - ca-on/other_dividends_credit
        - ca-on/eligible_dividends_credit
    produces:
      output: ca-on/dividend_tax_credit
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_before_dividend_credit
      less: ca-on/dividend_tax_credit
    produces:
      output: ca-on/ontario_tax_less_dividend_credit
  # ON428 line 70 "Ontario dividend tax credit from line 57" and line 71 "Line 69 minus
  # line 70 (if negative, enter "0")": line 71 is line 73, as line 72 (the additional tax
  # for minimum tax purposes) is not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca-on/dividend_tax_credit
    produces:
      output: ca-on/dividend_credit_from_line_57
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_with_surtax
      less: ca-on/dividend_credit_from_line_57
    produces:
      output: ca-on/ontario_tax_after_dividend_credit
  # ON428 line 74 "Basic reduction 294.00": the dataset becomes an artifact of the same
  # name, the first part of line 77.
  - name: core/credit_amount
    params:
      amount: ca-on/tax_reduction_basic
    produces:
      output: ca-on/tax_reduction_basic
  # ON428 line 75 (line 60969) "Number of dependent children multiplied by $544" and line
  # 76 (line 60970) "Number of dependants multiplied by $544".
  - name: core/per_unit_amount
    params:
      amount: ca-on/tax_reduction_per_dependant
    consumes:
      count: ca-on/dependent_children
    produces:
      output: ca-on/tax_reduction_for_children
  - name: core/per_unit_amount
    params:
      amount: ca-on/tax_reduction_per_dependant
    consumes:
      count: ca-on/dependants
    produces:
      output: ca-on/tax_reduction_for_dependants
  # ON428 line 77 "Add lines 74 to 76.", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca-on/tax_reduction_basic
        - ca-on/tax_reduction_for_children
        - ca-on/tax_reduction_for_dependants
    produces:
      output: ca-on/tax_reduction_amounts
  # ON428 line 78 "Amount from line 77 above multiplied by 2", line 79 "Amount from line
  # 73 above" and line 80 "Line 78 minus line 79 (if negative, enter "0") Ontario tax
  # reduction": line 73 is line 71, the Ontario tax after the dividend credit, while the
  # minimum tax (line 72) is not triggered.
  - name: core/multiple_over
    params:
      factor: ca-on/tax_reduction_factor
    consumes:
      amount: ca-on/tax_reduction_amounts
      less: ca-on/ontario_tax_after_dividend_credit
    produces:
      output: ca-on/ontario_tax_reduction
  # ON428 line 81 "Line 73 minus line 80 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_after_dividend_credit
      less: ca-on/ontario_tax_reduction
    produces:
      output: ca-on/ontario_tax_after_reduction
  # Schedule ON428-A line 3 "Line 1 plus line 2", line 1 "Amount from line 10100 of your
  # return" (line 2, line 10400, not triggered), and line 5 "Line 3 multiplied by the
  # percentage from line 4 (maximum $875)", line 4 "Applicable rate 5.05%": the rate on
  # employment income, before its maximum.
  - name: core/apply_rate
    params:
      rate: ca-on/lift_rate
    consumes:
      base: ca/employment_income
    produces:
      output: ca-on/lift_credit_before_maximum
  # Line 5's "(maximum $875)" and Part A line 14 "Amount from line 5 above (maximum
  # $875)".
  - name: core/capped_amount
    params:
      cap: ca-on/lift_maximum
    consumes:
      base: ca-on/lift_credit_before_maximum
    produces:
      output: ca-on/lift_maximum_credit
  # Lines 6 to 9: line 6 "Net income from line 23600 of your return (or the amount you
  # would have entered if the instructions on line 23600 said "if negative, show in
  # brackets")", the net income before adjustments, which is not floored at zero; line 7
  # "Amount from line 21300 of your return", the UCCB repayment; line 8 "Amount of
  # registered disability savings plan (RDSP) income repayment included on line 23200 of
  # your return"; and line 9 "Add lines 6 to 8.", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/net_income_before_adjustments
        - ca/uccb_repayment
        - ca/rdsp_income_repayment
    produces:
      output: ca-on/lift_net_income_and_repayments
  # Lines 10 to 12: line 10 "Amount from line 11700 of your return", the universal child
  # care benefit; line 11 "Amount of RDSP income included on line 12500 of your return";
  # and line 12 "Line 10 plus line 11", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/universal_child_care_benefit
        - ca/rdsp_income
    produces:
      output: ca-on/lift_uccb_and_rdsp_income
  # Line 13 "Line 9 minus line 12 (if negative, enter "0") Your adjusted net income".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/lift_net_income_and_repayments
      less: ca-on/lift_uccb_and_rdsp_income
    produces:
      output: ca-on/lift_adjusted_net_income
  # Lines 15 to 19: line 15 "Amount from line 13 above", the adjusted net income; line 16
  # "Individual income threshold 32,500.00"; line 17 "Line 15 minus line 16 (if
  # negative, enter "0")"; line 18 "Applicable rate 5%"; line 19 "Line 17 multiplied by
  # the percentage from line 18".
  - name: core/tiered_surcharge
    params:
      tiers: ca-on/lift_reduction
    consumes:
      base: ca-on/lift_adjusted_net_income
    produces:
      output: ca-on/lift_reduction
  # Line 20 "Line 14 minus line 19 (if negative, enter "0") Enter this amount on line
  # 62140 of your Form ON428.", the credit for a single individual (Part A).
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/lift_maximum_credit
      less: ca-on/lift_reduction
    produces:
      output: ca-on/lift_credit_single
  # Part B, lines 21 to 24: line 21 "Net income from line 23600 of your spouse's or
  # common-law partner's return (or the amount they would have entered if the instructions
  # on line 23600 said "if negative, show in brackets")", a caller's figure that may be
  # negative; line 22 "Amount from line 21300 of your spouse's or common-law partner's
  # return"; line 23 "Amount of RDSP income repayment included on line 23200 of your
  # spouse's or common-law partner's return"; and line 24 "Add lines 21 to 23.", in line
  # order. Lines 21 to 23 are the caller's existing spouse inputs, the same figures the
  # Federal Worksheet for line 45200 uses (one shared input, entered once).
  - name: core/sum
    consumes:
      parts:
        - ca/spouse_net_income_before_adjustments
        - ca/spouse_uccb_repayment
        - ca/spouse_rdsp_income_repayment
    produces:
      output: ca-on/lift_spouse_net_income_and_repayments
  # Lines 25 to 27: line 25 "Amount from line 11700 of your spouse's or common-law
  # partner's return"; line 26 "Amount of RDSP income included on line 12500 of your
  # spouse's or common-law partner's return"; and line 27 "Line 25 plus line 26", in line
  # order. Lines 25 and 26 are likewise the caller's existing spouse inputs, shared with the
  # Federal Worksheet for line 45200.
  - name: core/sum
    consumes:
      parts:
        - ca/spouse_universal_child_care_benefit
        - ca/spouse_rdsp_income
    produces:
      output: ca-on/lift_spouse_uccb_and_rdsp_income
  # Line 28 "Line 24 minus line 27 (if negative, enter "0") Your spouse's or common-law
  # partner's adjusted net income".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/lift_spouse_net_income_and_repayments
      less: ca-on/lift_spouse_uccb_and_rdsp_income
    produces:
      output: ca-on/lift_spouse_adjusted_net_income
  # Line 31 "Individual income threshold 32,500.00", the dataset as an artifact of the same
  # name.
  - name: core/credit_amount
    params:
      amount: ca-on/lift_individual_income_threshold
    produces:
      output: ca-on/lift_individual_income_threshold
  # Lines 30 to 32: line 30 "Amount from line 13 of the previous page", the adjusted net
  # income, and line 32 "Line 30 minus line 31 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/lift_adjusted_net_income
      less: ca-on/lift_individual_income_threshold
    produces:
      output: ca-on/lift_excess_over_individual_threshold
  # Lines 33 to 35: line 33 "Amount from line 30 above" and line 34 "Amount from line 28
  # above", and line 35 "Line 33 plus line 34 Adjusted family net income", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca-on/lift_adjusted_net_income
        - ca-on/lift_spouse_adjusted_net_income
    produces:
      output: ca-on/lift_family_net_income
  # Line 36 "Family income threshold 65,0000.00", printed with a typo, which is 65,000.00:
  # the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/lift_family_income_threshold
    produces:
      output: ca-on/lift_family_income_threshold
  # Line 37 "Line 35 minus line 36 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/lift_family_net_income
      less: ca-on/lift_family_income_threshold
    produces:
      output: ca-on/lift_excess_over_family_threshold
  # Line 38 "Enter whichever is more: amount from line 32 or line 37.", in line order.
  - name: core/greater_of
    consumes:
      amounts:
        - ca-on/lift_excess_over_individual_threshold
        - ca-on/lift_excess_over_family_threshold
    produces:
      output: ca-on/lift_greater_excess
  # Line 39 "Applicable rate 5%" and line 40 "Line 38 multiplied by the percentage from
  # line 39", applied once to the greater excess.
  - name: core/apply_rate
    params:
      rate: ca-on/lift_family_rate
    consumes:
      base: ca-on/lift_greater_excess
    produces:
      output: ca-on/lift_family_reduction
  # Line 41 "Line 29 minus line 40 (if negative, enter "0") Enter this amount on line 62140
  # of your Form ON428.", the credit for an individual with a spouse or common-law partner
  # (Part B), where line 29 "Amount from line 5 of the previous page (maximum $875)" is the
  # credit at most its maximum.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/lift_maximum_credit
      less: ca-on/lift_family_reduction
    produces:
      output: ca-on/lift_credit_with_spouse
  # ON428 line 85 "Low-income individuals and families tax (LIFT) credit (complete Schedule
  # ON428-A)": "If you were single at the end of the year, complete Part A" and "If you had
  # a spouse or common-law partner at the end of the year, complete Part B", so a count of 1
  # (a caller's 0 or 1, entered as 0 when the spouse or common-law partner died during the
  # year, as "complete Part A as if you were single") chooses line 41 over line 20.
  - name: core/choose_by_count
    consumes:
      count: ca-on/lift_spouse_at_year_end
      when_none: ca-on/lift_credit_single
      when_any: ca-on/lift_credit_with_spouse
    produces:
      output: ca-on/lift_credit
  # ON428 line 86 "Line 84 minus line 85 (if negative, enter "0")": line 84 "Amount from
  # line 83 of the previous page" carries line 83 "Line 81 minus line 82 (if negative,
  # enter "0")", which is line 81 while line 82 (the provincial foreign tax credit) is not
  # triggered.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_after_reduction
      less: ca-on/lift_credit
    produces:
      output: ca-on/ontario_tax_after_lift_credit
  # ON428 line 87 and line 62150 "Enter the amount of qualifying donations that have also
  # been claimed as a charitable donation." "multiplied by 25%", under "Community food
  # program donation tax credit for farmers:": the donations are a caller input, taken as
  # entered.
  - name: core/apply_rate
    params:
      rate: ca-on/community_food_program_rate
    consumes:
      base: ca-on/community_food_program_donations
    produces:
      output: ca-on/community_food_program_credit
  # ON428 line 88 "Line 86 minus line 87 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/ontario_tax_after_lift_credit
      less: ca-on/community_food_program_credit
    produces:
      output: ca-on/ontario_tax_after_food_credit
  # ON428 line 89 "Ontario health premium (complete the chart below)": the chart's tiers
  # on line 1 "Enter your taxable income from line 26000 of your return", each the
  # previous plateau plus a rate on the income over its threshold, at most the next
  # plateau.
  - name: core/tiered_surcharge
    params:
      tiers: ca-on/health_premium
    consumes:
      base: ca/taxable_income
    produces:
      output: ca-on/ontario_health_premium
  # ON428 line 90 "Line 88 plus line 89 Enter this amount on line 42800 of your return.
  # Ontario tax".
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_tax_after_food_credit
        - ca-on/ontario_health_premium
    produces:
      output: ca-on/ontario_tax
  # T2038(IND) Part C "Recapture", "Amount of expenditure on which ITC earned at 15% (after
  # 2013) is recaptured. Do not enter more than the amount of the original expenditure"
  # (line 67193), times 0.15, amount 1: the caller's line 67193 at 15%.
  - name: core/apply_rate
    params:
      rate: ca/itc_recapture_rate_after_2013
    consumes:
      base: ca/itc_recapture_expenditure_at_15_percent
    produces:
      output: ca/itc_recapture_at_15_percent
  # Line 67195 "Amount of expenditure on which ITC earned at 20% (before 2014) is
  # recaptured. Do not enter more than the amount of the original expenditure", times 0.20,
  # amount 2: the caller's line 67195 at 20%.
  - name: core/apply_rate
    params:
      rate: ca/itc_recapture_rate_before_2014
    consumes:
      base: ca/itc_recapture_expenditure_at_20_percent
    produces:
      output: ca/itc_recapture_at_20_percent
  # "Total recapture of investment tax credit on SR&ED expenditures (add amounts 1 and 2)
  # Enter this amount on the Recapture of investment tax credit line of your income tax and
  # benefit return" (amount 3), T1 line 131 "Recapture of investment tax credit (complete
  # Form T2038(IND))": amounts 1 and 2 added.
  - name: core/sum
    consumes:
      parts:
        - ca/itc_recapture_at_15_percent
        - ca/itc_recapture_at_20_percent
    produces:
      output: ca/itc_recapture
  # T1 line 132 "Line 130 plus line 131 =": line 126 (42900) "Basic federal tax" and line
  # 131. Line 127 "Federal surtax on income earned outside Canada (complete Form T2203)" is
  # not triggered on a return whose income is all allocated to Ontario and line 129 (40500)
  # is not yet wired, so lines 128 and 130 carry line 126 unchanged.
  - name: core/sum
    consumes:
      parts:
        - ca/federal_tax_after_credits
        - ca/itc_recapture
    produces:
      output: ca/federal_tax_with_itc_recapture
  # T1 line 135 and line 41000 "Total federal political contributions (attach receipts) Line
  # 40900" is a caller input, ca/political_contributions, taken as the T1 takes it; the
  # Federal Worksheet "Line 41000 - Federal political contribution tax credit" reads it as
  # line 40900 and builds each of its three columns as printed, then the one that applies is
  # picked.
  # Federal Worksheet "Column 1: Line 40900 is $400 or less".
  # Line 2: 0.00, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca/political_credit_column_1_line_2
    produces:
      output: ca/political_credit_column_1_line_2
  # Column 1 line 3 "Line 1 minus line 2 (if negative, enter "0") =", line 1 being the
  # contributions.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/political_contributions
      less: ca/political_credit_column_1_line_2
    produces:
      output: ca/political_credit_column_1_line_3
  # Column 1 line 4 "Rate 75%" and line 5 "Line 3 multiplied by the percentage from line 4
  # =".
  - name: core/apply_rate
    params:
      rate: ca/political_credit_column_1_line_4
    consumes:
      base: ca/political_credit_column_1_line_3
    produces:
      output: ca/political_credit_column_1_line_5
  # Column 1 line 6: 0.00, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca/political_credit_column_1_line_6
    produces:
      output: ca/political_credit_column_1_line_6
  # Column 1 line 7 "Line 5 plus line 6 Enter this amount on line 41000 of your return. =".
  - name: core/sum
    consumes:
      parts:
        - ca/political_credit_column_1_line_5
        - ca/political_credit_column_1_line_6
    produces:
      output: ca/political_credit_column_1_line_7
  # Federal Worksheet "Column 2: Line 40900 is more than $400 but not more than $750".
  # Line 2: 400.00, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca/political_credit_column_2_line_2
    produces:
      output: ca/political_credit_column_2_line_2
  # Column 2 line 3 "Line 1 minus line 2 (if negative, enter "0") =", line 1 being the
  # contributions.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/political_contributions
      less: ca/political_credit_column_2_line_2
    produces:
      output: ca/political_credit_column_2_line_3
  # Column 2 line 4 "Rate 50%" and line 5 "Line 3 multiplied by the percentage from line 4
  # =".
  - name: core/apply_rate
    params:
      rate: ca/political_credit_column_2_line_4
    consumes:
      base: ca/political_credit_column_2_line_3
    produces:
      output: ca/political_credit_column_2_line_5
  # Column 2 line 6: 300.00, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca/political_credit_column_2_line_6
    produces:
      output: ca/political_credit_column_2_line_6
  # Column 2 line 7 "Line 5 plus line 6 Enter this amount on line 41000 of your return. =".
  - name: core/sum
    consumes:
      parts:
        - ca/political_credit_column_2_line_5
        - ca/political_credit_column_2_line_6
    produces:
      output: ca/political_credit_column_2_line_7
  # Federal Worksheet "Column 3: Line 40900 is more than more than $750".
  # Line 2: 750.00, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca/political_credit_column_3_line_2
    produces:
      output: ca/political_credit_column_3_line_2
  # Column 3 line 3 "Line 1 minus line 2 (if negative, enter "0") =", line 1 being the
  # contributions.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/political_contributions
      less: ca/political_credit_column_3_line_2
    produces:
      output: ca/political_credit_column_3_line_3
  # Column 3 line 4 "Rate 33.33%" and line 5 "Line 3 multiplied by the percentage from line
  # 4 =".
  - name: core/apply_rate
    params:
      rate: ca/political_credit_column_3_line_4
    consumes:
      base: ca/political_credit_column_3_line_3
    produces:
      output: ca/political_credit_column_3_line_5
  # Column 3 line 6: 475.00, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca/political_credit_column_3_line_6
    produces:
      output: ca/political_credit_column_3_line_6
  # Column 3 line 7 "Line 5 plus line 6 Enter this amount on line 41000 of your return. =".
  - name: core/sum
    consumes:
      parts:
        - ca/political_credit_column_3_line_5
        - ca/political_credit_column_3_line_6
    produces:
      output: ca/political_credit_column_3_line_7
  # The column that applies, "Use column 1 if the amount from line 40900 is $400 or less.
  # Use column 2 if the amount from line 40900 is more than $400 but not more than $750. Use
  # column 3 if the amount from line 40900 is more than $750.": the limits are the columns'
  # own line 2 constants, which their headings print again.
  - name: ca-on/choose_by_range
    consumes:
      amount: ca/political_contributions
      first_limit: ca/political_credit_column_2_line_2
      second_limit: ca/political_credit_column_3_line_2
      first: ca/political_credit_column_1_line_7
      second: ca/political_credit_column_2_line_7
      third: ca/political_credit_column_3_line_7
    produces:
      output: ca/political_credit_chosen_column
  # The shortcut, "If your total federal political contributions from line 40900 of your
  # return were" "$1,275 or more, enter $650 on line 41000 of your return. If not, use the
  # amount from line 40900 of your return to decide which column to complete.": the printed
  # 1,275 and 650 are datasets. Nothing compares two amounts yet, so the same chooser tests
  # the 1,275 against the contributions: when it is at most the contributions it chooses the
  # 650, otherwise the chosen column's line 7. A chooser's six artifact slots must be six
  # different artifacts, so the middle range is given column 3's line 2 (750) as its limit
  # and column 3's line 7 as its value: 1,275 is never at most 750, so it is never chosen.
  - name: core/credit_amount
    params:
      amount: ca/political_credit_shortcut_threshold
    produces:
      output: ca/political_credit_shortcut_threshold
  - name: core/credit_amount
    params:
      amount: ca/political_credit_shortcut_amount
    produces:
      output: ca/political_credit_shortcut_amount
  - name: ca-on/choose_by_range
    consumes:
      amount: ca/political_credit_shortcut_threshold
      first_limit: ca/political_contributions
      second_limit: ca/political_credit_column_3_line_2
      first: ca/political_credit_shortcut_amount
      second: ca/political_credit_column_3_line_7
      third: ca/political_credit_chosen_column
    produces:
      output: ca/political_credit_before_maximum
  # T1 line 135 and line 41000 "(maximum $650)", after the worksheet's line 7 or the
  # shortcut's $650.
  - name: core/capped_amount
    params:
      cap: ca/political_credit_maximum
    consumes:
      base: ca/political_credit_before_maximum
    produces:
      output: ca/political_credit
  # T1 line 137 and line 41400 "Labour-sponsored funds tax credit Line 41300: Net cost of
  # shares of a provincially registered fund Line 41300: Allowable credit": the guide's
  # "Claim the amount of your allowable credit on line 41400 of your return that is equal to
  # 15% of the net cost reported on line 41300 of your return, to a maximum of $750." is 15%
  # of line 41300, the caller's net cost.
  - name: core/apply_rate
    params:
      rate: ca/labour_sponsored_funds_rate
    consumes:
      base: ca/labour_sponsored_funds_net_cost
    produces:
      output: ca/labour_sponsored_funds_credit_before_maximum
  # The guide's "to a maximum of $750" comes after the percentage, so it caps the credit.
  - name: core/capped_amount
    params:
      cap: ca/labour_sponsored_funds_maximum
    consumes:
      base: ca/labour_sponsored_funds_credit_before_maximum
    produces:
      output: ca/labour_sponsored_funds_credit
  # T1 line 138 (line 41600) "Add lines 135 to 137.": line 135 (41000, the federal political
  # contribution tax credit) and line 137 (41400), in line order, as line 136 (41200, the
  # investment tax credit) is not yet wired.
  - name: core/sum
    consumes:
      parts:
        - ca/political_credit
        - ca/labour_sponsored_funds_credit
    produces:
      output: ca/credits_against_federal_tax
  # T1 line 139 (line 41700) "Line 134 minus line 138 (if negative, enter "0")": line 134
  # (40600) "Line 132 minus line 133 (if negative, enter "0") Federal tax" carries line 132,
  # as line 133 (the federal logging tax credit) is not yet wired.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/federal_tax_with_itc_recapture
      less: ca/credits_against_federal_tax
    produces:
      output: ca/federal_tax_less_credits
  # Form T1172 Part A, line 3 "Amount from line 1 or 2, whichever is less": line 1 (68270)
  # "Total of all AIPs you received or the promoter had transferred to an RRSP, PRPP or SPP
  # on your behalf, during the year." and line 2 "Total amounts you or your promoter
  # contributed on your behalf to your RRSP, PRPP, or SPP, or the RRSP or SPP of your spouse
  # or common-law partner, in the year you received the AIPs or the first 60 days of the
  # following year, that you deducted on line 20800 of your income tax and benefit return
  # for the year you received the AIPs.", both the caller's.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/resp_aips_received_part_a
        - ca/resp_aips_rrsp_contributions
    produces:
      output: ca/resp_aips_contributions_counted
  # Line 4 "Maximum lifetime RRSP contribution limit that can be used to reduce or eliminate
  # the amount of AIPs subject to the additional tax $ 50,000.00", the dataset as an
  # artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/resp_aips_lifetime_limit
    produces:
      output: ca/resp_aips_lifetime_limit
  # Line 6 "Line 4 minus line 5": line 5 "Total of all amounts used to reduce the amount of
  # additional tax payable on AIPs received in previous years (if applicable). This amount
  # is the total of the amount entered at line 5 of all T1172 forms you filed for 1998 and
  # at line 7 of all T1172 forms you filed for 1999 and later", the caller's, with no floor
  # on the line.
  - name: core/subtract
    consumes:
      amount: ca/resp_aips_lifetime_limit
      less: ca/resp_aips_reduction_used_in_previous_years
    produces:
      output: ca/resp_aips_limit_remaining
  # Line 7 "Amount from line 3 or 6, whichever is less".
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/resp_aips_contributions_counted
        - ca/resp_aips_limit_remaining
    produces:
      output: ca/resp_aips_reduction
  # Line 8 "Amount of AIPs subject to the additional tax: line 1 minus line 7".
  - name: core/subtract
    consumes:
      amount: ca/resp_aips_received_part_a
      less: ca/resp_aips_reduction
    produces:
      output: ca/resp_aips_subject_to_tax
  # Line 9 "Rate of the additional tax on AIPs" (20%) and line 10 "Additional tax on AIPs:
  # line 8 multiplied by line 9." (Part C, for a resident of Quebec on December 31, is not
  # triggered on an Ontario resident's return).
  - name: core/apply_rate
    params:
      rate: ca/resp_aips_part_a_rate
    consumes:
      base: ca/resp_aips_subject_to_tax
    produces:
      output: ca/resp_aips_part_a_tax
  # Part B "Fill out this part only if Part A does not apply to you.": line 11 (68280)
  # "Total of all AIPs you received from RESPs during the year.", the caller's, line 12
  # "Rate of the additional tax on AIPs" (20%) and line 13 "Additional tax on AIPs: line 11
  # multiplied by line 12.".
  - name: core/apply_rate
    params:
      rate: ca/resp_aips_part_b_rate
    consumes:
      base: ca/resp_aips_received_part_b
    produces:
      output: ca/resp_aips_part_b_tax
  # A count of 1 when Part A applies (a caller's 0 or 1, as the form takes the original
  # subscriber and the other listed cases) chooses line 10 over line 13, the amount the form
  # says to enter on line 41800; a count of 0 is Part B.
  - name: core/choose_by_count
    consumes:
      count: ca/resp_aips_part_a_applies
      when_none: ca/resp_aips_part_b_tax
      when_any: ca/resp_aips_part_a_tax
    produces:
      output: ca/resp_aips_additional_tax
  # T1 line 141 and line 41800 "Special taxes": the amount of Form T1172 (line 10 or 13) and
  # the RL-10 amount, the guide's "Report, on line 41800 of your return, the result of the
  # following calculation using your RL-10 slip: Tax Credit for a Labour-Sponsored Fund"
  # whose list the guide's .txt cuts off after "75% of box", so the amount is the caller's
  # until the rest is quoted (to be confirmed). The tax on excess EPSP amounts (Form RC359
  # line 9, per employer) is not yet wired.
  - name: core/sum
    consumes:
      parts:
        - ca/resp_aips_additional_tax
        - ca/rl_10_labour_sponsored_fund_amount
    produces:
      output: ca/special_taxes
  # T1 line 142 (line 42000) "Add lines 139 to 141. Net federal tax": line 139 (41700), line
  # 140 (41500) "Advanced Canada workers benefit (ACWB) (complete Schedule 6)", the RC210
  # box 10 amount the guide says to report, the caller's, and line 141 (41800), in line
  # order. Lines 120 and 124 (tax on split income, minimum tax carryover) are not modelled.
  - name: core/sum
    consumes:
      parts:
        - ca/federal_tax_less_credits
        - ca/advanced_canada_workers_benefit
        - ca/special_taxes
    produces:
      output: ca/net_federal_tax
  # T1 line 148 (line 43500) "Add lines 143 to 147. Total payable": line 143 "Amount
  # from line 42000" and line 147 (42800), the Ontario tax, in line order; lines 144 to
  # 146 are not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca/net_federal_tax
        - ca-on/ontario_tax
    produces:
      output: ca/total_payable
  # Schedule 6 line 5 "Add lines 1 to 4. Enter the result, even if it is "0". Working
  # income", line 1 "Employment income and other employment income from line 10100 and
  # line 10400 of the return" (line 10400 and lines 2 to 4 not triggered), carried by
  # line 6 "Add the amounts from line 5 in columns 1 and 2. Enter this amount on line
  # 16. Family working income" with no eligible spouse: one part.
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
    produces:
      output: ca/working_income
  # Schedule 6 line 15 "Line 13 minus line 14 Enter this amount on line 23 and line 35.
  # Adjusted family net income": line 7 "Net income from line 23600 of the return",
  # through lines 10, 12 and 13 with lines 8, 9 and 11 not triggered and no eligible
  # spouse (line 14 not triggered): one part.
  - name: core/sum
    consumes:
      parts:
        - ca/net_income
    produces:
      output: ca/adjusted_family_net_income
  # Schedule 6 lines 16 to 22: line 16 "Family working income from line 6"; line 17
  # "Base amount 3,000.00"; line 18 "Line 16 minus line 17 (if negative, enter "0")";
  # line 19 "Rate 27%"; line 20 "Line 18 multiplied by the percentage from line 19";
  # line 21 "If you had an eligible spouse or an eligible dependant, enter $2,813. If
  # not, enter $1,633."; line 22 "Enter whichever is less: amount from line 20 or line
  # 21.": one tier with a maximum, with no eligible spouse or dependant.
  - name: core/tiered_surcharge
    params:
      tiers: ca/cwb_basic
    consumes:
      base: ca/working_income
    produces:
      output: ca/cwb_before_reduction_without_dependant
  # The same lines with an eligible dependant: line 21's $2,813 as the tier's maximum.
  - name: core/tiered_surcharge
    params:
      tiers: ca/cwb_basic_with_dependant
    consumes:
      base: ca/working_income
    produces:
      output: ca/cwb_before_reduction_with_dependant
  # Schedule 6 lines 23 to 27: line 23 "Adjusted family net income from line 15"; line
  # 24 "If you had an eligible spouse or an eligible dependant, enter $30,639. If not,
  # enter $26,855."; line 25 "Line 23 minus line 24 (if negative, enter "0")"; line 26
  # "Rate 15%"; line 27 "Line 25 multiplied by the percentage from line 26": one tier,
  # with no eligible spouse or dependant.
  - name: core/tiered_surcharge
    params:
      tiers: ca/cwb_reduction
    consumes:
      base: ca/adjusted_family_net_income
    produces:
      output: ca/cwb_reduction_without_dependant
  # The same lines with an eligible dependant: line 24's $30,639 as the tier's threshold.
  - name: core/tiered_surcharge
    params:
      tiers: ca/cwb_reduction_with_dependant
    consumes:
      base: ca/adjusted_family_net_income
    produces:
      output: ca/cwb_reduction_with_dependant
  # Schedule 6 line 28 "Line 22 minus line 27 (if negative, enter "0") If you are not
  # completing Step 3, enter this amount on line 45300 of your return.", with no
  # eligible spouse or dependant: Step 3 (the disability supplement) is not triggered.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cwb_before_reduction_without_dependant
      less: ca/cwb_reduction_without_dependant
    produces:
      output: ca/canada_workers_benefit_without_dependant
  # Line 28 with an eligible dependant.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/cwb_before_reduction_with_dependant
      less: ca/cwb_reduction_with_dependant
    produces:
      output: ca/canada_workers_benefit_with_dependant
  # Line 28 for the filer's family status, which lines 21 and 24 read ("If you had an
  # eligible spouse or an eligible dependant ... If not ..."): the line with no eligible
  # spouse or dependant when the number of Schedule 6 eligible dependants (line 38100) is
  # 0, else the line with one; an eligible spouse is not modelled.
  - name: core/choose_by_count
    consumes:
      count: ca/cwb_eligible_dependants
      when_none: ca/canada_workers_benefit_without_dependant
      when_any: ca/canada_workers_benefit_with_dependant
    produces:
      output: ca/canada_workers_benefit
  # Form ON479 line 1 and line 61268 "Eligible medical expenses for fertility treatment
  # multiplied by 25% (maximum $5,000) =": the rate on the expenses, before its maximum.
  - name: core/apply_rate
    params:
      rate: ca-on/fertility_credit_rate
    consumes:
      base: ca-on/fertility_expenses
    produces:
      output: ca-on/fertility_credit_before_maximum
  # Line 1's "(maximum $5,000)", printed after the percentage, so it caps the credit.
  - name: core/capped_amount
    params:
      cap: ca-on/fertility_credit_maximum
    consumes:
      base: ca-on/fertility_credit_before_maximum
    produces:
      output: ca-on/fertility_credit
  # Form ON479 line 3 "Medical expenses from line 58769 of your Form ON428" is the artifact
  # ca-on/medical_claim (ON428 line 43), read directly. Line 4 "Allowable percentage 25%" and
  # line 5 "Line 3 multiplied by the percentage from line 4 (maximum $1,500) =": the
  # percentage on line 3, before the maximum.
  - name: core/apply_rate
    params:
      rate: ca-on/seniors_care_rate
    consumes:
      base: ca-on/medical_claim
    produces:
      output: ca-on/seniors_care_before_maximum
  # Line 5's "(maximum $1,500)", printed after the percentage, so it caps the result.
  - name: core/capped_amount
    params:
      cap: ca-on/seniors_care_maximum
    consumes:
      base: ca-on/seniors_care_before_maximum
    produces:
      output: ca-on/seniors_care_amount
  # Line 8 "Line 6 plus line 7 Family net income =", line 6 being "Your net income from line
  # 23600 of your return" and line 7 "Your spouse's or common-law partner's net income from
  # line 23600 of their return (if applicable)", the caller input shared with T1 line 30300
  # and ON428 line 58120 (0 with no spouse).
  - name: core/sum
    consumes:
      parts:
        - ca/net_income
        - ca/spouse_net_income
    produces:
      output: ca-on/seniors_care_family_net_income
  # Line 9 "Base amount 35,000.00", the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/seniors_care_base_amount
    produces:
      output: ca-on/seniors_care_base_amount
  # Line 10 "Line 8 minus line 9 (if negative, enter "0") =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/seniors_care_family_net_income
      less: ca-on/seniors_care_base_amount
    produces:
      output: ca-on/seniors_care_income_over_base
  # Line 11 "Applicable rate 5%" and line 12 "Line 10 multiplied by the percentage from
  # line 11 =".
  - name: core/apply_rate
    params:
      rate: ca-on/seniors_care_reduction_rate
    consumes:
      base: ca-on/seniors_care_income_over_base
    produces:
      output: ca-on/seniors_care_reduction
  # Line 13 and line 63095 "Line 5 minus line 12 (if negative, enter "0") =". The form's
  # rules for a family net income of $35,000 or less (line 5 on line 13) and of more than
  # $65,000 ("0" on line 13) follow from lines 9 to 12: line 10 is 0 up to $35,000, and at
  # $65,000 line 12 is $1,500.00, the most line 5 can be.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/seniors_care_amount
      less: ca-on/seniors_care_reduction
    produces:
      output: ca-on/seniors_care_before_claim
  # The caller's 0/1 count "claims the Ontario seniors care at home tax credit": line 13
  # once if the filer claims it, else 0. ON479 prints no eligibility text for the credit, so
  # the caller claims it only for a filer who qualifies.
  - name: core/times_count
    consumes:
      amount: ca-on/seniors_care_before_claim
      count: ca-on/claims_seniors_care_credit
    produces:
      output: ca-on/seniors_care_credit
  # Line 14 "Amount paid in the year for eligible seniors' use of Ontario public transit
  # services (maximum $3,000) Line 63100 multiplied by 15% =": the "(maximum $3,000)" is
  # printed before the percentage, so it caps the amount paid.
  - name: core/capped_amount
    params:
      cap: ca-on/seniors_transit_maximum
    consumes:
      base: ca-on/seniors_transit_paid
    produces:
      output: ca-on/seniors_transit_amount_paid_at_most_maximum
  # Line 14's "multiplied by 15% =", on the capped amount.
  - name: core/apply_rate
    params:
      rate: ca-on/seniors_transit_rate
    consumes:
      base: ca-on/seniors_transit_amount_paid_at_most_maximum
    produces:
      output: ca-on/seniors_transit_credit
  # Form ON479 line 15 and line 63100 "Ontario political contributions made in 2025" is a
  # caller input, ca-on/political_contributions, taken as the form takes it; Worksheet ON479
  # "Line 16 - Ontario political contribution tax credit" reads it as line 63110 and builds
  # each of its three columns as printed, then the one that applies is picked.
  # Worksheet ON479 "Column 1: Line 63110 is $500.05 or less".
  # Line 2: 0.00, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca-on/political_credit_column_1_line_2
    produces:
      output: ca-on/political_credit_column_1_line_2
  # Column 1 line 3 "Line 1 minus line 2 (cannot be negative)", line 1 being the
  # contributions.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/political_contributions
      less: ca-on/political_credit_column_1_line_2
    produces:
      output: ca-on/political_credit_column_1_line_3
  # Column 1 line 4 "Rate 75%" and line 5 "Line 3 multiplied by the percentage from line 4".
  - name: core/apply_rate
    params:
      rate: ca-on/political_credit_column_1_line_4
    consumes:
      base: ca-on/political_credit_column_1_line_3
    produces:
      output: ca-on/political_credit_column_1_line_5
  # Column 1 line 6: 0.00, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca-on/political_credit_column_1_line_6
    produces:
      output: ca-on/political_credit_column_1_line_6
  # Column 1 line 7 "Line 5 plus line 6 Enter this amount on line 16 of your Form ON479.".
  - name: core/sum
    consumes:
      parts:
        - ca-on/political_credit_column_1_line_5
        - ca-on/political_credit_column_1_line_6
    produces:
      output: ca-on/political_credit_column_1_line_7
  # Worksheet ON479 "Column 2: Line 63110 is more than $500.05 but not more than $1,666.82".
  # Line 2: 500.05, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca-on/political_credit_column_2_line_2
    produces:
      output: ca-on/political_credit_column_2_line_2
  # Column 2 line 3 "Line 1 minus line 2 (cannot be negative)", line 1 being the
  # contributions.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/political_contributions
      less: ca-on/political_credit_column_2_line_2
    produces:
      output: ca-on/political_credit_column_2_line_3
  # Column 2 line 4 "Rate 50%" and line 5 "Line 3 multiplied by the percentage from line 4".
  - name: core/apply_rate
    params:
      rate: ca-on/political_credit_column_2_line_4
    consumes:
      base: ca-on/political_credit_column_2_line_3
    produces:
      output: ca-on/political_credit_column_2_line_5
  # Column 2 line 6: 375.03, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca-on/political_credit_column_2_line_6
    produces:
      output: ca-on/political_credit_column_2_line_6
  # Column 2 line 7 "Line 5 plus line 6 Enter this amount on line 16 of your Form ON479.".
  - name: core/sum
    consumes:
      parts:
        - ca-on/political_credit_column_2_line_5
        - ca-on/political_credit_column_2_line_6
    produces:
      output: ca-on/political_credit_column_2_line_7
  # Worksheet ON479 "Column 3: Line 63110 is more than $1,666.82".
  # Line 2: 1,666.82, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca-on/political_credit_column_3_line_2
    produces:
      output: ca-on/political_credit_column_3_line_2
  # Column 3 line 3 "Line 1 minus line 2 (cannot be negative)", line 1 being the
  # contributions.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/political_contributions
      less: ca-on/political_credit_column_3_line_2
    produces:
      output: ca-on/political_credit_column_3_line_3
  # Column 3 line 4 "Rate 33.33%" and line 5 "Line 3 multiplied by the percentage from line
  # 4".
  - name: core/apply_rate
    params:
      rate: ca-on/political_credit_column_3_line_4
    consumes:
      base: ca-on/political_credit_column_3_line_3
    produces:
      output: ca-on/political_credit_column_3_line_5
  # Column 3 line 6: 958.41, a printed constant.
  - name: core/credit_amount
    params:
      amount: ca-on/political_credit_column_3_line_6
    produces:
      output: ca-on/political_credit_column_3_line_6
  # Column 3 line 7 "Line 5 plus line 6 Enter this amount on line 16 of your Form ON479.".
  - name: core/sum
    consumes:
      parts:
        - ca-on/political_credit_column_3_line_5
        - ca-on/political_credit_column_3_line_6
    produces:
      output: ca-on/political_credit_column_3_line_7
  # The column that applies: column 1 if line 63110 is $500.05 or less, column 2 if it is more
  # than $500.05 but not more than $1,666.82, column 3 if it is more than $1,666.82. The
  # limits are the columns' own line 2 constants, which their headings print again.
  - name: ca-on/choose_by_range
    consumes:
      amount: ca-on/political_contributions
      first_limit: ca-on/political_credit_column_2_line_2
      second_limit: ca-on/political_credit_column_3_line_2
      first: ca-on/political_credit_column_1_line_7
      second: ca-on/political_credit_column_2_line_7
      third: ca-on/political_credit_column_3_line_7
    produces:
      output: ca-on/political_credit_before_maximum
  # ON479 line 16 "(maximum $1,666.82)", after the chosen column's line 7.
  - name: core/capped_amount
    params:
      cap: ca-on/political_credit_maximum
    consumes:
      base: ca-on/political_credit_before_maximum
    produces:
      output: ca-on/political_credit
  # Form T1221 lines 1 to 3 "Enter the amount of qualifying expenses." (one line for each
  # corporation or slip) and line 4 "Add lines 1 to 3. Enter this amount on line 63220 of your
  # Form ON479.": the expenses of every slip in the list, added.
  - name: ca-on/flow_through_share_expenses
    consumes:
      slips: ca-on/flow_through_share_slips
    produces:
      output: ca-on/flow_through_share_expenses
  # Form ON479 line 17 and line 63220 "Enter your total expenses from your Form T1221.
  # multiplied by 5% =": the 5% on T1221 line 4.
  - name: core/apply_rate
    params:
      rate: ca-on/flow_through_share_rate
    consumes:
      base: ca-on/flow_through_share_expenses
    produces:
      output: ca-on/flow_through_share_credit
  # Line 18 "Add lines 1, 2, 13, 14, 16, and 17. =": lines 1, 13, 14, 16 and 17, in line
  # order, as line 2 is not triggered.
  - name: core/sum
    consumes:
      parts:
        - ca-on/fertility_credit
        - ca-on/seniors_care_credit
        - ca-on/seniors_transit_credit
        - ca-on/political_credit
        - ca-on/flow_through_share_credit
    produces:
      output: ca-on/ontario_credits_subtotal
  # Worksheet ON479 "Line 20 - Ontario co-operative education tax credit" line 5 "400,000.00",
  # the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/coop_education_payroll_threshold
    produces:
      output: ca-on/coop_education_payroll_threshold
  # Line 6 "Line 4 minus line 5 (if negative, enter "0")": line 4 "Total salaries and wages
  # paid in the 2024 taxation year" less the threshold.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/coop_education_payroll
      less: ca-on/coop_education_payroll_threshold
    produces:
      output: ca-on/coop_education_payroll_over_threshold
  # Line 7 "200,000.00", the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/coop_education_payroll_range
    produces:
      output: ca-on/coop_education_payroll_range
  # Line 8 "Line 6 divided by line 7".
  - name: ca-on/quotient
    consumes:
      dividend: ca-on/coop_education_payroll_over_threshold
      divisor: ca-on/coop_education_payroll_range
    produces:
      output: ca-on/coop_education_phase_out_share
  # Line 9 "1.00", the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/coop_education_full_share
    produces:
      output: ca-on/coop_education_full_share
  # Line 11 "Line 9 minus line 10 (if negative, enter "0")": line 10 is "Amount from line 8
  # above", so line 8 itself is taken off line 9.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/coop_education_full_share
      less: ca-on/coop_education_phase_out_share
    produces:
      output: ca-on/coop_education_remaining_share
  # Lines 1, 3, 12 and 13 for each qualifying work placement, and ON479 line 20 and line
  # 63300 "Enter the total amount claimed for all qualifying work placements. (maximum
  # $3,000 per student)": the total of the placements' line 13.
  - name: ca-on/coop_education_credit
    params:
      expenditure_rate: ca-on/coop_education_expenditure_rate
      supplement_rate: ca-on/coop_education_supplement_rate
      maximum: ca-on/coop_education_maximum
    consumes:
      placements: ca-on/coop_education_placements
      remaining_share: ca-on/coop_education_remaining_share
    produces:
      output: ca-on/coop_education_credit
  # ON479 line 63260 "Number of eligible work placements your business or partnership is
  # claiming under the Ontario co-operative education tax credit program": the number of
  # placements in the list.
  - name: ca-on/record_count
    consumes:
      records: ca-on/coop_education_placements
    produces:
      output: ca-on/coop_education_placement_count
  # Line 21 "Line 19 plus line 20 Enter this amount online 47900 of your return. Ontario
  # credits =": line 19 "Amount from line 18 of the previous page" carries line 18, and
  # line 20 is the co-operative education credit.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_credits_subtotal
        - ca-on/coop_education_credit
    produces:
      output: ca-on/ontario_credits
  # T1 line 165 and line 47900 "Provincial or territorial credits (complete Form 479, if it
  # applies)": ON479 line 21, the Ontario credits.
  - name: core/sum
    consumes:
      parts:
        - ca-on/ontario_credits
    produces:
      output: ca/provincial_credits
  # T1 "Eligible educator school supply tax credit" line 161 and line 46900: "Supplies
  # expenses (maximum $1,000) Line 46800 multiplied by 25% =": the "(maximum $1,000)" is
  # printed before the percentage, so it caps the supplies expenses (line 46800).
  - name: core/capped_amount
    params:
      cap: ca/educator_supplies_maximum
    consumes:
      base: ca/educator_supplies_expenses
    produces:
      output: ca/educator_supplies_expenses_at_most_maximum
  # Line 161's "multiplied by 25% =", on the capped supplies expenses.
  - name: core/apply_rate
    params:
      rate: ca/educator_supplies_rate
    consumes:
      base: ca/educator_supplies_expenses_at_most_maximum
    produces:
      output: ca/educator_school_supply_credit
  # T1 line 154 and line 45200 "Refundable medical expense supplement (use Federal
  # Worksheet)"; Federal Worksheet "Line 45200 - Refundable medical expense supplement", one
  # step per printed line, then the conditions it states. The T1 lines it reads that are not
  # yet computed are caller inputs under their line names: 21500, 22900, 23100, and the
  # self-employment lines 13500, 13700, 13900, 14100 and 14300, each the profits only as the
  # worksheet's note asks. "In addition, the total of the following two amounts must be $4,390
  # or more:" "your employment income from lines 10100 and 10400 of your return (other than
  # amounts received from a wage-loss replacement plan) minus the amounts from lines 20700,
  # 21200, 22900, and 23100 of your return (if the result is negative, consider it as "0")":
  # lines 10100 and 10400.
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
        - ca/other_employment_income
    produces:
      output: ca/medical_supplement_employment_income
  # "(other than amounts received from a wage-loss replacement plan)": a caller input, which
  # lines 10100 and 10400 include.
  - name: core/subtract
    consumes:
      amount: ca/medical_supplement_employment_income
      less: ca/wage_loss_replacement_plan_income
    produces:
      output: ca/medical_supplement_employment_income_less_wage_loss
  # "minus the amounts from lines 20700, 21200, 22900, and 23100 of your return", in line
  # order.
  - name: core/sum
    consumes:
      parts:
        - ca/rpp_deduction
        - ca/union_dues
        - ca/other_employment_expenses
        - ca/clergy_residence_deduction
    produces:
      output: ca/medical_supplement_employment_deductions
  # "(if the result is negative, consider it as "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/medical_supplement_employment_income_less_wage_loss
      less: ca/medical_supplement_employment_deductions
    produces:
      output: ca/medical_supplement_employment_working_income
  # "your net self-employment income (not including losses) from lines 13500, 13700, 13900,
  # 14100, and 14300 of your return", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/net_business_income
        - ca/net_professional_income
        - ca/net_commission_income
        - ca/net_farming_income
        - ca/net_fishing_income
    produces:
      output: ca/medical_supplement_self_employment_income
  # "the total of the following two amounts".
  - name: core/sum
    consumes:
      parts:
        - ca/medical_supplement_employment_working_income
        - ca/medical_supplement_self_employment_income
    produces:
      output: ca/medical_supplement_working_income
  # Column 1 "You" line 1 "Net income amount from line 23600 of the return (or the amount you
  # would have entered if the instructions on line 23600 said "if negative, show in
  # brackets")" is line 23400, the net income before adjustments, as line 23500 is not
  # wired yet; line 2 "Total of the universal child care benefit (UCCB) repayment (line 21300
  # of the return) and the registered disability savings plan (RDSP) income repayment
  # (included in the amount on line 23200 of the return)" is the UCCB and RDSP income
  # repayments of the other payments worksheet; line 3 "Line 1 plus line 2".
  - name: core/sum
    consumes:
      parts:
        - ca/net_income_before_adjustments
        - ca/uccb_and_rdsp_income_repayments
    produces:
      output: ca/medical_supplement_column_1_line_3
  # Column 1 line 4 "Total of the UCCB income (line 11700 of the return) and the RDSP income
  # (line 12500 of the return)" is the UCCB and RDSP income of the other payments worksheet;
  # line 5 "Line 3 minus line 4 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/medical_supplement_column_1_line_3
      less: ca/uccb_and_rdsp_income
    produces:
      output: ca/medical_supplement_column_1_line_5
  # Column 2 "Your spouse or common-law partner" line 2, line 3 "Line 1 plus line 2", line 4
  # and line 5, the same lines for the spouse's caller inputs: 0 when there is no spouse or
  # common-law partner, and when "you were separated because of a breakdown in your
  # relationship for a period of 90 days or more that included December 31, 2025" or "your
  # spouse or common-law partner died on or before December 31, 2025", as the worksheet says
  # "do not include their income".
  - name: core/sum
    consumes:
      parts:
        - ca/spouse_uccb_repayment
        - ca/spouse_rdsp_income_repayment
    produces:
      output: ca/medical_supplement_column_2_line_2
  - name: core/sum
    consumes:
      parts:
        - ca/spouse_net_income_before_adjustments
        - ca/medical_supplement_column_2_line_2
    produces:
      output: ca/medical_supplement_column_2_line_3
  - name: core/sum
    consumes:
      parts:
        - ca/spouse_universal_child_care_benefit
        - ca/spouse_rdsp_income
    produces:
      output: ca/medical_supplement_column_2_line_4
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/medical_supplement_column_2_line_3
      less: ca/medical_supplement_column_2_line_4
    produces:
      output: ca/medical_supplement_column_2_line_5
  # Line 6 "Add the amounts from line 5 of columns 1 and 2. Adjusted family net income".
  - name: core/sum
    consumes:
      parts:
        - ca/medical_supplement_column_1_line_5
        - ca/medical_supplement_column_2_line_5
    produces:
      output: ca/medical_supplement_line_6
  # Line 7 "Income threshold 33,294.00", a printed constant.
  - name: core/credit_amount
    params:
      amount: ca/medical_supplement_income_threshold
    produces:
      output: ca/medical_supplement_income_threshold
  # Line 8 "Line 6 minus line 7 (if negative, enter "0") =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/medical_supplement_line_6
      less: ca/medical_supplement_income_threshold
    produces:
      output: ca/medical_supplement_line_8
  # Line 9 "Amount from line 21500 of your return" and line 10 "Amount from line 33200 of your
  # return" are the disability supports deduction and the medical claim; line 11 "Line 9 plus
  # line 10".
  - name: core/sum
    consumes:
      parts:
        - ca/disability_supports_deduction
        - ca/medical_claim
    produces:
      output: ca/medical_supplement_line_11
  # Line 12 "Applicable rate 25%" and line 13 "Line 11 multiplied by the percentage from line
  # 12 =".
  - name: core/apply_rate
    params:
      rate: ca/medical_supplement_rate
    consumes:
      base: ca/medical_supplement_line_11
    produces:
      output: ca/medical_supplement_line_13
  # Line 14 "Enter whichever is less: amount from line 13 or $1,504".
  - name: core/capped_amount
    params:
      cap: ca/medical_supplement_maximum
    consumes:
      base: ca/medical_supplement_line_13
    produces:
      output: ca/medical_supplement_line_14
  # Line 15 "Amount from line 8" "multiplied by 5% =".
  - name: core/apply_rate
    params:
      rate: ca/medical_supplement_reduction_rate
    consumes:
      base: ca/medical_supplement_line_8
    produces:
      output: ca/medical_supplement_line_15
  # Line 16 "Line 14 minus line 15 (if negative, enter "0") Enter this amount on line 45200 of
  # your return. =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/medical_supplement_line_14
      less: ca/medical_supplement_line_15
    produces:
      output: ca/medical_supplement_line_16
  # "In addition, the total of the following two amounts must be $4,390 or more:": line 16
  # when the working income is at least the threshold, else 0.
  - name: ca/threshold_gate
    params:
      threshold: ca/medical_supplement_working_income_threshold
    consumes:
      amount: ca/medical_supplement_line_16
      gate: ca/medical_supplement_working_income
    produces:
      output: ca/medical_supplement_if_working_income_met
  # "You were resident in Canada throughout 2025", a count of 0 or 1.
  - name: core/times_count
    consumes:
      amount: ca/medical_supplement_if_working_income_met
      count: ca/resident_in_canada_throughout_2025
    produces:
      output: ca/medical_supplement_if_resident
  # "You were 18 years of age or older at the end of 2025", a count of 0 or 1: T1 line 154 and
  # line 45200.
  - name: core/times_count
    consumes:
      amount: ca/medical_supplement_if_resident
      count: ca/aged_18_or_older_at_end_of_2025
    produces:
      output: ca/refundable_medical_expense_supplement
  # T1 line 166 (line 48200) "Add lines 150 to 165. Total credits": line 150 (43700), line 154
  # (45200) "Refundable medical expense supplement (use Federal Worksheet)", line 155 (45300)
  # "Canada workers benefit (CWB) (complete Schedule 6)", line 159 (45600) "Part XII.2 tax
  # credit (box 38 of all T3 slips and box 209 of all T5013 slips)", line 160 (45700)
  # "Employee and partner GST/HST rebate (complete Form GST370)", line 161 (46900), line 162
  # (47555) "Canadian journalism labour tax credit (box 236 of all T5013 slips)", line 164
  # (47600) "Tax paid by instalments" and line 165 (47900), in line order, as the other lines
  # are not triggered or not yet wired.
  - name: core/sum
    consumes:
      parts:
        - ca/income_tax_deducted
        - ca/refundable_medical_expense_supplement
        - ca/canada_workers_benefit
        - ca/part_xii_2_tax_credit
        - ca/employee_and_partner_gst_hst_rebate
        - ca/educator_school_supply_credit
        - ca/journalism_labour_tax_credit
        - ca/tax_paid_by_instalments
        - ca/provincial_credits
    produces:
      output: ca/total_credits
  # T1 line 167 "Line 149 minus line 166 If the amount is negative, enter it on line
  # 48400 below. If the amount is positive, enter it on line 48500 below. Refund or
  # balance owing": not floored, so a negative result is a refund and a positive one a
  # balance owing.
  - name: core/subtract
    consumes:
      amount: ca/total_payable
      less: ca/total_credits
    produces:
      output: ca/refund_or_balance_owing
  # T1 line 48400 "Refund": line 167 is entered on line 48400 "If the amount is negative", so
  # the total credits less the total payable, not below zero, a refund and never a negative.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/total_credits
      less: ca/total_payable
    produces:
      output: ca/refund
  # The Ontario opportunities fund, on the T1 provincial pages, line 1 "Amount from line 48400
  # above": the refund.
  - name: core/sum
    consumes:
      parts:
        - ca/refund
    produces:
      output: ca-on/refund_before_donation
  # Line 3 and line 46600 "Net refund (line 1 minus line 2) =": line 1 less line 2 and line
  # 46500 "Your donation to the Ontario opportunities fund".
  - name: core/subtract
    consumes:
      amount: ca-on/refund_before_donation
      less: ca-on/opportunities_fund_donation
    produces:
      output: ca-on/net_refund

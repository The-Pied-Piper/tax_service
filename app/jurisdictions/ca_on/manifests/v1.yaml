  - ca/net_capital_loss_balance_1988_and_1989
  - ca/net_capital_loss_balance_1990_to_1999
  - ca/net_capital_loss_balance_2001_to_2024
capabilities:
  - name: core/apply_rate
    params:
      rate: ca/capital_gains_inclusion_rate
    consumes:
      base: ca/capital_gain
    produces:
      output: ca/taxable_capital_gains
  # T1 line 9 (12000) "Amount of dividends (eligible and other than eligible)" and line
  # 12010 "Amount of dividends (other than eligible)" (use Federal Worksheet): the Federal
  # Worksheet's "Lines 12000 and 12010 - Taxable amount of dividends from taxable Canadian
  # corporations", line 5 "Add lines 1 to 4. Enter this amount on line 12010 of your
  # return." (the T3, T4PS, T5 and T5013 slip boxes of lines 1 to 4) and line 10 "Add lines
  # 6 to 9. Enter this amount on line 12000 of your return." (lines 6 to 9). For dividends
  # with no information slip, line 11 "Actual amount of eligible dividends received" and
  # line 12 "Applicable rate 138%" give line 13 "Line 11 multiplied by the percentage from
  # line 12"; line 14 "Actual amount of dividends other than eligible dividends received"
  # and line 15 "Applicable rate 115%" give line 16 "Line 14 multiplied by the percentage
  # from line 15 Include this amount on line 12010 of your return."; line 17 "Line 13 plus
  # line 16. Include this amount on line 12000 of your return." The rates are above one, so
  # they are fractions, not rates. Line 12010 is line 5 plus line 16 and line 12000 is line
  # 10 plus line 17.
  - name: core/sum
    consumes:
      parts:
        - ca/t3_taxable_dividends_other_than_eligible
        - ca/t4ps_taxable_dividends_other_than_eligible
        - ca/t5_taxable_dividends_other_than_eligible
        - ca/t5013_taxable_dividends_other_than_eligible
    produces:
      output: ca/slip_taxable_dividends_other_than_eligible
  - name: core/sum
    consumes:
      parts:
        - ca/t3_taxable_dividends
        - ca/t4ps_taxable_dividends
        - ca/t5_taxable_dividends
        - ca/t5013_taxable_dividends
    produces:
      output: ca/slip_taxable_dividends
  - name: core/apply_fraction
    params:
      fraction: ca/eligible_dividend_gross_up
    consumes:
      base: ca/eligible_dividends_received_without_a_slip
    produces:
      output: ca/eligible_dividends_grossed_up
  - name: core/apply_fraction
    params:
      fraction: ca/other_dividend_gross_up
    consumes:
      base: ca/other_dividends_received_without_a_slip
    produces:
      output: ca/other_dividends_grossed_up
  - name: core/sum
    consumes:
      parts:
        - ca/eligible_dividends_grossed_up
        - ca/other_dividends_grossed_up
    produces:
      output: ca/dividends_without_a_slip_grossed_up
  - name: core/sum
    consumes:
      parts:
        - ca/slip_taxable_dividends_other_than_eligible
        - ca/other_dividends_grossed_up
    produces:
      output: ca/taxable_dividends_other_than_eligible
  - name: core/sum
    consumes:
      parts:
        - ca/slip_taxable_dividends
        - ca/dividends_without_a_slip_grossed_up
    produces:
      output: ca/taxable_dividends
  # T1 Step 2 line 10 (12100) "Interest and other investment income (use Federal
  # Worksheet)": the Federal Worksheet's "Line 12100 - Interest and other investment
  # income" line 9 "Add lines 1 to 8.", in line order, then line 11 "Line 9 minus line
  # 10. Enter this amount on line 12100 of your return." with line 10 "Interest and other
  # investment income, included on line 9, received and reported in previous years".
  - name: core/sum
    consumes:
      parts:
        - ca/t3_investment_income
        - ca/t5_investment_income
        - ca/t5013_investment_income
        - ca/investment_income_credited_not_received
        - ca/tax_refund_interest
        - ca/foreign_investment_income
        - ca/investment_income_without_a_slip
        - ca/investment_royalties
    produces:
      output: ca/investment_income_before_prior_years
  - name: core/subtract
    consumes:
      amount: ca/investment_income_before_prior_years
      less: ca/investment_income_reported_in_previous_years
    produces:
      output: ca/interest_and_other_investment_income
  # T1 line 32 and line 14700 "Add lines 29 to 31 (see line 25000 in Step 4).": workers'
  # compensation benefits (14400), social assistance payments (14500) and net federal
  # supplements paid (14600), in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/workers_compensation_benefits
        - ca/social_assistance_payments
        - ca/net_federal_supplements
    produces:
      output: ca/income_support_benefits
  # T1 line 33 and line 15000 "Line 28 plus line 32 Total income": every income line the
  # return lists, in line order (lines 1 to 20, here with the amount of dividends of line
  # 9 (12000), the taxable capital gains of line 14 and the taxable support payments of
  # line 15, then line 32); rental income (line 13) and self-employment income (lines 22
  # to 26) are not wired yet.
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
        - ca/other_employment_income
        - ca/old_age_security
        - ca/cpp_or_qpp_benefits
        - ca/other_pensions_and_superannuation
        - ca/elected_split_pension_amount
        - ca/universal_child_care_benefit
        - ca/ei_and_other_benefits
        - ca/taxable_dividends
        - ca/interest_and_other_investment_income
        - ca/net_partnership_income
        - ca/rdsp_income
        - ca/taxable_capital_gains
        - ca/taxable_support_payments
        - ca/rrsp_income
        - ca/fhsa_income
        - ca/other_fhsa_income
        - ca/other_income
        - ca/taxable_scholarships
        - ca/income_support_benefits
    produces:
      output: ca/total_income
  # Schedule 8 Part 3, each contribution on employment income: line 11 (base, 4.95% of the
  # earnings between the $3,500 exemption and the $71,300 ceiling, lines 2 to 7), line 12
  # (first additional, 1% of the same band) and line 22 (second additional, 4% of the
  # earnings between the $71,300 and $81,200 ceilings, lines 2 to 4).
  - name: core/contribution_tier
    params:
      tier: ca/cpp_base_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_base_contributions
  - name: core/contribution_tier
    params:
      tier: ca/cpp_first_additional_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_first_additional_contributions
  - name: core/contribution_tier
    params:
      tier: ca/cpp_second_additional_contribution
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/cpp_second_additional_contributions
  # T1 line 31200 "through employment (boxes 18 and 55 of all T4 slips) (maximum
  # $1,077.48)": the EI premiums, 1.64% of the employment income up to the $65,700
  # maximum insurable earnings, with no exemption (the EI premium rates and maximums,
  # 2025 federal row).
  - name: core/contribution_tier
    params:
      tier: ca/ei_premium
    consumes:
      earnings: ca/employment_income
    produces:
      output: ca/ei_premiums
  # Schedule 8 Part 3a line 28 "Line 26 plus line 27": the first and second additional
  # contributions together, the T1 line 22215 deduction.
  - name: core/sum
    consumes:
      parts:
        - ca/cpp_first_additional_contributions
        - ca/cpp_second_additional_contributions
    produces:
      output: ca/cpp_enhanced_contributions
  # Schedule 7 line 5 "Line 1 plus line 4 ... Total contributions", line 6 "Total
  # contributions from line 5" and line 10 "Line 6 minus line 9 Contributions available
  # to deduct": with no HBP or LLP repayments (line 9), line 10 is line 5. In line 5's
  # order: the unused contributions (line 1), then the contributions (line 4).
  - name: core/sum
    consumes:
      parts:
        - ca/unused_rrsp_contributions
        - ca/rrsp_contributions
    produces:
      output: ca/rrsp_contributions_available
  # Schedule 7 line 17 "Enter whichever is less: amount from line 13 or line 16.": with
  # no employer PRPP contributions (line 12) and no transfers (line 15), line 13 is the
  # limit and line 16 the contributions available to deduct. The parts keep line 20's
  # order (line 10, then the limit).
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/rrsp_contributions_available
        - ca/rrsp_deduction_limit
    produces:
      output: ca/rrsp_deduction_maximum
  # Schedule 7 line 18 "Enter your RRSP, PRPP, or SPP contributions you are deducting for
  # 2025 (cannot be more than the amount on line 17).", line 19 "Line 15 plus line 18"
  # and line 20 "Enter whichever is less: amount from line 10 or line 19. Enter this
  # amount on line 20800 of your return. RRSP deduction": with no transfers (line 15),
  # line 19 is line 18, at most line 17 and so at most line 10, and line 20 is line 18
  # itself. A claim above line 17 is refused, not capped.
  - name: core/at_most
    consumes:
      amount: ca/rrsp_amount_deducted
      bound: ca/rrsp_deduction_maximum
    produces:
      output: ca/rrsp_deduction
  # Schedule 7 line 23 "Line 21 minus line 22 Your unused contributions available to
  # carry forward to a future year": line 21 "Enter your contributions available to
  # deduct from line 10 of the previous page." less line 22 "Enter your RRSP deduction
  # from line 20 of the previous page."; never negative, as line 20 is at most line 10.
  - name: core/subtract
    consumes:
      amount: ca/rrsp_contributions_available
      less: ca/rrsp_deduction
    produces:
      output: ca/unused_rrsp_contributions_carried_forward
  # Form T778 Part B line 1 "Number of eligible children born in 2019 or later whom the
  # disability amount cannot be claimed for" "multiplied by $8,000", line 2 (line 67960)
  # "Number of eligible children born in 2025 or earlier whom the disability amount can
  # be claimed for" "multiplied by $11,000" and line 3 "Number of eligible children born
  # in 2009 to 2018 (and born in 2008 or earlier with a mental or physical infirmity whom
  # the disability amount cannot be claimed for)" "multiplied by $5,000".
  - name: core/per_unit_amount
    params:
      amount: ca/child_care_limit_under_seven
    consumes:
      count: ca/children_under_seven
    produces:
      output: ca/child_care_limit_for_children_under_seven
  - name: core/per_unit_amount
    params:
      amount: ca/child_care_limit_disability
    consumes:
      count: ca/children_with_disability
    produces:
      output: ca/child_care_limit_for_children_with_disability
  - name: core/per_unit_amount
    params:
      amount: ca/child_care_limit_seven_to_sixteen
    consumes:
      count: ca/children_seven_to_sixteen
    produces:
      output: ca/child_care_limit_for_children_seven_to_sixteen
  # T778 line 4 "Add lines 1 to 3.", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/child_care_limit_for_children_under_seven
        - ca/child_care_limit_for_children_with_disability
        - ca/child_care_limit_for_children_seven_to_sixteen
    produces:
      output: ca/child_care_basic_limit
  # T778 line 6 "Enter your earned income.", "the total of the following: employment
  # income (including tips and gratuities, and the non-taxable part of an allowance
  # received as an emergency volunteer) ...": the employment income, the other earned
  # income lines not triggered; then "multiplied by two-thirds": one part.
  - name: core/sum
    consumes:
      parts:
        - ca/employment_income
    produces:
      output: ca/child_care_earned_income
  - name: core/apply_fraction
    params:
      fraction: ca/child_care_earned_income_fraction
    consumes:
      base: ca/child_care_earned_income
    produces:
      output: ca/child_care_earned_income_limit
  # T778 line 7 "Enter whichever amount is the least: line 4, line 5 or line 6.", in that
  # order, line 5 "Enter the amount from line 67950." being the expenses paid; with line
  # 8 (the other person with the higher net income) not triggered, line 9 "Line 7 minus
  # line 8. ... enter this amount on line 21400 of your return. Allowable deduction" is
  # line 7.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/child_care_basic_limit
        - ca/child_care_expenses_paid
        - ca/child_care_earned_income_limit
    produces:
      output: ca/child_care_expenses
  # Federal Worksheet "Line 22100 - Carrying charges, interest expenses, and other expenses": line 1
  # "Total carrying charges", line 2 "Total interest expenses" and line 3 "Total other expenses"
  # (starting amounts), and line 4 "Add lines 1 to 3. Enter this amount on line 22100 of your
  # return.", in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/total_carrying_charges
        - ca/total_interest_expenses
        - ca/total_other_expenses
    produces:
      output: ca/carrying_charges_interest_expenses_and_other_expenses
  # Form T1436 (Capital Gains Worksheet), "Line 21700 – Allowable business investment loss",
  # "Calculating your business investment loss reduction, if any": lines 1 to 6 (the capital gains
  # deductions claimed for 1985 to 1987, for 1988 and 1989 other than for eligible capital property,
  # for 1988 and 1989 for eligible capital property, for 1990 to 1999, for 2000 and for 2001 to
  # 2024) are starting amounts, each as its line prints it after its multiplier (the figures come
  # from the returns of 1985 to 2024); line 7 "Add lines 1 to 6." Total of all capital gains
  # deductions claimed from 1985 to 2024.
  - name: core/sum
    consumes:
      parts:
        - ca/capital_gains_deductions_1985_to_1987
        - ca/capital_gains_deductions_1988_and_1989_other_than_eligible_capital_property
        - ca/capital_gains_deductions_1988_and_1989_eligible_capital_property
        - ca/capital_gains_deductions_1990_to_1999
        - ca/capital_gains_deductions_2000
        - ca/capital_gains_deductions_2001_to_2024
    produces:
      output: ca/capital_gains_deductions_claimed_1985_to_2024
  # Lines 8 to 13 (the amounts of Schedule 3 for 1986 to 1994, 1994 to 1996, 1997 to 1999, 2000,
  # 2001 to 2023 and 2024) are starting amounts; line 14 "Add lines 8 to 13." Total of all other
  # business investment loss reductions for 1986 to 2024.
  - name: core/sum
    consumes:
      parts:
        - ca/other_business_investment_loss_reductions_1986_to_1994
        - ca/other_business_investment_loss_reductions_1994_to_1996
        - ca/other_business_investment_loss_reductions_1997_to_1999
        - ca/other_business_investment_loss_reductions_2000
        - ca/other_business_investment_loss_reductions_2001_to_2023
        - ca/other_business_investment_loss_reductions_2024
    produces:
      output: ca/other_business_investment_loss_reductions_1986_to_2024
  # Line 15 "Line 7 minus line 14" prints no "(if negative, enter "0")", so it may be negative.
  - name: core/subtract
    consumes:
      amount: ca/capital_gains_deductions_claimed_1985_to_2024
      less: ca/other_business_investment_loss_reductions_1986_to_2024
    produces:
      output: ca/business_investment_loss_reduction_available
  # Line 16 "Business investment loss in 2025 Enter this amount on line 21699 of your return." is a
  # starting amount, the gross of line 21699; line 17 "Enter whichever is less: amount from line 15
  # or line 16. Enter this amount on line 17800 of Schedule 3." prints no "(if negative, enter "0")"
  # either, so it may be negative with line 15.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/business_investment_loss_reduction_available
        - ca/business_investment_loss
    produces:
      output: ca/business_investment_loss_reduction
  # Line 18 "Line 16 minus line 17 Business investment loss reduction": never negative, as line 17
  # is at most line 16.
  - name: core/subtract
    consumes:
      amount: ca/business_investment_loss
      less: ca/business_investment_loss_reduction
    produces:
      output: ca/business_investment_loss_after_reduction
  # Line 19 "Inclusion rate for 2025 × 50 %", the rate dataset, and line 20 "Line 18 multiplied by
  # the percentage on line 19 Enter this amount on line 21700 of your return. Allowable business
  # investment loss".
  - name: core/apply_rate
    params:
      rate: ca/business_investment_loss_inclusion_rate
    consumes:
      base: ca/business_investment_loss_after_reduction
    produces:
      output: ca/allowable_business_investment_loss
  # Schedule 15 (form 5000-S15) Step 2 "Calculate your annual FHSA limit for 2025": line 1 and line
  # 68935 "Total contributions made to your FHSAs in 2025 (box 18 of your 2025 T4FHSA slips)" and
  # line 2 and line 68940 "Total contributions made to your FHSAs in 2025 after your first
  # qualifying withdrawal" are starting amounts; line 3 "Line 1 minus line 2 =" prints no "(if
  # negative, enter "0")", so it may be negative.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_contributions_in_2025
      less: ca/fhsa_contributions_in_2025_after_first_qualifying_withdrawal
    produces:
      output: ca/fhsa_contributions_in_2025_before_first_qualifying_withdrawal
  # Line 4 "Variable "B" amount of your annual FHSA limit for 2024 (from your 2025 FHSA
  # participation room statement)" is a starting amount; line 5 "Line 3 plus line 4 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_contributions_in_2025_before_first_qualifying_withdrawal
        - ca/fhsa_variable_b_amount
    produces:
      output: ca/fhsa_contributions_plus_variable_b_amount
  # Line 6 and line 68945 "Total designated withdrawals from your FHSAs in 2025 (box 38 of your 2025
  # T4FHSA slips)", line 7 "Total contributions made to your FHSAs in 2024 (from your 2025 FHSA
  # participation room statement)" and line 8 "Contributions to your FHSAs in 2024 before your first
  # qualifying withdrawal (from your 2025 FHSA participation room statement)" are starting amounts;
  # line 9 "Line 7 minus line 8 =" prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_contributions_in_2024
      less: ca/fhsa_contributions_in_2024_before_first_qualifying_withdrawal
    produces:
      output: ca/fhsa_contributions_in_2024_after_first_qualifying_withdrawal
  # Line 10 "Amount from line 2" is the same artifact as line 2; line 11 "Line 9 plus line 10 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_contributions_in_2024_after_first_qualifying_withdrawal
        - ca/fhsa_contributions_in_2025_after_first_qualifying_withdrawal
    produces:
      output: ca/fhsa_contributions_after_first_qualifying_withdrawal
  # Line 12 "Line 6 minus line 11 (if negative, enter "0") =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/fhsa_designated_withdrawals_in_2025
      less: ca/fhsa_contributions_after_first_qualifying_withdrawal
    produces:
      output: ca/fhsa_excess_designated_withdrawals
  # Line 13 "Line 5 minus line 12 (if negative, enter "0") =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/fhsa_contributions_plus_variable_b_amount
      less: ca/fhsa_excess_designated_withdrawals
    produces:
      output: ca/fhsa_contributions_limit
  # Line 14 "8,000.00", the dataset as an artifact of the same name; line 30 "8,000.00" is the same
  # figure, read again below.
  - name: core/credit_amount
    params:
      amount: ca/fhsa_annual_amount
    produces:
      output: ca/fhsa_annual_amount
  # Line 15 "Your FHSA carryforward for 2025 (from your 2025 FHSA participation room statement)" is
  # a starting amount; line 16 "Line 14 plus line 15 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_annual_amount
        - ca/fhsa_carryforward_for_2025
    produces:
      output: ca/fhsa_annual_amount_with_carryforward
  # Line 17 "Total transfers from your RRSPs to your FHSAs in 2024 and prior years (from your 2025
  # FHSA participation room statement)" and line 18 and line 68950 "Total transfers from your RRSPs
  # to your FHSAs in 2025 (boxes 32 and 34 of your 2025 T4FHSA slips)" are starting amounts; line 19
  # "Line 17 plus line 18 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_rrsp_transfers_in_2024_and_prior_years
        - ca/fhsa_rrsp_transfers_in_2025
    produces:
      output: ca/fhsa_total_rrsp_transfers
  # Line 20 "Total designated transfers from your FHSAs to your RRSPs or RRIFs in 2024 and prior
  # years (from your 2025 FHSA participation room statement)" and line 21 and line 68955 "Total
  # designated transfers from your FHSAs to your RRSPs or RRIFs in 2025 (box 36 of your 2025 T4FHSA
  # slips)" are starting amounts; line 22 "Line 20 plus line 21 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_designated_transfers_in_2024_and_prior_years
        - ca/fhsa_designated_transfers_in_2025
    produces:
      output: ca/fhsa_total_designated_transfers
  # Line 23 "Line 19 minus line 22 Net RRSP-to-FHSA transfer amount =" prints no floor. Line 24
  # "Amount from line 23 of the previous page" is the same artifact.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_total_rrsp_transfers
      less: ca/fhsa_total_designated_transfers
    produces:
      output: ca/fhsa_net_rrsp_transfer_amount
  # Step 2 (continued): line 25 "Amount from line 17 of the previous page" and line 26 "Amount from
  # line 20 of the previous page" are the same artifacts; line 27 "Net RRSP-to-FHSA transfer amount
  # for 2024 and prior years: Line 25 minus line 26 =" prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_rrsp_transfers_in_2024_and_prior_years
      less: ca/fhsa_designated_transfers_in_2024_and_prior_years
    produces:
      output: ca/fhsa_net_rrsp_transfer_amount_for_2024_and_prior_years
  # Line 28 "Variable "H" amount of your annual FHSA limit for 2024 (from your 2025 FHSA
  # participation room statement)" is a starting amount; line 29 "Line 27 minus line 28 (if
  # negative, enter "0") =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/fhsa_net_rrsp_transfer_amount_for_2024_and_prior_years
      less: ca/fhsa_variable_h_amount
    produces:
      output: ca/fhsa_net_transfer_amount_less_variable_h_amount
  # Line 30 "8,000.00", the same dataset as line 14, read by its own step.
  - name: core/credit_amount
    params:
      amount: ca/fhsa_annual_amount
    produces:
      output: ca/fhsa_annual_amount_for_2024
  # Line 31 "Your FHSA carryforward for 2024 (from your 2024 FHSA participation room statement)" is
  # a starting amount; line 32 "Line 30 plus line 31 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_annual_amount_for_2024
        - ca/fhsa_carryforward_for_2024
    produces:
      output: ca/fhsa_annual_amount_for_2024_with_carryforward
  # Line 33 "Enter whichever is less: amount from line 29 or line 32.", in that order.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/fhsa_net_transfer_amount_less_variable_h_amount
        - ca/fhsa_annual_amount_for_2024_with_carryforward
    produces:
      output: ca/fhsa_transfer_amount_at_most_limit
  # Line 34 "Variable "F" amount of your annual FHSA limit for 2024 (from your 2025 FHSA
  # participation room statement)" is a starting amount; line 35 "Line 33 plus line 34 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_transfer_amount_at_most_limit
        - ca/fhsa_variable_f_amount
    produces:
      output: ca/fhsa_transfer_amount_plus_variable_f_amount
  # Line 36 "Line 24 minus line 35 =" (line 24 "Amount from line 23 of the previous page") prints no
  # floor.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_net_rrsp_transfer_amount
      less: ca/fhsa_transfer_amount_plus_variable_f_amount
    produces:
      output: ca/fhsa_net_transfer_amount_after_prior_years
  # Line 37 "Amount from line 16 of the previous page" and line 38 "Amount from line 36" are the
  # same artifacts; line 39 "Line 37 minus line 38 (if negative, enter "0") =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/fhsa_annual_amount_with_carryforward
      less: ca/fhsa_net_transfer_amount_after_prior_years
    produces:
      output: ca/fhsa_annual_amount_after_transfers
  # Line 40 "Enter whichever is less: amount from line 13 of the previous page or line 39. Annual
  # FHSA limit for 2025", in that order, when the maximum participation period has not ended.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/fhsa_contributions_limit
        - ca/fhsa_annual_amount_after_transfers
    produces:
      output: ca/fhsa_annual_limit_from_step_2
  # "If your maximum participation period (MPP) ended in a prior year, do not complete this step.
  # Your 2025 annual FHSA limit is "0". Enter "0" on line 40 and continue at Step 3.": the printed
  # 0, the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/fhsa_annual_limit_after_maximum_participation_period
    produces:
      output: ca/fhsa_annual_limit_after_maximum_participation_period
  # A count of 1 when the maximum participation period ended in a prior year (a caller's 0 or 1)
  # chooses the printed 0 over the result of Step 2 for line 40 (and so for line 41 "Annual FHSA
  # limit from line 40").
  - name: core/choose_by_count
    consumes:
      count: ca/fhsa_maximum_participation_period_ended
      when_none: ca/fhsa_annual_limit_from_step_2
      when_any: ca/fhsa_annual_limit_after_maximum_participation_period
    produces:
      output: ca/fhsa_annual_limit
  # Step 3 "Calculate your FHSA deduction and unused FHSA contributions available to deduct in
  # future years": line 42 "Your total annual FHSA limits for 2024 and prior years (from your 2025
  # FHSA participation room statement)" is a starting amount; line 43 "Line 41 plus line 42 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_annual_limit
        - ca/fhsa_annual_limits_for_2024_and_prior_years
    produces:
      output: ca/fhsa_total_annual_limits
  # Line 44 "Your total FHSA deductions for 2024 and prior years (from your 2025 FHSA participation
  # room statement)" is a starting amount; line 45 "Line 43 minus line 44 =" prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_total_annual_limits
      less: ca/fhsa_deductions_for_2024_and_prior_years
    produces:
      output: ca/fhsa_annual_limits_less_deductions
  # Line 46 "Lifetime FHSA limit 40,000.00", the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/fhsa_lifetime_limit
    produces:
      output: ca/fhsa_lifetime_limit
  # Line 47 "Your FHSA deduction from line 44" is the same artifact as line 44; line 48 "Line 46
  # minus line 47 =" prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_lifetime_limit
      less: ca/fhsa_deductions_for_2024_and_prior_years
    produces:
      output: ca/fhsa_lifetime_limit_less_deductions
  # Line 49 "Net RRSP-to-FHSA transfer amount from line 24" is the same artifact as line 23; line 50
  # "Line 48 minus line 49 (if negative, enter "0") =".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/fhsa_lifetime_limit_less_deductions
      less: ca/fhsa_net_rrsp_transfer_amount
    produces:
      output: ca/fhsa_lifetime_limit_less_deductions_and_transfers
  # Line 51 "Enter whichever is less: amount from line 45 or line 50. Maximum FHSA deduction
  # available for 2025", in that order.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/fhsa_annual_limits_less_deductions
        - ca/fhsa_lifetime_limit_less_deductions_and_transfers
    produces:
      output: ca/fhsa_maximum_deduction
  # Line 52 "Your unused FHSA contributions available to deduct in future years (from your 2025 FHSA
  # participation room statement)" is a starting amount; line 53 "Amount from line 3 of page 2" is
  # the same artifact as line 3; line 54 "Line 52 plus line 53 =".
  - name: core/sum
    consumes:
      parts:
        - ca/fhsa_unused_contributions_brought_forward
        - ca/fhsa_contributions_in_2025_before_first_qualifying_withdrawal
    produces:
      output: ca/fhsa_unused_contributions_plus_contributions
  # Line 55 "Amount from line 12 of page 2" is the same artifact as line 12; line 56 "Line 54 minus
  # line 55 =" prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_unused_contributions_plus_contributions
      less: ca/fhsa_excess_designated_withdrawals
    produces:
      output: ca/fhsa_contributions_available
  # Line 57 "Enter the FHSA contributions you are deducting for 2025 (cannot be more than the amount
  # on line 51 of the previous page). Enter this amount on line 20805 of your return. FHSA deduction
  # for 2025": the amount the filer chooses to deduct, a starting amount, refused when above line
  # 51, not capped (as Schedule 7 line 18 is refused above line 17); T1 line 37 and line 20805 is
  # that amount.
  - name: core/at_most
    consumes:
      amount: ca/fhsa_contributions_deducted
      bound: ca/fhsa_maximum_deduction
    produces:
      output: ca/fhsa_deduction
  # Line 58 "Line 56 minus line 57 Your unused FHSA contributions available to deduct in future
  # years =", a product of the return for the next year's line 52; it prints no floor.
  - name: core/subtract
    consumes:
      amount: ca/fhsa_contributions_available
      less: ca/fhsa_deduction
    produces:
      output: ca/fhsa_unused_contributions_carried_forward
  # T1 line 53 and line 23300 "Add lines 35 to 52.": the deductions wired so far in the form's line
  # order (20700, 20800, 20805, 21000, 21200, 21300, 21400, 21700, 22000, 22100, 22215, 22400,
  # 23200). Not wired yet: 21500, 21900, 22200, 22900 and 23100; lines 20810 and 21999 have no line
  # among lines 35 to 52 and nothing on this return reads them.
  - name: core/sum
    consumes:
      parts:
        - ca/rpp_deduction
        - ca/rrsp_deduction
        - ca/fhsa_deduction
        - ca/elected_split_pension_deduction
        - ca/union_dues
        - ca/uccb_repayment
        - ca/child_care_expenses
        - ca/allowable_business_investment_loss
        - ca/support_payments_deduction
        - ca/carrying_charges_interest_expenses_and_other_expenses
        - ca/cpp_enhanced_contributions
        - ca/exploration_and_development_expenses
        - ca/other_deductions
    produces:
      output: ca/deductions_from_total_income
  # T1 line 54 and line 23400 "Line 34 minus line 53 (if negative, show in brackets) Net income
  # before adjustments": total income less total deductions, not floored, so a negative result is
  # shown in brackets. The net income of line 56 (line 23600) stays the floored result until line
  # 23500 is wired.
  - name: core/subtract
    consumes:
      amount: ca/total_income
      less: ca/deductions_from_total_income
    produces:
      output: ca/net_income_before_adjustments
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/total_income
      less: ca/deductions_from_total_income
    produces:
      output: ca/net_income
  # Federal Worksheet "Line 25000 - Other payments deduction", "Complete the following
  # calculation if you reported net federal supplements on line 14600 of your return.":
  # line 1 "Amount from line 23400 of your return (if negative, enter "0")" is the net
  # income artifact (line 23400 floored at 0, as line 23500 is not wired yet); line 4 "Line
  # 2 plus line 3 =" adds line 2 "Amount from line 11700 of your return" (the universal
  # child care benefit) and line 3 "Amount from line 12500 of your return" (the RDSP
  # income), in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/universal_child_care_benefit
        - ca/rdsp_income
    produces:
      output: ca/uccb_and_rdsp_income
  # Line 5 "Line 1 minus line 4 =" prints no "(if negative, enter "0")", unlike line 1, so
  # it may be negative.
  - name: core/subtract
    consumes:
      amount: ca/net_income
      less: ca/uccb_and_rdsp_income
    produces:
      output: ca/net_income_less_uccb_and_rdsp_income
  # Line 8 "Line 6 plus line 7 =": line 6 "Amount from line 21300 of your return" (the UCCB
  # repayment, a starting amount, also a part of line 23300) and line 7 "RDSP income repayment
  # (included in the amount on line 23200 of your return)", a starting amount of its own that the
  # caller also includes in line 23200, in line order.
  - name: core/sum
    consumes:
      parts:
        - ca/uccb_repayment
        - ca/rdsp_income_repayment
    produces:
      output: ca/uccb_and_rdsp_income_repayments
  # Line 9 "Line 5 plus line 8 =", the amount the worksheet compares with $93,454.
  - name: core/sum
    consumes:
      parts:
        - ca/net_income_less_uccb_and_rdsp_income
        - ca/uccb_and_rdsp_income_repayments
    produces:
      output: ca/other_payments_limit_income
  # "If the amount on line 9 is more than $93,454, go to canada.ca/line-25000 to find out
  # how much you can deduct. Otherwise, enter the amount from line 14700 of your return on
  # line 25000 of your return.": a count of 1 when line 9 is more than $93,454 (a starting
  # count, 0 or 1, until a comparison capability derives it) chooses the amount that chart
  # gives (a starting amount) over line 14700.
  - name: core/choose_by_count
    consumes:
      count: ca/other_payments_worksheet_line_9_over_limit
      when_none: ca/income_support_benefits
      when_any: ca/other_payments_deduction_above_limit
    produces:
      output: ca/other_payments_deduction_after_limit
  # T1 line 60 and line 25000 "Other payments deduction (enter the amount from line 14700
  # if you did not enter an amount on line 14600; otherwise, use Federal Worksheet)": a
  # count of 1 when an amount was entered on line 14600 (a starting count, 0 or 1, until a
  # comparison capability derives it) chooses the worksheet's result over line 14700.
  - name: core/choose_by_count
    consumes:
      count: ca/other_payments_worksheet_required
      when_none: ca/income_support_benefits
      when_any: ca/other_payments_deduction_after_limit
    produces:
      output: ca/other_payments_deduction
  # Form T1436 (Capital Gains Worksheet), "Line 25300 - Net capital loss of other years (if you have
  # pre-1986 capital loss balance)" and its "Chart A - Adjustment calculation for carry-forward
  # losses": each cell of the printed rows "After May 22, 1985, and before 1988", "In 1988 and
  # 1989", "After 1989 and before 2000" and "After 2000 and before 2025" is its own step. Column (A)
  # "Amount of your unapplied net capital losses" is a starting amount per row, as the form takes
  # it; the rows "Before May 23, 1985" and "In 2000" are not wired yet.
  # Row "After May 22, 1985, and before 1988", column (C) "Adjusted gross capital losses (column A
  # multiplied by column B)", column (B) "Adjustment factor (for the inclusion rate)" being 1.
  - name: core/apply_fraction
    params:
      fraction: ca/net_capital_loss_inclusion_rate_factor_1985_to_1987
    consumes:
      base: ca/unapplied_net_capital_losses_1985_to_1987
    produces:
      output: ca/adjusted_gross_capital_losses_1985_to_1987
  # Row "In 1988 and 1989", column (C) "Adjusted gross capital losses (column A multiplied by column
  # B)", column (B) "Adjustment factor (for the inclusion rate)" being 3/4 (printed 0.75).
  - name: core/apply_fraction
    params:
      fraction: ca/net_capital_loss_inclusion_rate_factor_1988_and_1989
    consumes:
      base: ca/unapplied_net_capital_losses_1988_and_1989
    produces:
      output: ca/adjusted_gross_capital_losses_1988_and_1989
  # Row "After 1989 and before 2000", column (C) "Adjusted gross capital losses (column A multiplied
  # by column B)", column (B) "Adjustment factor (for the inclusion rate)" being 2/3 (printed
  # 0.6667).
  - name: core/apply_fraction
    params:
      fraction: ca/net_capital_loss_inclusion_rate_factor_1990_to_1999
    consumes:
      base: ca/unapplied_net_capital_losses_1990_to_1999
    produces:
      output: ca/adjusted_gross_capital_losses_1990_to_1999
  # Row "After 2000 and before 2025", column (C) "Adjusted gross capital losses (column A multiplied
  # by column B)", column (B) "Adjustment factor (for the inclusion rate)" being 1.
  - name: core/apply_fraction
    params:
      fraction: ca/net_capital_loss_inclusion_rate_factor_2001_to_2024
    consumes:
      base: ca/unapplied_net_capital_losses_2001_to_2024
    produces:
      output: ca/adjusted_gross_capital_losses_2001_to_2024
  # Line 4 "Total of column C from Chart A".
  - name: core/sum
    consumes:
      parts:
        - ca/adjusted_gross_capital_losses_1985_to_1987
        - ca/adjusted_gross_capital_losses_1988_and_1989
        - ca/adjusted_gross_capital_losses_1990_to_1999
        - ca/adjusted_gross_capital_losses_2001_to_2024
    produces:
      output: ca/total_adjusted_net_capital_losses
  # Line 5 "Taxable capital gains from line 12700 of your 2025 return", then line 6 "Enter whichever
  # is less: amount from line 4 or line 5.", in that order.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/total_adjusted_net_capital_losses
        - ca/taxable_capital_gains
    produces:
      output: ca/net_capital_losses_available_to_claim
  # Line 7 "Enter the amount of losses you want to claim (3).", note (3) "You can apply all or part
  # of the amount from line 6 against your taxable capital gains in 2025.": the amount the filer
  # chooses to claim, a starting amount, refused when above line 6, not capped. Lines 1 to 3 are not
  # completed, so "enter the amount from line 7 on line 25300 of your 2025 return" and "enter the
  # amount from line 7 on line 13": line 7 is T1 line 63 and line 25300 "Net capital losses of other
  # years" and Form T1436 line 13.
  - name: core/at_most
    consumes:
      amount: ca/net_capital_losses_claimed
      bound: ca/net_capital_losses_available_to_claim
    produces:
      output: ca/net_capital_losses_of_other_years
  # Row "After May 22, 1985, and before 1988", column (D) "Total adjusted net capital losses applied
  # against taxable capital gains in 2025": the lesser of column C and line 13, the amount claimed,
  # as "You have to apply net capital losses of earlier years before you apply net capital losses of
  # later years." (Guide T4037) puts the oldest row first.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/adjusted_gross_capital_losses_1985_to_1987
        - ca/net_capital_losses_of_other_years
    produces:
      output: ca/adjusted_losses_applied_1985_to_1987
  # What is left of line 13 after the row "After May 22, 1985, and before 1988": the amount before
  # it less its column D.
  - name: core/subtract
    consumes:
      amount: ca/net_capital_losses_of_other_years
      less: ca/adjusted_losses_applied_1985_to_1987
    produces:
      output: ca/adjusted_losses_left_after_1985_to_1987
  # Row "After May 22, 1985, and before 1988", column (E) "Remaining adjusted net capital losses
  # (column C minus column D)".
  - name: core/subtract
    consumes:
      amount: ca/adjusted_gross_capital_losses_1985_to_1987
      less: ca/adjusted_losses_applied_1985_to_1987
    produces:
      output: ca/remaining_adjusted_losses_1985_to_1987
  # Row "After May 22, 1985, and before 1988", column (G) "Net capital loss balance available to
  # carry forward (column E multiplied by column F)", column (F) "Adjustment factor (for carry-
  # forward losses)" being 1.
  - name: core/apply_fraction
    params:
      fraction: ca/net_capital_loss_carry_forward_factor_1985_to_1987
    consumes:
      base: ca/remaining_adjusted_losses_1985_to_1987
    produces:
      output: ca/net_capital_loss_balance_1985_to_1987
  # Row "In 1988 and 1989", column (D): the lesser of column C and what is left of line 13 after the
  # older rows.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/adjusted_gross_capital_losses_1988_and_1989
        - ca/adjusted_losses_left_after_1985_to_1987
    produces:
      output: ca/adjusted_losses_applied_1988_and_1989
  # What is left of line 13 after the row "In 1988 and 1989": the amount before it less its column
  # D.
  - name: core/subtract
    consumes:
      amount: ca/adjusted_losses_left_after_1985_to_1987
      less: ca/adjusted_losses_applied_1988_and_1989
    produces:
      output: ca/adjusted_losses_left_after_1988_and_1989
  # Row "In 1988 and 1989", column (E) "Remaining adjusted net capital losses (column C minus column
  # D)".
  - name: core/subtract
    consumes:
      amount: ca/adjusted_gross_capital_losses_1988_and_1989
      less: ca/adjusted_losses_applied_1988_and_1989
    produces:
      output: ca/remaining_adjusted_losses_1988_and_1989
  # Row "In 1988 and 1989", column (G) "Net capital loss balance available to carry forward (column
  # E multiplied by column F)", column (F) "Adjustment factor (for carry-forward losses)" being 4/3
  # (printed 1.33).
  - name: core/apply_fraction
    params:
      fraction: ca/net_capital_loss_carry_forward_factor_1988_and_1989
    consumes:
      base: ca/remaining_adjusted_losses_1988_and_1989
    produces:
      output: ca/net_capital_loss_balance_1988_and_1989
  # Row "After 1989 and before 2000", column (D): the lesser of column C and what is left of line 13
  # after the older rows.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/adjusted_gross_capital_losses_1990_to_1999
        - ca/adjusted_losses_left_after_1988_and_1989
    produces:
      output: ca/adjusted_losses_applied_1990_to_1999
  # What is left of line 13 after the row "After 1989 and before 2000": the amount before it less
  # its column D.
  - name: core/subtract
    consumes:
      amount: ca/adjusted_losses_left_after_1988_and_1989
      less: ca/adjusted_losses_applied_1990_to_1999
    produces:
      output: ca/adjusted_losses_left_after_1990_to_1999
  # Row "After 1989 and before 2000", column (E) "Remaining adjusted net capital losses (column C
  # minus column D)".
  - name: core/subtract
    consumes:
      amount: ca/adjusted_gross_capital_losses_1990_to_1999
      less: ca/adjusted_losses_applied_1990_to_1999
    produces:
      output: ca/remaining_adjusted_losses_1990_to_1999
  # Row "After 1989 and before 2000", column (G) "Net capital loss balance available to carry
  # forward (column E multiplied by column F)", column (F) "Adjustment factor (for carry-forward
  # losses)" being 3/2 (printed 1.5).
  - name: core/apply_fraction
    params:
      fraction: ca/net_capital_loss_carry_forward_factor_1990_to_1999
    consumes:
      base: ca/remaining_adjusted_losses_1990_to_1999
    produces:
      output: ca/net_capital_loss_balance_1990_to_1999
  # Row "After 2000 and before 2025", column (D): the lesser of column C and what is left of line 13
  # after the older rows.
  - name: core/lesser_of
    consumes:
      amounts:
        - ca/adjusted_gross_capital_losses_2001_to_2024
        - ca/adjusted_losses_left_after_1990_to_1999
    produces:
      output: ca/adjusted_losses_applied_2001_to_2024
  # Row "After 2000 and before 2025", column (E) "Remaining adjusted net capital losses (column C
  # minus column D)".
  - name: core/subtract
    consumes:
      amount: ca/adjusted_gross_capital_losses_2001_to_2024
      less: ca/adjusted_losses_applied_2001_to_2024
    produces:
      output: ca/remaining_adjusted_losses_2001_to_2024
  # Row "After 2000 and before 2025", column (G) "Net capital loss balance available to carry
  # forward (column E multiplied by column F)", column (F) "Adjustment factor (for carry-forward
  # losses)" being 1.
  - name: core/apply_fraction
    params:
      fraction: ca/net_capital_loss_carry_forward_factor_2001_to_2024
    consumes:
      base: ca/remaining_adjusted_losses_2001_to_2024
    produces:
      output: ca/net_capital_loss_balance_2001_to_2024
  # T1 line 68 and line 25700 "Add lines 58 to 67.": lines 58, 59, 60, 61, 62, 63 and 67 (lines
  # 24400, 24900, 25000, 25100, 25200, 25300 and 25600), in line order; lines 64 to 66
  # (25395, 25400 and 25500) are not wired yet.
  - name: core/sum
    consumes:
      parts:
        - ca/canadian_armed_forces_and_police_deduction
        - ca/security_options_deductions
        - ca/other_payments_deduction
        - ca/limited_partnership_losses_of_other_years
        - ca/non_capital_losses_of_other_years
        - ca/net_capital_losses_of_other_years
        - ca/additional_deductions
    produces:
      output: ca/deductions_from_net_income
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/net_income
      less: ca/deductions_from_net_income
    produces:
      output: ca/taxable_income
  - name: core/progressive_tax
    params:
      schedule: ca/brackets
    consumes:
      base: ca/taxable_income
    produces:
      output: ca/federal_basic_tax
  - name: core/progressive_tax
    params:
      schedule: ca-on/brackets
    consumes:
      base: ca/taxable_income
    produces:
      output: ca-on/ontario_basic_tax
  # T1 line 30000 "If the amount on line 23600 is $177,882 or less, enter $16,129. If
  # the amount on line 23600 is $253,414 or more, enter $14,538. Otherwise, use the
  # Federal Worksheet to calculate the amount to enter. (maximum $16,129)": the federal
  # basic personal amount is the worksheet's taper on net income (line 23600), the first
  # part of the T1's total of credit amounts.
  - name: core/tapered_amount
    params:
      taper: ca/basic_personal_amount
    consumes:
      base: ca/net_income
    produces:
      output: ca/basic_personal_amount
  # ON428 line 58040 has no reduction: the Ontario basic personal amount dataset becomes
  # an artifact of the same name, the first part of ON428's total of credit amounts.
  - name: core/credit_amount
    params:
      amount: ca-on/basic_personal_amount
    produces:
      output: ca-on/basic_personal_amount
  # The Canada employment amount: the lesser of the T1's cap and employment income.
  - name: core/capped_amount
    params:
      cap: ca/canada_employment_amount
    consumes:
      base: ca/employment_income
    produces:
      output: ca/canada_employment_amount
  # T1 line 100 (line 31800) "Disability amount transferred from a dependant (use Federal
  # Worksheet)", Federal Worksheet "Line 31800 - Disability amount transferred from a
  # dependant": for each dependant who is eligible for the disability tax credit, line 1
  # "Base amount 10,138.00", line 2 "Maximum supplement 5,914.00", line 4 "Threshold for
  # child care and attendant care expenses 3,464.00", line 8 "Line 1 plus line 7 (maximum
  # $16,052)", line 13 "Enter whichever is less: amount from line 8 or line 12. Allowable
  # amount for this dependant", and "the total of allowable amounts claimed for all
  # dependants who qualify for the disability tax credit".
  - name: ca/disability_transfer_amount
    params:
      base: ca/disability_transfer_base_amount
      supplement: ca/disability_transfer_supplement_maximum
      threshold: ca/disability_transfer_care_threshold
      maximum: ca/disability_transfer_maximum
    consumes:
      dependants: ca/disability_dependants
    produces:
      output: ca/disability_transferred_amount
  # Federal Worksheet, "Line 30100 - Age amount": line 1 "Maximum amount 9,028.00", the
  # dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/age_maximum
    produces:
      output: ca/age_maximum
  # Line 3 "Income threshold 45,522.00", the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/age_income_threshold
    produces:
      output: ca/age_income_threshold
  # Line 2 "Amount from line 23600 of your return", the net income, and line 4 "Line 2 minus
  # line 3 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/net_income
      less: ca/age_income_threshold
    produces:
      output: ca/age_income_over_threshold
  # Line 5 "Applicable rate 15%" and line 6 "Line 4 multiplied by the percentage from line
  # 5".
  - name: core/apply_rate
    params:
      rate: ca/age_rate
    consumes:
      base: ca/age_income_over_threshold
    produces:
      output: ca/age_reduction
  # Line 7 "Line 1 minus line 6 (if negative, enter "0") Enter this amount on line 30100
  # of your return."
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/age_maximum
      less: ca/age_reduction
    produces:
      output: ca/age_amount_before_count
  # T1 line 78 (line 30100) "Age amount (if you were born in 1960 or earlier) (use
  # Federal Worksheet) (maximum $9,028)": line 7 once if born in 1960 or earlier, else 0.
  - name: core/times_count
    consumes:
      amount: ca/age_amount_before_count
      count: ca/born_in_1960_or_earlier
    produces:
      output: ca/age_amount
  # Schedule 5, "Line 30300 - Spouse or common-law partner amount": line 2 and line 51090
  # "If you are eligible for the Canada caregiver amount for your spouse or common-law
  # partner, enter $2,687", for each spouse eligible for it, at most one.
  - name: core/per_unit_amount
    params:
      amount: ca/spouse_infirmity_amount
    consumes:
      count: ca/spouse_caregiver_eligible
    produces:
      output: ca/spouse_infirmity_supplement
  # Line 3 "Line 1 plus line 2", line 1 "Basic personal amount from line 30000 of your
  # return".
  - name: core/sum
    consumes:
      parts:
        - ca/basic_personal_amount
        - ca/spouse_infirmity_supplement
    produces:
      output: ca/spouse_amount_basis
  # Line 4 "Your spouse's or common-law partner's net income from line 23600 of their
  # return (Note 1)" and line 5 "Line 3 minus line 4 (if negative, enter "0") Enter this
  # amount on line 30300 of your return."
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/spouse_amount_basis
      less: ca/spouse_net_income
    produces:
      output: ca/spouse_amount_before_count
  # T1 line 79 (line 30300) "Spouse or common-law partner amount (complete Schedule 5)":
  # line 5 once if the filer claims it ("Only one spouse or common-law partner can claim
  # the amount on line 30300 for each other for the same year"), else 0.
  - name: core/times_count
    consumes:
      amount: ca/spouse_amount_before_count
      count: ca/spouses_claimed
    produces:
      output: ca/spouse_amount
  # Schedule 5, "Line 30400 - Amount for an eligible dependant": line 1 "Basic personal
  # amount from line 30000 of your return", line 3 "Line 1 plus line 2" with line 2 (an
  # infirm eligible dependant 18 or older) not triggered, line 4 (51106) "Dependant's net
  # income from line 23600 of their return" and line 5 "Line 3 minus line 4 (if
  # negative, enter "0") Enter this amount on line 30400 of your return.".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/basic_personal_amount
      less: ca/dependant_net_income
    produces:
      output: ca/eligible_dependant_amount_before_count
  # T1 line 80 (line 30400) "Amount for an eligible dependant (complete Schedule 5)":
  # line 5 for each eligible dependant claimed, at most one ("Each household is allowed
  # only one claim for this amount").
  - name: core/times_count
    consumes:
      amount: ca/eligible_dependant_amount_before_count
      count: ca/eligible_dependants
    produces:
      output: ca/eligible_dependant_amount
  # Schedule 5, "Line 30425 - Canada caregiver amount for spouse or common-law partner,
  # or eligible dependant age 18 or older": line 1 "Base amount 28,798.00", the dataset
  # as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca/spouse_caregiver_base
    produces:
      output: ca/spouse_caregiver_base
  # Line 2 "Net income for this person from line 23600 of their return", the spouse's
  # net income, and line 3 "Line 1 minus line 2 (if negative, enter "0") (maximum
  # $8,601)", before its maximum, then at most it.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/spouse_caregiver_base
      less: ca/spouse_net_income
    produces:
      output: ca/spouse_caregiver_before_maximum
  - name: core/capped_amount
    params:
      cap: ca/spouse_caregiver_maximum
    consumes:
      base: ca/spouse_caregiver_before_maximum
    produces:
      output: ca/spouse_caregiver_limit
  # Line 4 "Amount claimed on line 30300 or line 30400 of your return, if applicable", the
  # spouse amount, and line 5 "Line 3 minus line 4 (if negative, enter "0") Enter this
  # amount on line 30425 of your return."
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/spouse_caregiver_limit
      less: ca/spouse_amount
    produces:
      output: ca/spouse_caregiver_amount_before_count
  # T1 line 81 (line 30425) "Canada caregiver amount for spouse or common-law partner,
  # or eligible dependant age 18 or older (complete Schedule 5)": line 5 once if the
  # spouse is eligible for the Canada caregiver amount (line 51090), else 0. The eligible
  # dependant 18 or older (line 30400) is not wired here.
  - name: core/times_count
    consumes:
      amount: ca/spouse_caregiver_amount_before_count
      count: ca/spouse_caregiver_eligible
    produces:
      output: ca/spouse_caregiver_amount
  # T1 line 82 (line 30450) "Canada caregiver amount for other infirm dependants age 18 or
  # older (complete Schedule 5)", Schedule 5 "Line 30450 - Canada caregiver amount for other
  # infirm dependants age 18 or older": for each dependant, line 1 "Base amount 28,798.00"
  # less line 2 "Infirm dependant's net income from line 23600 of their return", line 3
  # "Line 1 minus line 2 (if negative, enter "0") (maximum $8,601)", and "the total of
  # allowable amounts claimed for all dependants".
  - name: ca/caregiver_amount
    params:
      base: ca/caregiver_base_amount
      maximum: ca/caregiver_maximum_amount
    consumes:
      dependants: ca/infirm_dependants
    produces:
      output: ca/caregiver_amount
  # T1 line 83 (line 30500) "Canada caregiver amount for infirm children under 18 years
  # of age (see Schedule 5) Number of children you are claiming this amount for Line
  # 30499" "multiplied by $2,687".
  - name: core/per_unit_amount
    params:
      amount: ca/infirm_child_amount
    consumes:
      count: ca/infirm_children
    produces:
      output: ca/infirm_children_amount
  # Worksheet ON428, "Line 58080 - Age amount": line 1 "Maximum amount 6,223.00", the
  # dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/age_maximum
    produces:
      output: ca-on/age_maximum
  # Line 3 "Income threshold 46,330.00", the dataset as an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/age_income_threshold
    produces:
      output: ca-on/age_income_threshold
  # Line 2 "Amount from line 23600 of your return", the net income, and line 4 "Line 2
  # minus line 3 (if negative, enter "0")".
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca/net_income
      less: ca-on/age_income_threshold
    produces:
      output: ca-on/age_income_over_threshold
  # Line 5 "Applicable rate 15%" and line 6 "Line 4 multiplied by the percentage from line
  # 5".
  - name: core/apply_rate
    params:
      rate: ca-on/age_rate
    consumes:
      base: ca-on/age_income_over_threshold
    produces:
      output: ca-on/age_reduction
  # Line 7 "Line 1 minus line 6 (if negative, enter "0") Enter this amount on line 58080 of
  # your Form ON428."
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/age_maximum
      less: ca-on/age_reduction
    produces:
      output: ca-on/age_amount_before_count
  # ON428 line 10 and line 58080 "Age amount (if you were born in 1960 or earlier) (use
  # Worksheet ON428) (maximum $6,223)": line 7 once if born in 1960 or earlier, else 0.
  - name: core/times_count
    consumes:
      amount: ca-on/age_amount_before_count
      count: ca/born_in_1960_or_earlier
    produces:
      output: ca-on/age_amount
  # ON428 line 11 "Base amount 11,905.00": the dataset becomes an artifact of the same name.
  - name: core/credit_amount
    params:
      amount: ca-on/spouse_base
    produces:
      output: ca-on/spouse_base
  # Line 12 "Your spouse's or common-law partner's net income from line 23600 of their
  # return", and line 13 (line 58120) "Line 11 minus line 12 (if negative, enter "0")
  # (maximum $10,823)", before its maximum, then at most it.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/spouse_base
      less: ca/spouse_net_income
    produces:
      output: ca-on/spouse_amount_before_maximum
  - name: core/capped_amount
    params:
      cap: ca-on/spouse_maximum
    consumes:
      base: ca-on/spouse_amount_before_maximum
    produces:
      output: ca-on/spouse_amount_before_count
  # Line 58120 for each spouse or common-law partner amount claimed, the T1 line 30300
  # count.
  - name: core/times_count
    consumes:
      amount: ca-on/spouse_amount_before_count
      count: ca/spouses_claimed
    produces:
      output: ca-on/spouse_amount
  # ON428 line 14 "Base amount 11,905.00": the dataset becomes an artifact of the same
  # name.
  - name: core/credit_amount
    params:
      amount: ca-on/eligible_dependant_base
    produces:
      output: ca-on/eligible_dependant_base
  # ON428 line 15 "Your eligible dependant's net income from line 23600 of their
  # return", the federal Schedule 5 line 4 figure, and line 16 (line 58160) "Line 14
  # minus line 15 (if negative, enter "0") (maximum $10,823)", before its maximum, then
  # at most it.
  - name: core/subtract_not_below_zero
    consumes:
      amount: ca-on/eligible_dependant_base
      less: ca/dependant_net_income
    produces:
      output: ca-on/eligible_dependant_amount_before_maximum
  - name: core/capped_amount
    params:
      cap: ca-on/eligible_dependant_maximum
    consumes:
      base: ca-on/eligible_dependant_amount_before_maximum
    produces:
      output: ca-on/eligible_dependant_amount_before_count
  # Line 58160 for each eligible dependant claimed, the T1 line 30400 count.
  - name: core/times_count
    consumes:
      amount: ca-on/eligible_dependant_amount_before_count
      count: ca/eligible_dependants
    produces:
      output: ca-on/eligible_dependant_amount
  # ON428 line 39 "Line 37 multiplied by the percentage from line 38" (line 37 "Amount from
  # line 23600 of your return", line 38 "Applicable rate 3%"): 3% of the net income.
  - name: core/apply_rate
    params:
      rate: ca-on/medical_net_income_rate
    consumes:
      base: ca/net_income
    produces:
      output: ca-on/medical_net_income_share
  # ON428 line 40 "Enter whichever is less: $2,885 or the amount on line 39."
  - name: core/capped_amount
    params:
      cap: ca-on/medical_threshold_ceiling
    consumes:
      base: ca-on/medical_net_income_share
    produces:
      output: ca-on/medical_threshold
  # ON428 line 41 "Line 36 minus line 40 (if negative, enter "0")": line 36 is the filer's

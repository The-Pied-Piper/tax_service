inputs:
  # Form T691 Part 3 line 3 "... the percentage in Column 5 of line 52220 on Form T2203", line 4
  # "you are a non-resident or deemed resident", and line 12 "Investment tax credit amount up to, but
  # not more than the amount I of Form T2038(IND)": the caller's figures, entered as the form takes
  # them. The bound, amount I, is read from the investment tax credit family, not entered here.
  - ca/amt_t2203_column_5_percentage
  - ca/amt_non_resident_or_deemed_resident
  # Form T2203 Part 2 "If you are subject to minimum tax, do not complete lines 4 to 10." and T1
  # line 127: the caller's choice, 1 when you are subject to minimum tax (Form T691 Part 3 line 4
  # is then the surtax), else 0.
  - ca/amt_subject_to_minimum_tax
  - ca/amt_investment_tax_credit_claim
  # Form T691 Part 4 line 1 "(i) Foreign business income", line 2 "Foreign non-business income",
  # line 3 "Non-taxable part of foreign capital gains included in adjusted taxable income", line 7
  # "(ii) Total non-business income tax paid to a foreign country (12)" and line 8 "Total business
  # income tax paid to a foreign country (13)": the caller's figures, as the form takes them.
  - ca/amt_foreign_business_income
  - ca/amt_foreign_non_business_income
  - ca/amt_foreign_capital_gains_non_taxable_claim
  - ca/amt_foreign_non_business_tax_paid
  - ca/amt_foreign_business_tax_paid
  # Form T691 Part 8 line 16 "Unapplied 2018 minimum tax carryover": the caller's figure from an
  # earlier return, entered as the form takes it.
  - ca/amt_unapplied_2018_carryover

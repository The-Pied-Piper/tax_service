# The printed constants of Form T2125 Charts B and C that Forms T2042 and T2121 read: T2042 and T2121
# are not forms yet, so the return selects the steps they read, and the form ca/t2125 has its own
# copy of each in `03b_t2125.yaml`. T2125 Chart B "Available interest expense for passenger
# vehicles and zero-emission passenger vehicles" and Chart C "Eligible leasing cost for passenger
# vehicles": the printed constants are datasets of the same name, one step each ("$350***", "÷ 30",
# "$44,706", "$1,100" and "$38,000").
capabilities:
  - name: core/credit_amount
    params:
      amount: ca/business_vehicle_interest_limit
    produces:
      output: ca/business_vehicle_interest_limit
  - name: core/credit_amount
    params:
      amount: ca/business_vehicle_days_divisor
    produces:
      output: ca/business_vehicle_days_divisor
  - name: core/credit_amount
    params:
      amount: ca/business_vehicle_list_price_limit
    produces:
      output: ca/business_vehicle_list_price_limit
  - name: core/credit_amount
    params:
      amount: ca/business_vehicle_lease_charge_limit
    produces:
      output: ca/business_vehicle_lease_charge_limit
  - name: core/credit_amount
    params:
      amount: ca/business_vehicle_lease_cost_limit
    produces:
      output: ca/business_vehicle_lease_cost_limit

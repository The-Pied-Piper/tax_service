inputs:
  # Form T2038(IND) Part A line 67120 "ITC for qualified expenditures for SR&ED (amount from line
  # 559
  # of Form T661 plus applicable amount from box 40* of your T3 slip, minus amounts from lines 67130
  # and 67135)": the caller's figure, as the form takes it.
  - ca/itc_sred_expenditures
  # Form T2038(IND) Part A line 67130 "80% of total contributions made to agricultural organizations
  # for SR&ED": the caller's figure, as the form takes it.
  - ca/itc_agricultural_sred_contributions
  # Form T2038(IND) Part A line 67135 "ITC allocated from a partnership for SR&ED (see boxes 186,
  # 187,
  # and 189 of your T5013 slips)": the caller's figure, read as it is.
  - ca/itc_sred_partnership_allocation
  # Form T2038(IND) Part A line 67140 "ITC for total investments in qualified property (include
  # applicable amount from box 40* of your T3 slip)": the caller's figure, as the form takes it.
  - ca/itc_qualified_property
  # Form T2038(IND) Part B line 67170 "Total of your flow-through mining expenditures related to
  # mineral exploration tax credit" from Part IV of Form T1229: the caller's figure, as the form
  # takes
  # it.
  - ca/itc_mineral_exploration_expenditures
  # Form T2038(IND) Part B line 67175 "Total of your flow-through critical mineral mining
  # expenditures
  # related to critical mineral exploration tax credit" from Part IV of Form T1229: the caller's
  # figure, as the form takes it.
  - ca/itc_critical_mineral_expenditures
  # Form T2038(IND) Part B Table 1 "Calculation of total Apprenticeship job creation tax credit",
  # one
  # record for each apprentice, column 3 "The lesser of eligible salary and wages** payable in the
  # year
  # or $20,000.": the caller's list, as the form takes it.
  - ca/itc_apprentices
  # Form T2038(IND) Part B line 67180 "Total apprenticeship job creation tax credit (Total of
  # amounts in
  # column 3 plus applicable amount from box 40* of your T3 slip)": the caller's box 40 amount of
  # the T3
  # slip, as the form takes it.
  - ca/itc_apprenticeship_t3_box_40
  # Form T2038(IND) Part B line 67184 "Repayment of assistance that reduced qualified SR&ED
  # expenditures incurred in 2014 and prior years (amount from line 560 of Form T661)": the caller's
  # figure, as the form takes it.
  - ca/itc_sred_repayment_2014_and_prior
  # Form T2038(IND) Part B line 67185 "Repayment of assistance that reduced qualified SR&ED
  # expenditures incurred in 2015 and subsequent years (amount from line 560 of Form T661)": the
  # caller's figure, as the form takes it.
  - ca/itc_sred_repayment_2015_and_after
  # Form T2038(IND) Part D amount 1 "ITC opening balance and carry forward from prior years (net of
  # expired amounts)": the caller's figure, as the form takes it.
  - ca/itc_opening_balance
  # Form T2038(IND) Part D amount 6 "Adjustment for a graduated rate estate, enter the amount of ITC
  # allocated to beneficiaries from box 40 of your T3 slip": the caller's figure, as the form takes
  # it.
  - ca/itc_graduated_rate_estate_allocation
  # Form T2038(IND) Part D amount 15 "Enter your claim on this line:": the claim the filer chooses,
  # an election, as the form takes it; it is claimed up to amount I or K and refused above it.
  - ca/itc_claim

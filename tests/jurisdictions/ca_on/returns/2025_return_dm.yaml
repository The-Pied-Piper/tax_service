# Return DM: T1 line 31400 when the filer elects to split pension income. The same filer as
# Return DG (employment income, a pension, the volunteer firefighters' amount, the home buyers'
# amount, home accessibility expenses, one adoption and student loan interest), who elects to split
# the pension with a spouse or common-law partner, so line 31400 is the Form T1032 amount.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  Return DM: Return DG with the pension split election. Employment income is $100,000 (T1 line
  10100, a chosen figure) and other pension income is $20,000 (T1 line 11500, a chosen figure).
  The Federal Worksheet for line 31400 gives 2,000.00 (line 8 is 20,000.00, the lesser of that and
  $2,000), as in Return DG, but the filer elects to split the pension (a chosen count of 1) and
  Form T1032 gives 1,000 (a chosen figure; the engine does not run Form T1032), so line 31400 is
  the Form T1032 amount, 1,000.00, in place of the worksheet's 2,000.00. Every other line is as in
  Return DG, so the federal total of credit amounts (line 33500) falls by 1,000.00, from 68,633.58
  to 67,633.58. At 14.5% that is 9,806.87 (the credit amounts at the credit rate). The top-up tax
  credit (Federal Worksheet "Line 34990 - Top-up tax credit") is (9,806.87 - 8,319.38) x 3.45% =
  51.32 (rounded half-up), so the non-refundable tax credits are 9,806.87 + 51.32 = 9,858.19 and
  the federal tax after credits is Return DG's 11,158.82 plus the 150.00 fall in credits, 11,308.82.
  The Ontario credit amounts (ON428 line 44, line 58800) are the basic personal amount 12,747 plus
  the CPP base contributions 3,356.10 and EI premiums 1,077.48, the adoption expenses 8,000.00 (line
  58330, one child under the 15,551 cap), the pension income amount 1,000.00 (line 58360, the
  lesser of 1,762 and the 1,000.00 on line 31400) and the student loan interest 600.00 (line 58520),
  26,780.58, at 5.05% is 1,352.4193, so 1,352.42. The Ontario tax on taxable income is Return DG's
  8,977.74, less 1,352.42, which is 7,625.32 on ontario_tax_less_dividend_credit. The Ontario surtax
  is 20% x (7,625.32 - 5,710) + 36% x (7,625.32 - 7,307) = 383.06 + 114.60 = 497.66, so ontario_tax
  is 7,625.32 + 497.66 + 750.00 (the Ontario health premium, as in Return DG) = 8,872.98, and the
  balance owing is 11,308.82 + 8,872.98 = 20,181.80.
sources:
  - >-
    CRA, Federal Worksheet 2025, Line 31400 (https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-d1/5000-d1-25e.txt,
    confirmed text, docs/cra-forms-2025/5000-d1-25e.txt): "Enter on line 31400 of your return
    whichever amount is less: line 8 or $2,000. However, if you are electing to split your
    eligible pension with your spouse or common-law partner, complete Form T1032, Joint Election
    to Split Pension Income, to calculate the amount to enter on line 31400 of your return
    instead."

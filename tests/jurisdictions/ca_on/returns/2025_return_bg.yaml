# Return BG: a filer with employment income who has film property, rental and leasing
# property and tax shelter amounts, computed on Form T691 (alternative minimum tax) Part 1
# lines 1 to 12. The Part 1 amounts that are not lines of this return are chosen figures,
# entered as the form takes them; the adjustments and the subtotal are computed from them.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single filer, a 2025 Ontario resident, with employment income of 60000.00, a chosen
  figure, and no other income, deduction or credit claimed. The filer has 12 months of CPP
  contributions, a chosen figure (cpp_months 12). Schedule 8 line 28 enters the deduction
  for CPP enhanced contributions on line 22215: the first additional contribution of
  565.00 (1% of 60000.00 less the 3500.00 basic exemption, under its maximum of 678.00).
  So taxable income, line 26000 of the return and Form T691 Part 1 line 1, is 60000.00
  less 565.00 = 59435.00. Film property, Part 1 lines 2 to 4: line 2, the CCA and carrying
  charges, is 9000.00 and line 3, the net income from film property before CCA, is
  4000.00, both chosen figures; line 4 is 9000.00 minus 4000.00 = 5000.00, which is not
  below zero. Rental and leasing property, lines 5 to 7: line 5 is 7000.00 and line 6 is
  9000.00, both chosen figures; line 7 is 7000.00 minus 9000.00 = -2000.00, which is below
  zero, so line 7 is 0.00. Tax shelters, lines 8 to 11: line 8, the losses from
  partnerships that are tax shelters, is 1000.00, line 9, the amounts deductible for
  properties that are tax shelters, is 500.00, and line 10, the carrying charges for a
  limited or non-active partner, is 250.00, all chosen figures; line 11 is 1000.00 +
  500.00 + 250.00 = 1750.00. Line 12 is line 1 plus lines 4, 7 and 11: 59435.00 + 5000.00
  + 0.00 + 1750.00 = 66185.00. Not yet computed: Part 1 line 14 onward and the rest of
  Part 1, and Parts 2 to 9 of Form T691. Amounts are quoted decimals, and the count of CPP
  months is a quoted digit string.
sources:
  - >-
    CRA, Form T691 (2025), docs/cra-forms-2025/t691-25e.pdf: "Taxable income from line
    26000 of your return"; "Line 2 minus line 3 (if negative, enter "0")" "67820 =";
    "Line 5 minus line 6 (if negative, enter "0")" "67830 ="; "Add lines 8 to 10."
    "67840 ="; "Add lines 1, 4, 7, and 11."
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t691/t691-25e.pdf
  - >-
    CRA, Schedule 8 (form 5000-S8, 2025), docs/cra-forms-2025/5000-s8-25e.txt: "Deduction
    for CPP enhanced contributions on employment income:" "Line 28: Line 26 plus line 27 Enter
    this amount (in dollars and cents) on line 22215 of your return."
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
inputs:
  ca/employment_income: "60000"
  ca/cpp_months: "12"
  ca/amt_film_property_cca_and_carrying_charges: "9000.00"
  ca/amt_film_property_income_before_cca: "4000.00"
  ca/amt_rental_property_cca_and_carrying_charges: "7000.00"
  ca/amt_rental_property_income_before_cca: "9000.00"
  ca/amt_tax_shelter_losses: "1000.00"
  ca/amt_tax_shelter_deductible_amounts: "500.00"
  ca/amt_limited_partner_carrying_charges: "250.00"
expected:
  ca/taxable_income: "59435.00"
  ca/amt_film_property_adjustment: "5000.00"
  ca/amt_rental_property_adjustment: "0.00"
  ca/amt_tax_shelter_adjustments: "1750.00"
  ca/amt_part_1_subtotal: "66185.00"
  ca/net_income_before_adjustments: "59435.00"
  ca/other_payments_limit_income: "59435.00"
  ca/cpp_second_additional_earnings_maximum: "9900.00"
  ca-on/ontario_tax_less_dividend_credit: "2435.32"
  ca/refund_or_balance_owing: "8676.79"

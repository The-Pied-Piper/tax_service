    26000 of your return"; "Line 2 minus line 3 (if negative, enter "0")" "67820 =";
    "Line 5 minus line 6 (if negative, enter "0")" "67830 ="; "Add lines 8 to 10."
    "67840 ="; "Add lines 1, 4, 7, and 11."; "Add lines 2 to 4."; "Line 1 minus line 5 (if
    negative, enter "0")"; "Resource property and flow-through share 67860 ="; "Add lines 16
    to 18."; "Line 15 minus line 19 (if negative, show in brackets)"; "Line 24 minus line 25";
    "30%"; "Line 28 plus line 29" "67910 ="; "× 40%"; "Line 30 minus line 31 (if negative,
    enter "0")"; "Add lines 35 to 37." "67918 ="; "Line 39 or 40, as applicable, plus line 41
    and 42"; "Line 45 minus line 46"; "Line 48 minus line 49"; "Add lines 47, 50, 51, and 52.";
    "Add lines 54 to 62."; "Add lines 64 to 67 (11)" "67924 ="; "Add lines 70 to 75." "67926 =";
    "Line 69 minus line 76"; "Add lines 63, 68, and 77."; "Applicable Rate" "× 50%"; "Line 78
    multiply by the percentage from line 79"; "Line 20 minus line 21 (if negative, do not show
    in brackets.)"; "If line 20 is positive, enter the amount from line 22."; "If line 20 is
    negative, enter whichever is less: the amount from line 21 or line 22 (show in brackets).";
    "Add lines 13, 14, 23, and 26."; "Line 27 plus line 32"; "Add lines 34, 38, and 43.";
    "Line 80 plus line 81"; "Enter the amount from line 44."; "B × 13.0435%"; "Amount A minus
    Amount B ="; "C × 27.5362% ="; "Line 84 plus line 85"; "Enter the amount from line 25400 of your
    return" "× 40% ="; "Line 86 plus line 87"; "Amount from line 25395 of your return × 2 =";
    "line 89 minus line 90"; "Line 88 plus line 91"; "Line 83 minus line 92 (if negative, enter
    "0")"; "Basic exemption" "177,882.00"; "Line 93 minus line 94 (if negative, enter "0")";
    "Federal tax rate" "× 20.5%"; "Gross minimum amount: line 95 multiplied by the percentage on
    line 96."; "Net non-refundable tax credits (line 33800 of your return)" "× 50% ="; "Donations and
    gifts (line 34900 of your return)" "× 80% ="; "Add lines 98 to 101."; "Line 97 minus line 102
    (if negative, enter "0")"; "Minimum amount"

# Return BG: a filer with employment income who has film property, rental and leasing
# property, tax shelter amounts, resource property, a capital gain and gifts of publicly
# listed securities, computed on Form T691 (alternative minimum tax) Parts 1 and 9 as far as
# line 103. The Part 1 and Part 9 amounts that are not lines of this return are chosen
# figures, entered as the form takes them; the adjustments and the sums are computed from them.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single filer, a 2025 Ontario resident, with employment income of 60000.00, a chosen
  figure, and no other income, deduction or credit claimed. The filer has 12 months of CPP
  contributions, a chosen figure (cpp_months 12). Schedule 8 line 28 enters the deduction
  for CPP enhanced contributions on line 22215: the first additional contribution of
  565.00 (1% of 60000.00 less the 3500.00 basic exemption, under its maximum of 678.00).
  The filer also disposes of shares for proceeds of 5000.00, with an adjusted cost base of
  3000.00 and no outlays, all chosen figures: the gain is 2000.00, and at the 50% inclusion
  rate the taxable capital gains, line 12700 of the return and Form T691 Part 1 line 21, are
  1000.00. So taxable income, line 26000 of the return and Form T691 Part 1 line 1, is
  60000.00 less 565.00 plus 1000.00 = 60435.00. Film property, Part 1 lines 2 to 4: line 2,
  the CCA and carrying charges, is 9000.00 and line 3, the net income from film property
  before CCA, is 4000.00, both chosen figures; line 4 is 9000.00 minus 4000.00 = 5000.00,
  which is not below zero. Rental and leasing property, lines 5 to 7: line 5 is 7000.00 and
  line 6 is 9000.00, both chosen figures; line 7 is 7000.00 minus 9000.00 = -2000.00, which is
  below zero, so line 7 is 0.00. Tax shelters, lines 8 to 11: line 8, the losses from
  partnerships that are tax shelters, is 1000.00, line 9, the amounts deductible for
  properties that are tax shelters, is 500.00, and line 10, the carrying charges for a
  limited or non-active partner, is 250.00, all chosen figures; line 11 is 1000.00 +
  500.00 + 250.00 = 1750.00. Line 12 is line 1 plus lines 4, 7 and 11: 60435.00 + 5000.00
  + 0.00 + 1750.00 = 67185.00. Part 9, resource property, lines 1 to 4 are chosen figures:
  5000.00, 2000.00, 1000.00 and 500.00; line 5 is 2000.00 + 1000.00 + 500.00 = 3500.00 and
  line 6 is 5000.00 minus 3500.00 = 1500.00, not below zero. Part 1 lines 15 to 20: line 15
  is the capital gain of 2000.00; line 16 is 0.00, as there is no foreclosure gain or loss;
  lines 17 and 18 are chosen figures, 200.00 and 100.00; line 19 is 300.00; line 20 is 2000.00
  minus 300.00 = 1700.00. Line 21 is the taxable capital gains of 1000.00 (line 12700), and line
  22 is 1700.00 minus 1000.00 = 700.00; line 20 is positive, so line 23 is the amount from
  line 22, 700.00. Part 1 lines 24 to 26: line 24 is 3000.00 and line 25 is 1000.00,
  both chosen figures; the line 24 less line 25 amount is 2000.00, and 30% of it is 600.00 on
  line 26. Part 1 lines 28 to 32: line 28, the total of boxes 39 and 91 of the T4 slips, is
  1000.00 and line 29, the amount from line 2 of Form T1212, is 400.00, both chosen figures;
  line 30 is 1000.00 plus 400.00, 1400.00. Line 31, the gifts of publicly listed securities under
  a security option plan, is a chosen figure of 500.00, and 40% of it is 200.00; line 32 is
  1400.00 minus 200.00, 1200.00, not below zero. Part 1 lines 35 to 38: line 35, boxes 41 and 92
  of the T4 slips, is 300.00; line 36 is 100.00 and line 37 is 50.00, all chosen figures; line
  38 is 450.00. Part 1 lines 39 to 43: line 39, the limited partnership difference with no
  election, is a chosen figure of 600.00; line 40 is not applicable and is left out; line 41 is
  100.00 and line 42 is 50.00, chosen figures; line 43 is 600.00 plus 100.00 plus 50.00, 750.00.
  Part 1 lines 45 to 47: line 45, the limited partnership losses of other years, is 0 as none
  are claimed; line 46 is the amount from line 39, 600.00; line 47 is 0 minus 600.00, -600.00, a
  loss in brackets. Lines 48 to 50: line 48 is 0 as no non-capital losses of other years are
  claimed; line 49 is the amount from line 41, 100.00; line 50 is -100.00. Lines 51 and 52 (union
  dues and child care expenses) are 0 as none are claimed, since a claim would change taxable
  income; line 53 is -600.00 plus -100.00, -700.00. Lines 54 to 63: lines 55, 57 and 59 to 62 are
  0 as none are claimed (line 59 is for Quebec only); line 56, the moving expenses of line 21900,
  is a chosen figure of 200.00; line 58 is the enhanced CPP contributions of 565.00 (line 22215)
  above; line 63 is -700.00 plus 200.00 plus 565.00, 65.00. Lines 64 to 68: line 64 is a chosen
  figure of 300.00, line 65 is 100.00, line 66 is not applicable and line 67 is 50.00; line 68
  is 450.00. Lines 69 to 77: line 69, other employment expenses of line 22900, is 0 as none are
  claimed; line 70 is a chosen figure of 150.00 and lines 71 to 75 are not applicable; line 76
  is 150.00; line 77 is 0 minus 150.00, -150.00, a loss in brackets. Line 78 is 65.00 plus
  450.00 plus -150.00, 365.00, and line 80 is 365.00 at the 50% of line 79, 182.50. Line 13 is
  the amount from line 12, 67185.00, and line 14 the amount from Part 9 line 6, 1500.00; line
  27 is 67185.00 + 1500.00 + 700.00 + 600.00 = 69985.00. Line 33 is 69985.00 plus line 32,
  1200.00, 71185.00, and line 34 is the amount from line 33. Line 44 is 71185.00 + 450.00 + 750.00 =
  72385.00, the amounts of lines 38 and 43 being 450.00 and 750.00. Line 81 is the amount from line
  44, and line 82 is 182.50 + 72385.00 = 72567.50; line 83 is the amount from line 82. Return BG
  claims no dividends, so lines 12000 and 12010 are 0.00 (lines 84 and 85 are then 0.00), and it
  claims no capital gains deduction (lines 25400 and 25395 are 0.00), so lines 86 to 92 are 0.00.
  Line 93 is 72567.50 minus 0.00, 72567.50. Line 94 is the basic exemption, 177882.00, and line 95
  is 72567.50 minus 177882.00, below zero, so 0.00: the filer is not subject to alternative minimum
  tax, and line 97 is 0.00 at 20.5% of line 95. Line 98 is 50% of line 33800 of the return, 3100.21,
  which is 1550.105, a tie, rounded half-up to 1550.11; line 99 is 0.00 as no donations and gifts
  are claimed, and lines 100 and 101 are not claimed. Line 102 is 1550.11, and line 103 is 0.00
  minus 1550.11, below zero, so 0.00. Not yet computed: Parts 2 to 8 of Form T691. Amounts are
  quoted decimals, and the count of CPP months is a quoted digit string.

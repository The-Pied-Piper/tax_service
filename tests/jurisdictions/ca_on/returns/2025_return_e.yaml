  - >-
    CRA, the 2025 Federal Worksheet (form 5000-D1): "Line 30000 - Basic personal amount. If
    the amount from line 23600 of your return is: $177,882 or less, enter $16,129 on line
    30000 of your return; $253,414 or more, enter $14,538 on line 30000 of your return.
    Otherwise, complete the calculation below." Line 1 "Base amount 14,538.00"; line 2
    "Supplement amount 1,591.00"; line 3 "Amount from line 23600 of your return"; line 4
    "Income threshold 177,882.00"; line 5 "Line 3 minus line 4"; line 6 "75,532.00"; line 7
    "Line 5 divided by line 6"; line 8 "1,591.00"; line 9 "Line 7 multiplied by line 8";
    line 10 "Line 2 minus line 9 (if negative, enter "0")"; line 11 "Line 1 plus line 10
    Enter this amount on line 30000 of your return. (maximum $16,129)". The worksheet states
    no rounding and no number of decimal places for line 7. CRA, T4127 Payroll Deductions
    Formulas, 120th edition, effective January 1, 2025, gives the same formula on its own
    NI, a payroll figure ("* NI = A + HD."), not line 23600, and is cited here for the
    formula's shape and its rounding rule only: "Where $177,882 < NI* < $253,414, BPAF** =
    $16,129 - (NI* - $177,882) × ($1,591 / $75,532)***"; "*** Note that there is no rounding
    on this division."; "** If the BPAF has three or more digits after the decimal point,
    increase the second digit after the decimal point by one if the third digit is five or
    more, and drop the third digit. If the third digit after the decimal point is less than
    five, drop the third digit." So the quotient is carried unrounded and the amount on line
    30000 is rounded half-up to the cent, once. Net income of 198,926.00 is more than
    177,882 and less than 253,414, so the calculation is completed: line 3 is 198,926.00;
    line 5 is 198,926.00 - 177,882 = 21,044.00; line 7 is 21,044.00 / 75,532 =

    computes as 1,591 x 21,044.00 / 75,532 in one expression, multiplying before it divides
    so that the division is its only inexact step: 33,481,004.00 / 75,532 =
    443.2691309643594767780543346 (to the Decimal context's 28 significant digits); line 10
    is 1,591 - 443.2691309643594767780543346 = 1,147.7308690356405232219456654, positive;
    line 11 is 14,538 + 1,147.7308690356405232219456654 = 15,685.7308690356..., whose third

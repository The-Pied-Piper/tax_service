# Return D: a 2025 Ontario resident whose employment income is inside the second additional
# CPP band ($71,300 to $81,200), so CPP2 is exercised below its maximum, while the base and
# first additional CPP contributions and the EI premiums are at their printed maximums.
# Computed from employment income to total income; from employment income, by Schedule 8's
# three contribution tiers, to the base, first additional and second additional CPP
# contributions, the last two together the enhanced CPP contributions; from employment
# income, up to the EI maximum insurable earnings, to the EI premiums; from the unused RRSP
# contributions from earlier years and the RRSP contributions, their sum, to the
# contributions available to deduct (Schedule 7 line 10), and from those and the deduction
# limit, the lesser of them, to the RRSP deduction (Schedule 7 line 20); less the enhanced
# CPP contributions to net income, less the (empty) deductions from net income to taxable
# income; from net income, by the Federal Worksheet, to the federal basic personal amount;
# and through each form's total of non-refundable credit amounts (its basic personal amount,
# the base CPP contributions and the EI premiums, and on the T1 alone the Canada employment
# amount), credited once at the form's credit rate to the form's non-refundable tax credits
# (T1 line 35000, ON428 line 61500), taken off its basic tax, not below zero, to the tax
# after credits, and on ON428 the surtax on the Ontario tax after credits, added to it to
# the Ontario tax with surtax; and, with no dependent children or dependants, the Ontario
# tax reduction amounts (the basic reduction alone), twice them less the Ontario tax with
# surtax, not below zero, to the Ontario tax reduction, taken off the Ontario tax with
# surtax, not below zero, to the Ontario tax after the reduction; and from taxable income,
# by the health premium chart's tiers, each capped at the next plateau, to the Ontario
# health premium, added to the Ontario tax after the reduction to the Ontario tax. There is
# no capital gain, unused or new RRSP contribution or union dues. Not yet computed, so not
# in this file: any deduction from net income, the social benefits repayment, capital
# losses, the LIFT credit (ON428 line 85), and the balance owing. Lines 82 (the provincial
# foreign tax credit) and 87 (the community food program donation tax credit for farmers)
# are not triggered by this return.
# Amounts are quoted decimal strings, never floats; counts are plain integers. Every output
# the CA-ON manifest declares must appear under `expected`; intermediate lines may be listed
# and are then checked too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident with 2025 employment income (T1 line 10100) of $75,000 and no other
  income: no capital gain, so taxable capital gains (line 12700) of $0 and total income
  (line 15000) of $75,000. The CPP contributions are computed from employment income, which
  Schedule 8 line 1 reads as the pensionable earnings when T4 box 26 is blank. The EI
  premiums are computed from employment income, taken as the insurable earnings. Employment
  income is above the EI maximum insurable earnings ($65,700) and the CPP first earnings
  ceiling ($71,300) but below the second ceiling ($81,200), so EI premiums (line 31200,
  ON428 line 58300) are the maximum $1,077.48, base CPP contributions (Schedule 8 line 11,
  T1 line 30800, ON428 line 58240) are the maximum $3,356.10, and enhanced CPP contributions
  (line 22215) are the first additional (Schedule 8 line 12) maximum $678.00 plus the second
  additional (line 22) 4% x (75,000 - 71,300) = $148.00, together $826.00. No unused or new
  RRSP contributions, so the RRSP deduction (line 20800) is $0, the lesser of the
  contributions available to deduct (Schedule 7 line 10) of $0 (the unused contributions
  from earlier years of $0, Schedule 7 line 1, plus the contributions of $0, Schedule 7 line
  4) and a chosen deduction limit of $13,500 (Schedule 7 line 11); no union dues (line
  21200), so total deductions (line 23300) are the enhanced CPP contributions of $826.00 and
  net income (line 23600) is $74,174.00. There are no deductions from net income (lines
  24400 to 25600), so their total (line 25700) is $0 and taxable income (line 26000),
  derived as net income less that total, is $74,174.00, in the second federal and Ontario
  brackets. The non-refundable credit amounts are the basic personal amount (federal line
  30000 $16,129, since net income is $177,882 or less; Ontario ON428 line 58040 $12,747),
  the base CPP contributions and the EI premiums, and on the T1 alone the Canada employment
  amount (line 31260) of $1,471, the lesser of $1,471 and employment income (ON428 has no
  such line): line 33500 of $22,033.58 and ON428 line 58800 of $17,180.58. The rate is
  applied once to each total: 14.5% federally (line 33800) and 5.05% for Ontario (ON428 line
  58840). Each product is its form's non-refundable tax credits: the total federal
  non-refundable tax credits (line 35000) of $3,194.8691 and the Ontario non-refundable tax
  credits (ON428 line 61500) of $867.61929, each taken off its form's basic tax, not below
  zero. The Ontario surtax (ON428 line 68) is 20% of the Ontario tax after credits over
  $5,710 plus 36% of it over $7,307: $0, as the Ontario tax after credits is below $5,710,
  so the Ontario tax with surtax (ON428 line 69) is that same $3,750.97571. With no
  dependent children and no dependants (ON428 lines 75 and 76), the Ontario tax reduction
  amounts (line 77) are the basic reduction of $294.00 (line 74); twice them, $588.00 (line
  78), less the Ontario tax with surtax (line 79, from line 73) is negative, so the Ontario
  tax reduction (line 80) is $0 and the Ontario tax after the reduction (line 81) is that
  same $3,750.97571. The Ontario health premium (ON428 line 89) is read from its chart on
  taxable income: $74,174.00 is more than $72,600 but not more than $200,000, so the premium
  is $750, and the Ontario tax (ON428 line 90) is the Ontario tax after the reduction plus
  the premium, $4,500.97571. The CPP contributions, the EI premiums and the federal basic
  personal amount are rounded to the cent, which changes none of them; no other amounts are
  rounded.

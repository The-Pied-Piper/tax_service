# Return H: a single retiree, a 2025 Ontario resident, with no employment income and income
# only from the Step 2 lines that are not employment or capital gains: Old Age Security
# (OAS) of $8,000, CPP benefits of $9,000, other pensions of $20,000, RRSP income of $5,000,
# workers' compensation of $2,000 and interest and other investment income of $1,400 (the
# Federal Worksheet's T5 slips of $1,200 and bank interest with no slip of $300, less $100
# reported in an earlier year). Computed from the income lines to total income: the Federal
# Worksheet's line 9, the eight sources of line 12100 added, and its line 11, that less the
# part reported in previous years, to the interest and other investment income (T1 line
# 12100); lines 14400, 14500 and 14600 added to line 14700; and, in line order, employment
# income (line 10100), the other employment income, the pension, benefit and investment
# lines, the taxable capital gains, the taxable support payments, the RRSP, FHSA, other and
# scholarship income and line 14700 to total income (line 15000), $45,400. With no
# employment income there are no CPP contributions or EI premiums, no Canada employment
# amount, no LIFT credit and no working income, so no Canada workers benefit. Net income is
# below the $177,882 at which the basic personal amount starts to fall, so net income and
# taxable income are $45,400.00, in the lowest federal bracket and the first Ontario
# bracket; the Ontario health premium is $450 (the row for taxable income more than $38,500
# but not more than $48,000); the Ontario tax reduction is zero, as twice its amounts are
# below the Ontario tax with surtax. The filer receives Old Age Security, which starts at
# 65, so is taken as born in 1960 or earlier (to be confirmed): the age amount (T1 line
# 30100) is claimed once and, as net income of $45,400.00 is at or below the $45,522 income
# threshold of the Federal Worksheet, it is the whole maximum, $9,028.00. ON428 line 58080
# (the Ontario age amount) is not computed in this return, so the Ontario figures are
# without it. The spouse or common-law partner amount (line 30300) and the Canada caregiver
# amount for a spouse (line 30425) are $0, as there is no spouse. There is no capital gain,
# unused or new RRSP contribution, union dues, child care expense or dependant. Not yet
# computed, so not in this file: the deduction of line 14700 on line 25000 (Step 4), the
# pension income amount, the amounts transferred and the credits that follow from the
# pension and benefit lines, the social benefits repayment, and any deduction from net
# income. Line 82 of ON428 is not triggered by this return, and the qualifying donations for
# line 87 (the community food program donation tax credit for farmers) are a chosen $0, so
# line 87 is $0 and line 88 is line 86. Amounts are quoted decimal strings, never floats;
# counts are quoted digit strings. Every output the CA-ON manifest declares must appear
# under `expected`; intermediate lines may be listed and are then checked too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single retiree, an Ontario resident for all of 2025, with no spouse or common-law
  partner at any time in 2025 and no dependant, with no employment income (T1 line 10100)
  and the following other 2025 income. OAS pension (line 11300, box 18 of the T4A(OAS) slip)
  of $8,000, CPP or QPP benefits (line 11400, box 20 of the T4A(P) slip) of $9,000, other
  pensions and superannuation (line 11500) of $20,000, RRSP income (line 12900, from all
  T4RSP slips) of $5,000 and workers' compensation benefits (line 14400, box 10 of the T5007
  slip) of $2,000, each a chosen figure; no other employment income (line 10400), elected
  split-pension amount (line 11600), UCCB (line 11700), EI benefits (line 11900), net
  partnership income (line 12200), RDSP income (line 12500), capital gain (so taxable
  capital gains, line 12700, of $0), taxable support payments (line 12800), FHSA income
  (lines 12905 and 12906), other income (line 13000), scholarships (line 13010), social
  assistance payments (line 14500) or net federal supplements (line 14600). Interest and
  other investment income (line 12100) is computed by the Federal Worksheet: line 2 (boxes
  13, 14, 15 and 30 of all T5 slips) is a chosen $1,200 and line 7 (interest earned from
  bank accounts and similar investments not reported on any information slip) a chosen $300,
  the rest of lines 1 to 8 being $0, so line 9 is 1,200 + 300 = 1,500; line 10 (income
  included on line 9 and reported in previous years) is a chosen $100; line 11, the amount
  for line 12100, is 1,500 - 100 = 1,400. Lines 14400, 14500 and 14600 add to line 14700:
  2,000 + 0 + 0 = 2,000. Total income (line 15000) is the sum of the income lines: 0 + 0 +
  8,000 + 9,000 + 20,000 + 0 + 0 + 0 + 1,400 + 0 + 0 + 0 + 0 + 5,000 + 0 + 0 + 0 + 0 + 2,000
  = 45,400. With no employment income there are no CPP contributions (Schedule 8, base 0,
  first and second additional 0, so the enhanced contributions, line 22215, are 0) and no EI
  premiums (line 31200: 0). No unused or new RRSP contributions, so the most that may be
  deducted (Schedule 7 line 17) is $0, the lesser of the contributions available to deduct
  (line 10) of $0 and a chosen deduction limit of $0 (line 11); the amount deducted (line
  18) is $0, so the RRSP deduction (line 20800) is $0 and the unused contributions carried
  forward (line 23) are $0; no union dues (line 21200) and no child care expenses (line
  21400), the T778 limits and earned income all being $0. Total deductions (line 23300) are
  $0 and net income (line 23600) is $45,400.00; the deduction of line 14700 on line 25000 is
  not yet computed, so taxable income (line 26000) here, $45,400.00, is before it. The
  non-refundable credit amounts are the basic personal amount (federal line 30000 $16,129,
  since net income is $177,882 or less; Ontario ON428 line 58040 $12,747) and, on the T1,
  the age amount (line 30100) of $9,028.00: the Federal Worksheet's line 4, the net income
  of $45,400.00 less the line 3 income threshold of $45,522.00, is negative, so $0.00, line
  6, that at the line 5 rate of 15%, is $0.00, and line 1 $9,028.00 less it is line 7, so
  line 30100 is $9,028.00, claimed once for the filer born in 1960 or earlier (the count is
  1, taken from the OAS received, to be confirmed). There is no spouse amount (line 30300:
  $16,129.00 for 0 spouse amounts claimed), no Canada caregiver amount for a spouse (line
  30425: $8,601.00 for 0 spouses eligible, and the spouse's net income entered is $0), no
  eligible dependant (lines 30400 and 58160: 0), no infirm children (line 30500: 0), no base
  CPP contributions or EI premiums and a Canada employment amount (line 31260) of $0, the
  lesser of $1,471 and employment income: line 33500 of $25,157.00 and ON428 line 58800 of
  $12,747.00, which is without the Ontario age amount (line 58080), not computed in this
  return. At 14.5% federally (line 33800) and 5.05% for Ontario (ON428 line 58840), each
  product rounded half-up to the cent is its form's non-refundable tax credits: federal
  $3,647.77 (line 35000) and Ontario $643.72 (ON428 line 61500), each taken off its form's
  basic tax ($6,583.00 federally, $2,292.70 for Ontario), not below zero: $2,935.23 and
  $1,648.98. The Ontario surtax (ON428 line 68) is $0, as the Ontario tax after credits is
  below $5,710, so the Ontario tax with surtax (line 69) is that same $1,648.98. With no
  dependent child and no dependant, the Ontario tax reduction amounts (line 77) are the
  basic reduction of $294.00 (line 74), twice them, $588.00 (line 78), which is less than
  the Ontario tax with surtax (line 79), so the Ontario tax reduction (line 80) is $0 and
  the Ontario tax after the reduction (line 81) is $1,648.98. The LIFT credit (ON428 line
  85, Schedule ON428-A) is 5.05% of employment income, $0, at most $875, less 5% of net
  income over $32,500, $645.00, not below zero: $0, so the Ontario tax after it (line 86) is
  that same $1,648.98. With chosen qualifying donations of $0, the community food program
  donation tax credit for farmers (ON428 line 87) is 25% x $0 = $0 and the Ontario tax after
  it (line 88) is that same $1,648.98. The Ontario health premium (ON428 line 89) is read
  from its chart on taxable income: $45,400.00 is more than $38,500 but not more than
  $48,000, so the premium is $450, and the Ontario tax (ON428 line 90) is the Ontario tax
  after the food credit plus the premium, $1,648.98 + $450 = $2,098.98. On the T1, the net
  federal tax (line 42000) is the federal tax after credits, $2,935.23, and the total
  payable (line 43500) is it plus the Ontario tax (line 42800), $5,034.21. The Canada
  workers benefit (line 45300, Schedule 6) is $0: the working income, the employment income,
  is $0, not more than the $3,000 base, so 27% of it over $3,000 is $0 and so is the benefit
  before the reduction, whether the lesser of that and $1,633 (no eligible dependant) or
  $2,813 applies; less 15% of the adjusted family net income, the net income, over $26,855
  (no eligible dependant) or $30,639 (an eligible dependant), $2,781.75 or $2,214.15, not
  below zero: $0. The income tax deducted (line 43700) is a chosen $3,000, so the total
  credits (line 48200) are it plus the benefit, $3,000, and the refund or balance owing
  (line 167) is the total payable less the total credits, $2,034.21: positive, so a balance
  owing (line 48500). Every amount computed from a rate, fraction, amount or chart on the
  forms is rounded half-up to the cent, each line being a dollars-and-cents box; here that
  changes the federal tax on taxable income, the Ontario tax on taxable income and both
  forms' non-refundable tax credits, and the lines that follow from them. The lines that
  only add, subtract, compare or choose take amounts already in cents, so the refund or
  balance owing is in cents too.

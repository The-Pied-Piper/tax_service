# Return AX: Return U's self-employed filer (net business income, T1 line 13500, of
# $50,000) with one T4 slip for self-employment income with EI premiums in box 18 that
# reports $20,000 of that net business income. Schedule 13 line 1 leaves the slip's net
# income out, so it is 50,000 - 20,000 = 30,000 and the EI premiums on self-employment
# (line 9) are 30,000 x 1.64% = 492.00, not Return U's 820.00. The slip does not change
# Schedule 8 Part 4, which reads line 27 of 50,000. Every other figure is Return U's,
# except the lines that read the premiums: the credit amounts (lines 33500 of the T1 and
# ON428) and so the non-refundable credits, the tax after credits, the total payable and
# the refund or balance owing.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident for all of 2025, with no spouse or common-law partner and no
  dependant, whose only income is self-employment income: net business income (T1 line
  13500, from T2125 line 9946) of $50,000, entered as a T2125 with gross sales (amount 3A)
  of $50,000 and no expenses, so the net self-employment income (line 27) is 50,000 and
  total income (line 15000) is $50,000.00. Part of it, $20,000 (a chosen figure), was
  reported on a T4 slip for self-employment income with EI premiums in box 18 (for example
  a taxi driver not hired as an employee). Schedule 13 line 1 is the total of line 12200
  (0) and line 27 (50,000), 50,000, less the net income reported for that slip, 20,000,
  not below 0: 30,000. Lines 2 and 3 are 0, so line 4 is 30,000; line 5 is 65,700.00; line
  6 is 0, so line 7 is 65,700.00; line 8 is the lesser of 30,000 and 65,700.00, 30,000;
  line 9 is 30,000 x 1.64% = 492.00 (below 1,077.48), lines 31217 and 42120, each entered
  once for the one agreement with the Commission. Schedule 8 Part 4 does not exclude the
  slip (line 1 is 50,000), so the CPP figures are Return U's. The taxable income is
  50,000.00 - 3,231.75 = 46,768.25. The federal basic tax is 46,768.25 x 14.5% = 6,781.40.
  The credit amounts of the T1 (line 33500) are 16,129.00 + 2,301.75 + 492.00 = 18,922.75,
  times 14.5% = 2,743.80, so the federal tax after credits is 4,037.60. ON428's credit
  amounts are 12,747.00 + 2,301.75 + 492.00 = 15,540.75, times 5.05% = 784.81; the Ontario
  basic tax is 46,768.25 x 5.05% = 2,361.80, so the Ontario tax after credits is 1,576.99
  (no reduction, as it is above 588.00). The health premium row "more than $38,500 but not
  more than $48,000" is $450.00, so the Ontario tax is 2,026.99. The total payable is the
  net federal tax 4,037.60 + the Ontario tax 2,026.99 + the CPP contributions payable
  5,533.50 + the EI premiums payable 492.00 = 12,090.09, with no income tax deducted, so
  the balance owing is 12,090.09. The other lines are Return U's. The agreement with the
  Commission and the slip are to be confirmed.
sources:
  - >-
    CRA, "T1-2025 Schedule 13 Employment Insurance Premiums on Self-Employment and Other
    Eligible Earnings" (form 5000-S13, confirmed 2026-10-19): "Line 1: Enter the total amount
    from line 1 1 plus line 27 of your return. If you received a T4 slip for self-employment
    income with EI premiums in box 18, do not include any net income (or net loss) reported on
    lines 13500, 13700, 13900, 14100, and 14300 of your return for that slip (Note 1) (if
    negative, enter "0")."; "Line 4: Add lines 1 to 3. Net self-employment income ="; "Line 5:
    Maximum insurable earnings 65,700.00"; "Line 7: Line 5 minus line 6 (if negative, enter
    "0") ="; "Line 8: Enter whichever is less: amount from line 4 or line 7."; "Residents of a
    province or territory other than Quebec: Line 9: Amount from line 8 multiplied by 1.64%
    (maximum $1,077.48) =". Line 1 is read as line 12200 plus line 27, as in Return U.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s13/5000-s13-25e.txt
  - >-
    The other lines are those of Return U (see 2025_return_u.yaml for the CRA forms and
    quotes each follows); only the EI premiums and the lines that read them differ.

# Return C: a 2025 Ontario resident whose employment income is below the EI maximum
# insurable earnings ($65,700) and the CPP first earnings ceiling ($71,300), so the CPP
# contributions and EI premiums are the rates' arithmetic, not the printed maximums, and
# there is no second additional CPP contribution. Computed from employment income to total
# income; from employment income, by Schedule 8's three contribution tiers, to the base,
# first additional and second additional CPP contributions, the last two together the
# enhanced CPP contributions; from employment income, up to the EI maximum insurable
# earnings, to the EI premiums; from the RRSP contributions and deduction limit, the lesser
# of them, to the RRSP deduction (Schedule 7 line 20); less the enhanced CPP contributions
# to net income, less the (empty) deductions from net income to taxable income, and through
# each form's total of non-refundable credit amounts (its basic personal amount, the base
# CPP contributions and the EI premiums, and on the T1 alone the Canada employment amount),
# credited once at the form's credit rate to the form's non-refundable tax credits (T1 line
# 35000, ON428 line 61500), taken off its basic tax, not below zero, to the tax after
# credits, and on ON428 the surtax on the Ontario tax after credits, added to it to the
# Ontario tax with surtax. There is no capital gain, RRSP contribution or union dues. Not
# yet computed, so not in this file: any deduction from net income, the social benefits
# repayment, capital losses, the Ontario tax reduction and health premium, and the balance
# owing.
# Amounts are quoted decimal strings, never floats. Every output the CA-ON manifest
# declares must appear under `expected`; intermediate lines may be listed and are then
# checked too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident with 2025 employment income (T1 line 10100) of $50,000 and no other
  income: no capital gain, so taxable capital gains (line 12700) of $0 and total income
  (line 15000) of $50,000. The CPP contributions are computed from employment income, which
  Schedule 8 line 1 reads as the pensionable earnings when T4 box 26 is blank. The EI
  premiums are computed from employment income, taken as the insurable earnings. Employment
  income is below the EI maximum insurable earnings ($65,700) and the CPP first earnings
  ceiling ($71,300), so EI premiums (line 31200, ON428 line 58300) are 1.64% x 50,000 =
  $820.00, base CPP contributions (Schedule 8 line 11, T1 line 30800, ON428 line 58240) are
  4.95% x (50,000 - 3,500) = $2,301.75, and enhanced CPP contributions (line 22215) are the
  first additional (Schedule 8 line 12) 1% x 46,500 = $465.00 with no second additional
  contribution (line 22, $0). No RRSP contributions, so the RRSP deduction (line 20800) is
  $0, the lesser of the contributions of $0 (Schedule 7 line 4) and a chosen deduction limit
  of $9,000 (Schedule 7 line 11); no union dues (line 21200), so total deductions (line
  23300) are the enhanced CPP contributions of $465.00 and net income (line 23600) is
  $49,535.00. There are no deductions from net income (lines 24400 to 25600), so their total
  (line 25700) is $0 and taxable income (line 26000), derived as net income less that total,
  is $49,535.00, inside the lowest federal and Ontario brackets. The non-refundable credit
  amounts are the basic personal amount (federal line 30000 $16,129, since net income is
  $177,882 or less; Ontario ON428 line 58040 $12,747), the base CPP contributions and the EI
  premiums, and on the T1 alone the Canada employment amount (line 31260) of $1,471, the
  lesser of $1,471 and employment income (ON428 has no such line): line 33500 of $20,721.75
  and ON428 line 58800 of $15,868.75. The rate is applied once to each total: 14.5%
  federally (line 33800) and 5.05% for Ontario (ON428 line 58840). Each product is its
  form's non-refundable tax credits: the total federal non-refundable tax credits (line
  35000) of $3,004.65375 and the Ontario non-refundable tax credits (ON428 line 61500) of
  $801.371875, each taken off its form's basic tax, not below zero. The Ontario surtax
  (ON428 line 68) is 20% of the Ontario tax after credits over $5,710 plus 36% of it over
  $7,307: $0, as the Ontario tax after credits is below $5,710, so the Ontario tax with
  surtax (ON428 line 69) is that same $1,700.145625. The CPP contributions and EI premiums
  are rounded to the cent, which changes none of them; no other amounts are rounded.

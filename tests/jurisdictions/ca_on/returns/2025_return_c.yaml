  - >-
    The other lines are the 2025 federal and Ontario brackets and those credits applied
    without rounding. The federal brackets are those of the 2025 T1 return for Ontario (form
    5006-R), Step 5 Part A lines 70 to 76, as CRA publishes them; the lowest rate of 14.5%
    is the full-year blend of the cut from 15% to 14% on July 1, 2025, per Finance Canada's
    announcement: 14.5% from 0 to 57,375, so taxable income of 49,535.00, inside the lowest
    bracket, gives federal basic tax of 49,535.00 x 14.5% = 7,182.575, less the 3,004.65375
    of federal non-refundable tax credits (line 35000), not below zero, is 4,177.92125. The
    Ontario brackets are those of the 2025 ON428 (form 5006-C), Part A lines 2 to 8, as CRA
    and the Ontario Data Catalogue publish them: 5.05% from 0 to 52,886, so 49,535.00,
    inside the lowest bracket, gives Ontario basic tax of 49,535.00 x 5.05% = 2,501.5175,
    less the 801.371875 of Ontario non-refundable tax credits (ON428 line 61500), not below
    zero, is 1,700.145625.

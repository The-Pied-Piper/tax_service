# Return C: a 2025 Ontario resident whose employment income is below the EI maximum
# insurable earnings ($65,700) and the CPP first earnings ceiling ($71,300), so the CPP
# contributions and EI premiums are the rates' arithmetic, not the printed maximums, and
# there is no second additional CPP contribution. Computed from employment income to total
# income; from employment income, by Schedule 8's three contribution tiers, to the base,
# first additional and second additional CPP contributions, the last two together the
# enhanced CPP contributions; from employment income, up to the EI maximum insurable
# earnings, to the EI premiums; from the unused RRSP contributions from earlier years and
# the RRSP contributions, their sum, to the contributions available to deduct (Schedule 7
# line 10), from those and the deduction limit, the lesser of them, to the most that may be
# deducted (Schedule 7 line 17), from the amount deducted (line 18), at most that, to the
# RRSP deduction (line 20), and from the contributions available to deduct less the RRSP
# deduction to the unused contributions carried forward (line 23); less the enhanced CPP
# contributions to net income, less the (empty) deductions from net income to taxable
# income; from net income, by the Federal Worksheet, to the federal basic personal amount;
# and through each form's total of non-refundable credit amounts (its basic personal amount,
# the base CPP contributions and the EI premiums, and on the T1 alone the Canada employment
# amount), credited once at the form's credit rate to the form's non-refundable tax credits
# (T1 line 35000, ON428 line 61500), taken off its basic tax, not below zero, to the tax
# after credits, and on ON428 the surtax on the Ontario tax after credits, added to it to
# the Ontario tax with surtax; and, with no dependent children or dependants, the Ontario
# tax reduction amounts (the basic reduction alone), twice them less the Ontario tax with
# surtax, not below zero, to the Ontario tax reduction, taken off the Ontario tax with
# surtax, not below zero, to the Ontario tax after the reduction; from employment income, by
# Schedule ON428-A, 5.05% of it at most $875, less 5% of net income over $32,500, not below
# zero, to the LIFT credit (ON428 line 85), taken off the Ontario tax after the reduction,
# not below zero, to the Ontario tax after the LIFT credit (line 86); and from taxable
# income, by the health premium chart's tiers, each capped at the next plateau, to the
# Ontario health premium, added to the Ontario tax after the LIFT credit to the Ontario tax;
# from employment income, by Schedule 6, 27% of the working income over $3,000 at most
# $1,633, less 15% of the adjusted family net income, here net income, over $26,855, not
# below zero, to the Canada workers benefit (T1 line 45300); and on the T1, the federal tax
# after credits, carried to the net federal tax, plus the Ontario tax to the total payable,
# less the total credits, here the chosen income tax deducted plus the Canada workers
# benefit, to the refund or balance owing, negative for a refund and positive for a balance
# owing. There is no capital gain, unused or new RRSP contribution or union dues. Not yet
# computed, so not in this file: any deduction from net income, the social benefits
# repayment and capital losses. Lines 82 (the provincial foreign tax credit) and 87 (the
# community food program donation tax credit for farmers) are not triggered by this return,
# nor are Schedule 6's disability supplement (Step 3) and advance payments (Step 4); the
# Schedule 6 amounts for a filer with no eligible spouse and no eligible dependant apply (to
# be confirmed).
# Amounts are quoted decimal strings, never floats; counts are quoted digit strings. Every
# output the CA-ON manifest declares must appear under `expected`; intermediate lines may be
# listed and are then checked too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident with 2025 employment income (T1 line 10100) of $50,000 and no other
  income: no capital gain, so taxable capital gains (line 12700) of $0 and total income
  (line 15000) of $50,000. The CPP contributions are computed from employment income, which
  Schedule 8 line 1 reads as the pensionable earnings when T4 box 26 is blank. The EI
  premiums are computed from employment income, taken as the insurable earnings. Employment
  income is below the EI maximum insurable earnings ($65,700) and the CPP first earnings
  ceiling ($71,300), so EI premiums (line 31200, ON428 line 58300) are 1.64% x 50,000 =
  $820.00, base CPP contributions (Schedule 8 line 11, T1 line 30800, ON428 line 58240) are
  4.95% x (50,000 - 3,500) = $2,301.75, and enhanced CPP contributions (line 22215) are the
  first additional (Schedule 8 line 12) 1% x 46,500 = $465.00 with no second additional
  contribution (line 22, $0). No unused or new RRSP contributions, so the most that may be
  deducted (Schedule 7 line 17) is $0, the lesser of the contributions available to deduct
  (Schedule 7 line 10) of $0 (the unused contributions from earlier years of $0, Schedule 7
  line 1, plus the contributions of $0, Schedule 7 line 4) and a chosen deduction limit of
  $9,000 (Schedule 7 line 11); the amount deducted (line 18) is that $0, so the RRSP
  deduction (line 20800) is $0 and the unused contributions carried forward (line 23) are
  $0; no union dues (line 21200), so total deductions (line 23300) are the enhanced CPP
  contributions of $465.00 and net income (line 23600) is $49,535.00. There are no
  deductions from net income (lines 24400 to 25600), so their total (line 25700) is $0 and
  taxable income (line 26000), derived as net income less that total, is $49,535.00, inside
  the lowest federal and Ontario brackets. The non-refundable credit amounts are the basic
  personal amount (federal line 30000 $16,129, since net income is $177,882 or less; Ontario
  ON428 line 58040 $12,747), the base CPP contributions and the EI premiums, and on the T1
  alone the Canada employment amount (line 31260) of $1,471, the lesser of $1,471 and
  employment income (ON428 has no such line): line 33500 of $20,721.75 and ON428 line 58800
  of $15,868.75. The rate is applied once to each total: 14.5% federally (line 33800) and
  5.05% for Ontario (ON428 line 58840). Each product is its form's non-refundable tax
  credits: the total federal non-refundable tax credits (line 35000) of $3,004.65375 and the
  Ontario non-refundable tax credits (ON428 line 61500) of $801.371875, each taken off its
  form's basic tax, not below zero. The Ontario surtax (ON428 line 68) is 20% of the Ontario
  tax after credits over $5,710 plus 36% of it over $7,307: $0, as the Ontario tax after
  credits is below $5,710, so the Ontario tax with surtax (ON428 line 69) is that same
  $1,700.145625. With no dependent children and no dependants (ON428 lines 75 and 76), the
  Ontario tax reduction amounts (line 77) are the basic reduction of $294.00 (line 74);
  twice them, $588.00 (line 78), less the Ontario tax with surtax (line 79, from line 73) is
  negative, so the Ontario tax reduction (line 80) is $0 and the Ontario tax after the
  reduction (line 81) is that same $1,700.145625. The LIFT credit (ON428 line 85, Schedule
  ON428-A) is 5.05% of employment income, $2,525, at most $875, less 5% of net income over
  $32,500, $851.75: $23.25, and the Ontario tax after it (ON428 line 86) is $1,700.145625 -
  $23.25 = $1,676.895625. The Ontario health premium (ON428 line 89) is read from its chart
  on taxable income: $49,535.00 is more than $48,600 but not more than $72,000, so the
  premium is $600, and the Ontario tax (ON428 line 90) is the Ontario tax after the LIFT
  credit plus the premium, $2,276.895625. On the T1, the net federal tax (line 42000) is the
  federal tax after credits, $4,177.92125, and the total payable (line 43500) is it plus the
  Ontario tax (line 42800), $6,454.816875. The Canada workers benefit (line 45300, Schedule
  6) is 27% of the working income, the employment income, over $3,000, $12,690, at most
  $1,633, less 15% of the adjusted family net income, the net income, over $26,855,
  $3,402.00; the reduction is more than the $1,633, so the benefit is $0. The income tax
  deducted (line 43700) is a chosen $5,000, so the total credits (line 48200) are it plus
  the benefit, $5,000, and the refund or balance owing (line 167) is the total payable less
  the total credits, $1,454.816875: positive, so a balance owing (line 48500). The CPP
  contributions, the EI premiums and the federal basic personal amount are rounded to the
  cent, which changes none of them; no other amounts are rounded.

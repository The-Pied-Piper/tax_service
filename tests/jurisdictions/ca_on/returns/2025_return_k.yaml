    CRA, the 2025 Schedule 6 (form 5000-S6): line 5 "Add lines 1 to 4. Enter the result,
    even if it is "0". Working income"; line 15 "Line 13 minus line 14 Enter this amount on
    line 23 and line 35. Adjusted family net income"; line 17 "Base amount 3,000.00"; line
    19 "Rate 27%"; line 21 "If you had an eligible spouse or an eligible dependant, enter
    $2,813. If not, enter $1,633."; line 24 "If you had an eligible spouse or an eligible
    dependant, enter $30,639. If not, enter $26,855."; line 26 "Rate 15%"; line 28 "Line 22
    minus line 27 (if negative, enter "0") If you are not completing Step 3, enter this
    amount on line 45300 of your return." The working income is 50,000, so line 18 is 47,000
    and line 20 is 47,000 x 27% = 12,690.00, line 22 the lesser of that and 1,633: 1,633
    (2,813 with an eligible dependant: 2,813.00); line 25 is 51,990.00 - 26,855 = 25,135.00
    and line 27 is 25,135.00 x 15% = 3,770.25 (or 21,351.00 x 15% = 3,202.65); line 28 is
    1,633 - 3,770.25, negative, so 0, the Canada workers benefit (T1 line 45300), the same
    with an eligible dependant, which the taxpayer has none: the number of Schedule 6
    eligible dependants (line 38100) is 0, choosing the first. Not triggered by this return:
    Step 3, Step 4 and an eligible spouse.

  - >-
    CRA, the 2025 T1 return (form 5000-R), Step 6: line 142 (line 42000) "Add lines 139 to
    141. Net federal tax"; line 143 "Amount from line 42000"; line 147 (line 42800)
    "Provincial or territorial tax (complete and attach your provincial or territorial Form
    428, even if the result is "0")"; line 148 (line 43500) "Add lines 143 to 147. Total
    payable"; line 150 (line 43700) "Total income tax deducted (amounts from all Canadian
    slips)"; line 155 (line 45300) "Canada workers benefit (CWB) (complete Schedule 6)";
    line 166 (line 48200) "Add lines 150 to 165. Total credits"; line 167 "Line 149 minus
    line 166 If the amount is negative, enter it on line 48400 below. If the amount is
    positive, enter it on line 48500 below. Refund or balance owing". Line 126, 4,214.71, is
    carried to line 142, the net federal tax. Line 148 is 4,214.71 + 2,424.13 = 6,638.84.
    Line 150 is 9,000, a chosen figure: the tax withheld on the taxpayer's slips, which
    nothing on this return determines. Line 155 is the benefit of Schedule 6 line 28, 0, so
    line 166 is 9,000 + 0 = 9,000. Line 167 is 6,638.84 - 9,000 = -2,361.16, negative, so
    line 48400 "Refund". These lines add and subtract amounts already in cents, so each is
    in cents too.

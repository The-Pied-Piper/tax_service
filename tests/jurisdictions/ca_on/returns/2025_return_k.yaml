    return."; "Line 17: Line 13 plus line 16. Include this amount on line 12000 of your
    return.". Lines 3, 8 and the no-slip lines 11 and 14 are chosen figures, 200, 500, 1,000
    and 500: the amounts on the taxpayer's slips and the dividends received, which nothing
    on this return determines; lines 1, 2, 4, 6, 7 and 9 are 0. Line 5 is 0 + 0 + 200 + 0 =
    200; line 10 is 0 + 0 + 500 + 0 = 500; line 13 is 1,000 x 138% = 1,380.00; line 16 is
    500 x 115% = 575.00; line 17 is 1,380.00 + 575.00 = 1,955.00. Line 12010 of the return
    is line 5 plus line 16 (the "Include this amount" of line 16), 200 + 575.00 = 775.00,
    and line 12000 is line 10 plus line 17, 500 + 1,955.00 = 2,455.00. The rates are
    datasets as printed, 138% and 115% (fractions, as they are above one); each product is a
    dollars-and-cents box, rounded half-up to the cent, which changes none of these.

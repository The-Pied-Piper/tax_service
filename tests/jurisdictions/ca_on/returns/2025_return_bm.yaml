  ca/itc_agricultural_sred_credit: "1500.00"
  ca/itc_qualified_property_credit: "1000.00"
  ca/itc_refundable_credits: "10500.00"
  ca/itc_mineral_exploration_credit: "3000.00"
  ca/itc_critical_mineral_credit: "1500.00"
  ca/itc_apprenticeship_wages_total: "35000.00"
  ca/itc_apprenticeship_wages_with_t3: "40000.00"
  ca/itc_apprenticeship_credit: "4000.00"
  ca/itc_sred_repayment_credit_2014_and_prior: "200.00"
  ca/itc_sred_repayment_credit_2015_and_after: "300.00"
  ca/itc_sred_repayment_credit: "500.00"
  ca/itc_nonrefundable_credits: "9000.00"
  ca/amt_carryover_available_for_2026: "2338.71"
  ca/cpp_second_additional_earnings_maximum: "9900.00"
  ca/rc381_part_2_line_g: "71300.00"
  ca/rc381_part_2_line_h: "9900.00"
  ca/rc381_part_2_line_i: "81200.00"
  ca/rc381_part_2_line_j: "3500.00"

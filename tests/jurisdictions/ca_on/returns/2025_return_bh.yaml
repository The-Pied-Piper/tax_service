# Return BH: a 2025 Ontario resident with a 2021 QSBCS reserve, a 2024 Period 1 reserve and a 2024
# Period 2 reserve reported in 2025, and the 2025 QSBCS disposition of Return BF (a gain of $350,000,
# Schedule 3 line 10700).
# Form T657 Chart 2021 takes a 40,000.00 reserve (Form T2017 line 12) to amount N of 20,000.00; Charts
# 2022 and 2023 carry that total of 20,000.00 forward; Chart 2024 Period 1 and Period 2 and Chart 2025
# Part 1 and Part 2 take each total as amount B. Chart 2 line 18 (earlier years' deductions) is
# 100,000.00, so line 19 (amount D in every chart) is 100,000.00. Line 25400 stays at the $155,000.00
# annual gains limit. Every other T657 line is blank, as in Return BF.
# The worked derivation is in the description.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or older
  at the end of 2025, with other income (T1 line 13000) of $10,000, a chosen figure, one
  disposition of qualified small business corporation shares (QSBCS) in 2025 after June 24, 2024,
  proceeds $500,000, a chosen figure, adjusted cost base $150,000, a chosen figure, and outlays
  nil, so the gain is 350,000.00 (Schedule 3 line 10700, column 5, "gain or loss" = column 2 minus
  columns 3 and 4). Three reserves are reported on Form T2017: line 12 (QSBCS) of 40,000.00 for a
  disposition in 2021 (a chosen figure, entered on Chart 2021 as amount G), line 12 (QSBCS) of
  40,000.00 for a disposition in Period 1 of 2024 (a chosen figure, entered on Chart 2024 Period 1 as
  amount G), and line 6 (QFFP) of 30,000.00 for a disposition in Period 2 of 2024 (a chosen figure,
  entered on Chart 2024 Period 2 as amount F). Chart 2 line 18 (deductions of earlier years) is
  100,000.00 (a chosen figure), so line 19 is 100,000.00. The derivation of Return BF's lines is
  unchanged and is repeated here: Schedule 3 line 19700 is 350,000.00 and line 21 is 350,000.00, so
  line 24 is 175,000.00 (the inclusion rate on line 23 is 50%) and line 26 (line 19900) is
  175,000.00, the taxable capital gains on line 12700 (no partnership gains at full inclusion, no T3
  slip). Net capital losses of other years: 20,000 are available (line 6 of Form T1436, a chosen
  figure) and 20,000 are claimed (a chosen figure), so line 25300 is 20,000.00. Net income (line
  23600) is 175,000.00 + 10,000.00 = 185,000.00. Form T657 Step 1: line 1 is 350,000.00; line 3 is
  350,000.00; line 4 is 1/2, so line 5 is 175,000.00; line 6 (Form T2048 line 17216) is 0; line 7 is
  175,000.00; line 8 is 175,000.00; line 9 is 0; line 10 is 175,000.00; line 11 is 0; line 12 is
  175,000.00; line 13 is 175,000.00. Step 1 line 14 is 20,000.00 (line 25300); line 16 is 20,000.00;
  line 17 is 0; line 18 is 0; line 19 is 0; line 20 is 20,000.00; line 21 is 175,000.00 -
  20,000.00 = 155,000.00, the annual gains limit for 2025. Step 2: line 8 is 100,000 (a chosen
  figure) + 175,000.00 = 275,000.00; line 9 is 275,000.00; line 15 is 20,000.00; line 18 is
  20,000.00; line 19 is 275,000.00 - 20,000.00 = 255,000.00, the cumulative gains limit for 2025.
  Chart 2021: amount A is 446,109.00 (no 2016 to 2020 charts, so B is 0); D is Chart 2 line 19,
  100,000.00, so E is 346,109.00. F and G add to 40,000.00 (G is the 2021 reserve); the half is
  20,000.00, so J is 20,000.00 and K is 20,000.00. Amount M is K plus B, 20,000.00, and N is the
  lesser of 155,000.00, 255,000.00 and M: 20,000.00. Part 2 (A 500,000.00, B is Part 1's M) has C
  480,000.00 and E 380,000.00; no QFFP reserve and no additional deduction, so Part 2 does not
  apply and the total carried is Part 1's M, 20,000.00.
  Charts 2022 and 2023 take the 20,000.00 total: Chart 2022 has A 456,815.00, C 436,815.00 and E
  336,815.00, nothing reported, so M is 20,000.00 and the total carried is 20,000.00. Chart 2023 has
  A 485,595.00, C 465,595.00 and E 365,595.00; M is 20,000.00 and the total carried is 20,000.00.
  Chart 2024 Period 1: amount A is 508,418.00 (the maximum for Period 1); B is Chart 2023's total,
  20,000.00, so C is 488,418.00 and E is 488,418.00 less D (100,000.00) = 388,418.00. F and G
  (40,000.00, the 2024 reserve) and H add to 40,000.00 and I is 40,000.00 x 1/2 = 20,000.00. J (the
  portion of Form T2048 line 17216 for a Period 1 reserve) is 0, so K is 20,000.00. L is the lesser of
  E (388,418.00) and K (20,000.00): 20,000.00. Amount M is B, 20,000.00, so N is 20,000.00 +
  20,000.00 = 40,000.00. O is the lesser of 155,000.00, 255,000.00 and N (40,000.00): 40,000.00.
  Chart 2024 Period 2: amount A is 625,000.00; B is Period 1's N, 40,000.00, so C is 585,000.00 and E
  is 585,000.00 less D (100,000.00) = 485,000.00. F is 30,000.00 (a chosen figure), G and H are 0; F
  to H add to 30,000.00 and I is 15,000.00. J is 0, so K is 15,000.00. L is the lesser of E
  (485,000.00) and K (15,000.00): 15,000.00. M is B, 40,000.00, so N is 15,000.00 + 40,000.00 =
  55,000.00. O is the lesser of 155,000.00, 255,000.00 and N (55,000.00): 55,000.00.
  Chart 2025 Part 1 (Period 1 of 2024): amount A is 522,145.00; B is Period 2's N, 55,000.00, so C is
  467,145.00 and E is 467,145.00 less D (100,000.00) = 367,145.00. Amounts F to J are 0 (no slip
  amounts and no T2017 reserve reported on a T5013 slip, as the Period 1 reserve is on Chart 2024),
  so K is 0 and M is 0 (L is 0), N is the lesser of E and M, 0. O is B, 55,000.00, so P is 0 +
  55,000.00 = 55,000.00. Q is the lesser of 155,000.00, 255,000.00 and P (55,000.00): 55,000.00,
  which nothing reads.
  Chart 2025 Part 2: amount A is 625,000.00; B is Part 1's P, 55,000.00, so C is 570,000.00 and E is
  570,000.00 less D (100,000.00) = 470,000.00. F is line 10700 less the excluded slip amounts (none):
  350,000.00; G, H, I and J are 0 (no Form T2017 amount is entered on Part 2 for the 2024 reserves,
  which are charted on Chart 2024). F to J add to 350,000.00 and K is 175,000.00. L is 0, so M is
  175,000.00. N is the lesser of E (470,000.00) and M (175,000.00): 175,000.00. O is B, 55,000.00, so
  P is 175,000.00 + 55,000.00 = 230,000.00. Q is the lesser of 155,000.00, 255,000.00 and P
  (230,000.00): 155,000.00, the maximum for line 25400.
  The filer claims all of it, 155,000, a chosen figure, so line 25400 is 155,000.00 and line 25700
  is 20,000.00 (line 25300) + 155,000.00 (line 25400) = 175,000.00. Line 26000 is 185,000.00 -
  175,000.00 = 10,000.00, the taxable income. The other lines are blank and are the engine's
  figures (to be confirmed against CRA's calculator).
sources:
  - >-
    CRA, Form T657, Calculation of Capital Gains Deduction, 2025 edition (confirmed 2026-10-19
    from the PDF; no .txt is published), Chart 2021, Chart 2022, Chart 2023, Chart 2024 Period 1 and
    Period 2, amounts A to O: "Maximum capital gains deduction for QFFP and/or QSBCS disposed of in
    2021 446,109.00 A" (Chart 2021 Part 1), "Maximum capital gains deduction for QFFP and/or QSBCS
    disposed of in 2024 for Period 1 508,418.00 A" and "Maximum capital gains deduction for QFFP
    and/or QSBCS disposed of in 2024 for Period 2 625,000.00 A"; B "Enter the last amount that you
    calculated for "Total amount of capital gains included in 2025 income eligible for capital gains
    deduction" from 2016 to 2023" (Period 1) and "from 2016 to 2024" (Period 2); F "Amount from line 6
    of Form T2017 (do not include reserves from dispositions of QFFP in any year or period other than
    Period 2 of 2024)"; G "Amount from line 12 of Form T2017 (do not include reserves from
    dispositions of QSBCS in any year or period other than Period 1 of 2024)"; "Add amounts F to H
    (if negative, enter "0") = × 1/2 = I"; "Enter whichever is less: amount E or amount K."; "Amount L
    plus amount M"; "Enter whichever is less: line 21 of Step 1, line 19 of Step 2 or amount N above."
  - >-
    CRA, Form T657, Step 1 lines 1 to 21 and Step 2 lines 8, 9, 15, 18 and 19, as in Return BF
    (line 1 "Total of lines 10700, 11000, and 12400 of Schedule 3 (if negative, show in brackets)";
    line 4 "Inclusion rate × 1/2"; line 21 "Line 13 minus line 20 (if negative, enter "0")
    Annual gains limit for 2025").
  - >-
    CRA, Form T657, Chart 2025 Part 1 and Part 2, amounts A to Q: "Maximum capital gains deduction
    for QFFP and/or QSBCS reported in 2025 but disposed of in Period 1 of 2024 522,145.00 A" and
    "Maximum capital gains deduction for QFFP and/or QSBCS disposed of in 2025 or disposed of after
    June 24, 2024 and reported in 2025 625,000.00 A"; Part 1 B and Part 2 B "Enter the last amount
    that you calculated for "Total amount of capital gains included in 2025 income eligible for the
    capital gains deduction" from 2016 to 2024" and "from 2016 to 2025" (Part 2's B is Part 1's P).
  - >-
    CRA, T1 General 2025, Ontario edition (form 5006-r), "Step 4 - Taxable income" (confirmed
    2026-10-19): "Line 65 and line 25400: Capital gains deduction (complete Form T657)"; "Line 68
    and line 25700: Add lines 58 to 67."; "Line 69 and line 26000: Line 57 minus line 68 (if
    negative, enter "0") Taxable income".

# Return BN: a single 2025 Ontario resident, over 19, with employment income of $60,000 whose
# T4 slips show more CPP contributions than the required ones, so Schedule 8 Part 3 line 24
# is positive. The T4 box 16 total (Schedule 8 line 8) is a chosen $3,500.00, $138.25 more
# than the required base and first additional contributions (line 13, $3,361.75). The line
# 24 difference is the Part 3 chain of lines 8 to 24, computed here from the two T4 inputs;
# lines 25 to 88 (Parts 3a, 3b and 5, where a positive line 24 is routed to lines 30800,
# 22215 and 44800) are not in this file. Return BN is the case
# of a positive line 24; the negative and zero cases are in its end to end test.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, over 19, with no spouse or common-law partner
  and no dependants, with 2025 employment income (T1 line 10100) of $60,000 and no other
  income. Its CPP contributions are the ones Schedule 8 computes from employment income: the
  required base contributions (Part 3 line 11) are 4.95% x (60,000 - 3,500) = $2,796.75, and
  the required first additional contributions (line 12) are 1% x 56,500 = $565.00, so line 13,
  the required base and first additional contributions, is $3,361.75. The second additional
  contribution is required on earnings above $71,300 only, so line 22 is $0. Part 3 line 8
  (T4 box 16, the base and first additional contributions the T4 slips show) is a chosen
  $3,500.00, and line 21 (T4 box 16A, the second additional contributions) is a chosen $0.
  Line 9 is 83.1933% of line 8, $3,500.00 x 0.831933 = 2,911.7655, rounded half-up to the cent,
  $2,911.77, and line 10 is $3,500.00 - $2,911.77 = $588.23. Line 16 is line 9 less line 11,
  $2,911.77 - $2,796.75 = $115.02; line 19 is line 10 less line 12, $588.23 - $565.00 = $23.23;
  line 20 is $115.02 + $23.23 = $138.25. Line 23 is line 21 less line 22, $0 - $0 = $0.00, and
  line 24 is line 20 plus line 23, $138.25 + $0.00 = $138.25, positive, so Part 3a applies
  (not computed in this file). The T4 inputs are the only chosen figures: the required amounts
  are the rates' arithmetic, not the printed maximums ($3,356.10 and $678.00 are not reached),
  and there is no second additional contribution to bring in. Not wired: the
  Schedule 8 Parts 3a, 3b and 5 lines 25 to 88. The last seven expected lines (net income, the
  AMT subtotal and rate amount, the Ontario tax after the dividend credit and the balance
  owing) are the worksheet's figures for this income; the CPP lines shown below are the ones
  Schedule 8 feeds to the return (T1 line 30800 base, line 22215 enhanced, and the first and
  second additional contributions), and the enhanced CPP contributions, $565.00 (line 22215),
  are the first additional $565.00 plus the second additional $0.00.
sources:
  - >-
    CRA, T1-2025 Schedule 8 (form 5000-S8), Part 3, "Contributions and overpayment on employment
    income" (docs/cra-forms-2025/5000-s8-25e.txt): "Line 8 and line 50340: Total actual base and
    first additional contributions on CPP pensionable earnings from box 16 of all of your T4
    slips"; "Line 9: amount from line 8 multiplied by 83.1933% ="; "Line 10: Line 8 minus line
    9 ="; "Line 11: amount from line 7 multiplied by 4.95% (maximum $3,356.10) ="; "Line 12:
    amount from line 7 multiplied by 1% (maximum $678.00) ="; "Line 13: Line 11 plus line 12 =";
    "Line 16: Line 14 minus line 15 (if negative, show in brackets) ="; "Line 19: Line 17 minus
    line 18 (if negative, show in brackets) ="; "Line 20: Line 16 plus line 19 (if negative, show
    in brackets) ="; "Line 21 and line 50341: Total actual second additional contributions on CPP
    pensionable earnings from box 16A of all of your T4 slips"; "Line 23: Line 21 minus line 22
    (if negative, show in brackets) ="; "Line 24: Line 20 plus line 23 (if negative, show in
    brackets) =". Line 7 is the earnings subject to base and first additional contributions:
    $60,000 less the $3,500 exemption, $56,500, under the $67,800 maximum.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
  - >-
    CRA, "CPP contribution rates, maximums and exemptions", 2025 row: maximum pensionable
    earnings $71,300; basic exemption $3,500; employee rates 4.95% (base) and 1% (first
    additional), and the second additional rate of 4% on earnings between $71,300 and $81,200.
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/canada-pension-plan-cpp/cpp-contribution-rates-maximums-exemptions.html
inputs:
  ca/employment_income: "60000"
  ca/cpp_months: "12"
  ca/cpp_t4_base_and_first_additional_contributions: "3500.00"
  ca/cpp_t4_second_additional_contributions: "0"
expected:
  ca/cpp_base_contributions: "2796.75"
  ca/cpp_first_additional_contributions: "565.00"
  ca/cpp_second_additional_contributions: "0.00"
  ca/cpp_enhanced_contributions: "565.00"
  ca/cpp_actual_base_contributions: "2911.77"
  ca/cpp_actual_first_additional_contributions: "588.23"
  ca/cpp_required_base_and_first_additional_contributions: "3361.75"
  ca/cpp_base_contributions_difference: "115.02"
  ca/cpp_first_additional_contributions_difference: "23.23"
  ca/cpp_base_and_first_additional_contributions_difference: "138.25"
  ca/cpp_second_additional_contributions_difference: "0.00"
  ca/cpp_contributions_difference: "138.25"
  ca/net_income_before_adjustments: "59435.00"
  ca/other_payments_limit_income: "59435.00"
  ca/amt_part_1_subtotal: "59435.00"
  ca/amt_applicable_rate_amount: "282.50"
  ca/cpp_second_additional_earnings_maximum: "9900.00"
  ca-on/ontario_tax_less_dividend_credit: "2435.32"
  ca/refund_or_balance_owing: "8676.79"

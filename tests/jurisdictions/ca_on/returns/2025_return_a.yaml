# Return A: a 2025 Ontario resident, computed from employment income and a capital gain
# to total income, and from taxable income through the tax after the basic personal
# amount credits. Not yet computed, so not in this file: the deductions between total
# income and taxable income (taxable income is still an input), capital losses, the other
# non-refundable credits, the Ontario surtax, tax reduction and health premium, and the
# balance owing. Amounts are quoted decimal strings, never floats. Every output the CA-ON
# manifest declares must appear under `expected`; intermediate lines may be listed and are
# then checked too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident with 2025 employment income (T1 line 10100) of $110,000 and one
  capital gain of $20,000 (Schedule 3 line 21), of which 50% is taxable: taxable capital
  gains (line 12700) of $10,000 and total income (line 15000) of $120,000. Taxable income
  (T1 line 26000) is given as $115,000, because the deductions between total income and
  taxable income are not computed yet; there are no non-refundable credits other than the
  federal and Ontario basic personal amounts. The taxable income is that of Maria in CRA's
  worked example; no amounts are rounded.
sources:
  - >-
    CRA, "T1-2025 Schedule 3 Capital Gains or Losses" (form 5000-S3): line 23 "Inclusion
    rate 50%"; line 24 "Line 22 multiplied by the percentage from line 23"; line 26
    (line 19900) "If positive, enter the result on line 12700 of your return". The capital
    gain of 20,000 times 50% is 10,000 of taxable capital gains, with no rounding stated.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.pdf
  - >-
    Total income (line 15000) is employment income (line 10100) plus taxable capital gains
    (line 12700), the only income lines on this return: 110,000 + 10,000 = 120,000.
  - >-
    CRA, "Completing a basic tax return", the worked example for Maria: federal tax on
    taxable income of $115,000, shown per bracket rounded to the dollar as
    8,319 + 11,762 + 65 = 20,146. The file's 20,146.25 is the same arithmetic unrounded
    (8,319.375 + 11,761.875 + 65), because no rounding rule is configured for this line.
  - >-
    The other lines are the 2025 federal and Ontario brackets and basic personal amounts
    applied without rounding: federal 20,146.25 less 14.5% of the $16,129 basic personal
    amount (2,338.705) is 17,807.545; the Ontario brackets on $115,000 give 8,539.5965
    (the printed ON428 Part A constants, rounded to the cent, would give 8,539.60), less
    5.05% of the $12,747 basic personal amount (643.7235) is 7,895.873.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-r/5000-r-25e.pdf
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.pdf
inputs:
  ca/employment_income: "110000"
  ca/capital_gain: "20000"
  ca/taxable_income: "115000"
expected:
  ca/taxable_capital_gains: "10000"
  ca/total_income: "120000"
  ca/federal_basic_tax: "20146.25"
  ca/federal_tax_after_credits: "17807.545"
  ca-on/ontario_basic_tax: "8539.5965"
  ca-on/ontario_tax_after_credits: "7895.873"

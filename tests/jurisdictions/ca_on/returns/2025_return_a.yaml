# Return A: a 2025 Ontario resident, computed from employment income and a capital gain to
# total income; from employment income, by Schedule 8's three contribution tiers, to the
# base, first additional and second additional CPP contributions, the last two together the
# enhanced CPP contributions; from employment income, up to the EI maximum insurable
# earnings, to the EI premiums; from the unused RRSP contributions from earlier years and
# the RRSP contributions, their sum, to the contributions available to deduct (Schedule 7
# line 10), and from those and the deduction limit, the lesser of them, to the RRSP
# deduction (Schedule 7 line 20); less that RRSP deduction, union dues and the enhanced CPP
# contributions to net income, less the (empty) deductions from net income to taxable
# income; from net income, by the Federal Worksheet, to the federal basic personal amount;
# and through each form's total of non-refundable credit amounts (its basic personal amount,
# the base CPP contributions and the EI premiums, and on the T1 alone the Canada employment
# amount), credited once at the form's credit rate to the form's non-refundable tax credits
# (T1 line 35000, ON428 line 61500), taken off its basic tax, not below zero, to the tax
# after credits, and on ON428 the surtax on the Ontario tax after credits, added to it to
# the Ontario tax with surtax. Not yet computed, so not in this file: any deduction from net
# income, the social benefits repayment, capital losses, the Ontario tax reduction and
# health premium, and the balance owing.
# Amounts are quoted decimal strings, never floats. Every output the CA-ON manifest
# declares must appear under `expected`; intermediate lines may be listed and are then
# checked too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident with 2025 employment income (T1 line 10100) of $110,000 and one
  capital gain of $20,000 (Schedule 3 line 21), of which 50% is taxable: taxable capital
  gains (line 12700) of $10,000 and total income (line 15000) of $120,000. The CPP
  contributions are computed from employment income, which Schedule 8 line 1 reads as the
  pensionable earnings when T4 box 26 is blank. The EI premiums are computed from employment
  income, taken as the insurable earnings. Employment income is above both CPP earnings
  ceilings and the EI maximum insurable earnings, so the CPP contributions and EI premiums
  are the printed 2025 maximums: base CPP contributions (Schedule 8 line 11, T1 line 30800,
  ON428 line 58240) of $3,356.10, enhanced CPP contributions (line 22215) of $1,074.00
  ($678.00 first additional, Schedule 8 line 12, plus $396.00 second additional, line 22),
  and EI premiums (line 31200, ON428 line 58300) of $1,077.48. The deductions from total
  income modelled so far are an RRSP deduction (line 20800) of $1,926, the lesser of the
  contributions available to deduct (Schedule 7 line 10) of $1,926 (the unused contributions
  from earlier years of $0, Schedule 7 line 1, plus the contributions of $1,926, Schedule 7
  line 4) and a chosen deduction limit of $19,800 (Schedule 7 line 11), union dues (line
  21200) of $2,000 and the enhanced CPP contributions of $1,074.00: with the enhanced CPP
  deduction, total deductions (line 23300) come to $5,000 (1,926 + 2,000 + 1,074.00) and net
  income (line 23600) to $115,000 (120,000 - 5,000), the taxable income of CRA's worked
  example. There are no deductions from net income (lines 24400 to 25600), so their total
  (line 25700) is $0 and taxable income (line 26000), derived as net income less that total,
  is $115,000, Maria's figure in that example. The non-refundable credit amounts modelled so
  far are the basic personal amounts, federal (line 30000) $16,129, since net income is
  $177,882 or less, and Ontario (ON428 line 58040) $12,747, with the base CPP contributions
  and EI premiums on both forms and, on the T1 alone, the Canada employment amount (line
  31260) of $1,471, the lesser of $1,471 and employment income (ON428 has no such line):
  line 33500 of $22,033.58 and ON428 line 58800 of $17,180.58. The rate is applied once to
  each total: 14.5% federally (line 33800) and 5.05% for Ontario (ON428 line 58840). Each
  product is its form's non-refundable tax credits: the total federal non-refundable tax
  credits (line 35000) of $3,194.8691 and the Ontario non-refundable tax credits (ON428 line
  61500) of $867.61929, each taken off its form's basic tax, not below zero. The Ontario
  surtax (ON428 line 68) is 20% of the Ontario tax after credits over $5,710 plus 36% of it
  over $7,307: $392.395442 + $131.3917956 = $523.7872376, for an Ontario tax with surtax
  (ON428 line 69) of $8,195.7644476. The CPP contributions, the EI premiums and the federal
  basic personal amount are rounded to the cent, which changes none of them; no other
  amounts are rounded.
sources:

    = 110,000 and line 31260 is 1,471, the lesser of 1,471 and 110,000, with no rounding
    stated. With the base CPP contributions, the EI premiums and the Canada employment
    amount, the credit amounts modelled, line 33500 is 16,129 + 3,356.10 + 1,077.48 + 1,471
    = 22,033.58, and line 33800 is 22,033.58 x 14.5% = 3,194.8691, with no rounding stated.
    Lines 116 and 117 are not modelled, so line 35000 is that same 3,194.8691.

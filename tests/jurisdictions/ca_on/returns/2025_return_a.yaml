# Return A: a 2025 Ontario resident, computed from employment income and a capital gain
# to total income, less an RRSP deduction, union dues and the enhanced CPP contributions to
# net income, less the (empty) deductions from net income to taxable income, and through
# each form's total of non-refundable credit amounts (its basic personal amount, the base
# CPP contributions and the EI premiums), credited once at the form's credit rate, to the
# tax after credits. Not yet computed, so not in this file: any deduction from net income,
# the social benefits repayment, capital losses, the Canada employment amount, the Ontario
# surtax, tax reduction and health premium, and the balance owing.
# Amounts are quoted decimal strings, never floats. Every output the CA-ON manifest
# declares must appear under `expected`; intermediate lines may be listed and are then
# checked too.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  An Ontario resident with 2025 employment income (T1 line 10100) of $110,000 and one
  capital gain of $20,000 (Schedule 3 line 21), of which 50% is taxable: taxable capital
  gains (line 12700) of $10,000 and total income (line 15000) of $120,000. Employment
  income is above both CPP earnings ceilings and the EI maximum insurable earnings, so the
  CPP contributions and EI premiums are the printed 2025 maximums: base CPP contributions
  (line 30800, ON428 line 58240) of $3,356.10, enhanced CPP contributions (line 22215) of
  $1,074.00 ($678.00 first additional plus $396.00 second additional), and EI premiums
  (line 31200, ON428 line 58300) of $1,077.48. The deductions from total income modelled
  so far are an RRSP deduction (line 20800) of $1,926, union dues (line 21200) of $2,000
  and the enhanced CPP contributions of $1,074.00. The RRSP deduction is $1,926, not the
  $3,000 claimed before the enhanced CPP deduction was modelled, so that net income and
  taxable income stay at $115,000 (3,000 - 1,074 = 1,926, the milestone's rule): total
  deductions (line 23300) of $5,000 and net income (line 23600) of $115,000. There are no
  deductions from net income (lines 24400 to 25600), so their total (line 25700) is $0 and
  taxable income (line 26000), derived as net income less that total, is $115,000, Maria's
  figure in CRA's worked example. The non-refundable credit amounts modelled so far are
  the basic personal amounts, federal (line 30000) $16,129, since net income is $177,882
  or less, and Ontario (ON428 line 58040) $12,747, with the base CPP contributions and EI
  premiums on both forms: line 33500 of $20,562.58 and ON428 line 58800 of $17,180.58. The
  rate is applied once to each total: 14.5% federally (line 33800, here also the total
  federal non-refundable tax credits, line 35000) and 5.05% for Ontario (ON428 line 58840,
  here also the Ontario non-refundable tax credits, line 61500). No amounts are rounded.
sources:
  - >-
    CRA, "T1-2025 Schedule 3 Capital Gains or Losses" (form 5000-S3): line 23 "Inclusion
    rate 50%"; line 24 "Line 22 multiplied by the percentage from line 23"; line 26
    (line 19900) "If positive, enter the result on line 12700 of your return". The capital
    gain of 20,000 times 50% is 10,000 of taxable capital gains, with no rounding stated.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s3/5000-s3-25e.pdf
  - >-
    Total income (line 15000) is employment income (line 10100) plus taxable capital gains
    (line 12700), the only income lines on this return: 110,000 + 10,000 = 120,000.
  - >-
    CRA, "CPP contribution rates, maximums and exemptions", 2025 row: maximum annual
    pensionable earnings $71,300; basic exemption $3,500; employee rate 5.95%; maximum
    annual employee contribution $4,034.10. CRA, "Second additional CPP contribution rates
    and maximums", 2025 row: additional maximum annual pensionable earnings $81,200;
    employee rate 4%; maximum $396.
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/canada-pension-plan-cpp/cpp-contribution-rates-maximums-exemptions.html
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/calculating-deductions/making-deductions/second-additional-cpp-contribution-rates-maximums.html
  - >-
    CRA, "T1-2025 Schedule 8 Canada Pension Plan Contributions and Overpayment" (form
    5000-S8), Part 3 (employment income): line 11 "multiplied by 4.95% (maximum
    $3,356.10)" (base contributions); line 12 "multiplied by 1% (maximum $678.00)" (first
    additional); line 22 "multiplied by 4% (maximum $396.00)" (second additional, CPP2);
    Part 3a line 25 "Enter this amount (in dollars and cents) on line 30800 of your return
    and line 58240 of your Form 428." (the base contributions); Part 3a line 28 "Enter this
    amount (in dollars and cents) on line 22215 of your return." (the first and second
    additional contributions together). Employment income of 110,000 is above the $71,300
    and $81,200 ceilings, so every part is at its maximum: base 4.95% x (71,300 - 3,500) =
    3,356.10; first additional 1% x 67,800 = 678.00; second additional 4% x (81,200 -
    71,300) = 396.00; line 22215 is 678.00 + 396.00 = 1,074.00, the T1's printed
    "(maximum $1,074.00)" on that line.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-s8/5000-s8-25e.txt
  - >-
    CRA, "EI premium rates and maximums", 2025 federal row: maximum annual insurable
    earnings $65,700; rate 1.64%; maximum annual employee premium $1,077.48. Employment
    income of 110,000 is above $65,700, so the premiums are 1.64% x 65,700 = 1,077.48, the
    T1's printed maximum on line 31200.
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/employment-insurance-ei/ei-premium-rates-maximums.html
  - >-
    CRA, the 2025 T1 return (form 5000-R): line 36 (line 20800) "RRSP deduction (complete
    Schedule 7 and attach receipts)"; line 39 (line 21200) "Annual union, professional, or
    like dues (receipts and box 44 of all T4 slips)"; line 48 (line 22215) "Deduction for
    CPP or QPP enhanced contributions on employment income" "(maximum $1,074.00)"; line 53
    (line 23300) "Add lines 35 to 52" (total deductions); line 54 (line 23400) "Line 34
    minus line 53 (if negative, show in brackets) Net income before adjustments"; line 56
    (line 23600) "Line 54 minus line 55 (if negative, enter "0") Net income". The RRSP
    deduction, union dues and the enhanced CPP contributions are the only deductions
    modelled so far. The RRSP deduction is 1,926: the milestone fixes taxable income at
    115,000 (CRA's worked example) and adjusts the RRSP figure for the enhanced CPP
    deduction, so the 3,000 claimed before becomes 3,000 - 1,074.00 = 1,926. Total
    deductions are 1,926 + 2,000 + 1,074.00 = 5,000.00; line 55 (line 23500, social
    benefits repayment) is not modelled, so net income is total income less total
    deductions, not below zero: 120,000 - 5,000.00 = 115,000.00.
  - >-
    CRA, the 2025 T1 return (form 5000-R): line 57 "Enter the amount from line 56 of the
    previous page" (net income); line 68 (line 25700) "Add lines 58 to 67" (the deductions
    from net income, lines 58 to 67, lines 24400 to 25600); line 69 "Line 57 minus line 68
    (if negative, enter "0") Taxable income" (line 26000, as Step 5 refers to it). There are
    no deductions from net income on this return, so line 68 is 0 and taxable income is net
    income less it, not below zero: 115,000 - 0 = 115,000.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-r/5000-r-25e.txt
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-r/5000-r-25e.pdf
  - >-
    CRA, "Completing a basic tax return", the worked example for Maria: federal tax on
    taxable income of $115,000, shown per bracket rounded to the dollar as
    8,319 + 11,762 + 65 = 20,146. The file's 20,146.25 is the same arithmetic unrounded
    (8,319.375 + 11,761.875 + 65), because no rounding rule is configured for this line.
  - >-
    CRA, the 2025 T1 return (form 5000-R): line 77 (line 30000) "If the amount on line
    23600 is $177,882 or less, enter $16,129. Otherwise, use the Federal Worksheet to
    calculate the amount to enter. (maximum $16,129)"; line 86 (line 30800) "through
    employment income" (base CPP or QPP contributions); line 88 (line 31200) "through
    employment (boxes 18 and 55 of all T4 slips) (maximum $1,077.48)"; line 113 (line
    33500) "Line 106 plus line 112"; line 114 "Federal non-refundable tax credit rate
    14.5%"; line 115 (line 33800) "Line 113 multiplied by the percentage from line 114";
    line 118 (line 35000) "Add lines 115 to 117. Total federal non-refundable tax credits".
    Net income of 115,000 is 177,882 or less, so line 30000 is 16,129. With the base CPP
    contributions and the EI premiums, the credit amounts modelled, line 33500 is 16,129 +
    3,356.10 + 1,077.48 = 20,562.58, and line 33800 is 20,562.58 x 14.5% = 2,981.5741,
    with no rounding stated. Lines 116 and 117 are not modelled, so line 35000 is that
    same 2,981.5741.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5000-r/5000-r-25e.txt
  - >-
    CRA, the 2025 ON428 (form 5006-C): line 9 (line 58040) "Basic personal amount Claim
    $12,747"; line 19 (line 58240) "Amount from line 30800 of your return"; line 21 (line
    58300) "Amount from line 31200 of your return"; line 44 (line 58800) "Line 35 plus line
    43"; line 45 "Ontario non-refundable tax credit rate 5.05%"; line 46 (line 58840) "Line
    44 multiplied by the percentage from line 45"; line 50 (line 61500) "Line 46 plus line
    49 Enter this amount on line 52. Ontario non-refundable tax credits". With the federal
    base CPP contributions and EI premiums, line 58800 is 12,747 + 3,356.10 + 1,077.48 =
    17,180.58, and line 58840 is 17,180.58 x 5.05% = 867.61929, with no rounding stated;
    line 49 is not modelled, so line 61500 is that same 867.61929.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.txt
  - >-
    The other lines are the 2025 federal and Ontario brackets and those credits applied
    without rounding: federal 20,146.25 less the 2,981.5741 credit is 17,164.6759; the
    Ontario brackets on $115,000 give 8,539.5965 (the printed ON428 Part A constants,
    rounded to the cent, would give 8,539.60), less the 867.61929 credit is 7,671.97721.
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.pdf

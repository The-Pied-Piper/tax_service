  - >-
    CRA, "EI premium rates and maximums", 2025 federal row: maximum annual insurable
    earnings $65,700; rate 1.64%; maximum annual employee premium $1,077.48. The premiums
    are computed from employment income, taken as the insurable earnings: 1.64% of
    employment income up to the $65,700 maximum insurable earnings, with no exemption, at
    most $1,077.48, rounded half-up to the cent. Employment income of 110,000 is above
    $65,700, so the premiums are 1.64% x 65,700 = 1,077.48, the T1's printed maximum on line
    31200. Not triggered by this return, so not modelled: insurable earnings (T4 boxes 18
    and 55) that differ from employment income, and the EI overpayment (T1 line 45000).
  - https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/employment-insurance-ei/ei-premium-rates-maximums.html
  - >-
    CRA, the 2025 Schedule 7 (form 5000-S7). Page 1: "If none of the situations for Parts A
    to F above apply to you, do not complete this schedule. Instead, enter your total
    contributions made to your RRSP, PRPP, or SPP, or your spouse's or common-law partner's
    RRSP or SPP, for 2025 on line 20800 of your return." Part A: line 1 "Enter your unused
    RRSP contributions previously reported and available to deduct for 2025 as shown on your
    latest notice of assessment or reassessment, or Form T1028 for 2025"; line 2 "Enter
    contributions made to your RRSP, SPP or PRPP, or to your spouse's or common-law
    partner's RRSP or SPP from March 4, 2025, to December 31, 2025 (attach all receipts).";
    line 3 the same contributions "from January 1, 2026, to March 2, 2026"; line 4 (line
    24500) "Line 2 plus line 3"; line 5 "Line 1 plus line 4 ... Total contributions". Part
    B: line 6 "Total contributions from line 5"; line 9 "Total repayments under the HBP and
    the LLP"; line 10 "Line 6 minus line 9 Contributions available to deduct". Part C: line
    11 "Enter your RRSP deduction limit for 2025 as shown on your latest notice of
    assessment or reassessment, or Form T1028 for 2025."; line 12 "Enter your 2025 employer
    PRPP contributions from line 20810 of your return."; line 13 "Line 11 minus line 12";
    line 14 "Contributions available to deduct from line 10 above"; line 15 (line 24640)
    "Transfers"; line 16 "Line 14 minus line 15"; line 17 "Enter whichever is less: amount
    from line 13 or line 16."; line 18 "Enter your RRSP, PRPP, or SPP contributions you are
    deducting for 2025 (cannot be more than the amount on line 17)."; line 19 "Line 15 plus
    line 18"; line 20 "Enter whichever is less: amount from line 10 or line 19. Enter this
    amount on line 20800 of your return. RRSP deduction". The unused contributions modelled
    are line 1's, the contributions line 4's, those made from March 4, 2025, to March 2,
    2026 (lines 2 and 3), and the deduction limit line 11's. The unused contributions of 0
    are a chosen figure: they are the amount on the taxpayer's latest notice of assessment,
    which nothing on this return determines. The contributions are 1,926. The deduction
    limit of 19,800 is a chosen figure: it is the amount on the taxpayer's latest notice of
    assessment, which nothing on this return determines; 18% of a prior year's income of
    110,000 is a plausible one. Line 5 is line 1 plus line 4, 0 + 1,926 = 1,926, and so is
    line 6; with no HBP or LLP repayments (line 9), line 10 is 1,926 - 0 = 1,926. With no
    employer PRPP contributions (line 12), line 13 is 19,800 - 0 = 19,800; line 14 is 1,926;
    with no transfers (line 15), line 16 is 1,926 - 0 = 1,926; line 17 is the lesser of
    19,800 and 1,926, 1,926. The full line 17 amount is deducted, so line 18 is 1,926 and
    line 19 is 0 + 1,926 = 1,926; line 20, and so line 20800, is the lesser of 1,926 (line
    10) and 1,926 (line 19): 1,926, with no rounding stated. Page 1's rule, for a return
    with none of the situations for Parts A to F, enters the total contributions on line
    20800 directly: the same 1,926, since the contributions do not exceed the limit. Not
    triggered by this return, so not modelled: HBP and LLP repayments (lines 7 to 9);
    employer PRPP contributions (line 12); transfers (line 15); and deducting less than line
    17 (line 18).

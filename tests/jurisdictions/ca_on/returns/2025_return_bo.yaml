  172.25; line 64 = 0 + 0 = 0; line 67 = 0 + 0 = 0; line 68 = 0 less 0 = 0; line 69 = 172.25 + 0 =
  172.25, positive: Part 3a. Line 70 (the amount from line 52, 3,462.75) is the amount for line

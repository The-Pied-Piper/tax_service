  is 0; line 73 = 665.00 + 0 = 665.00 is the amount for line 22215; line 74 (the amount from line
  69) is 172.25, the amount for line 44800. These are the ticket's 3,462.75, 665.00 and 172.25;
  they are not carried to the T1 lines yet. Lines 70, 71, 72 and 74 only copy lines 52, 59, 67

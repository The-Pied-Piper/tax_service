# Return BO: Bianca, a single 2025 Ontario resident with two T4 slips, one for Ontario
# employment (box 26 of $30,000) and one for Quebec employment (box 26 of $40,000), so Form
# RC381 replaces Schedule 8. This return carries Part 2 (the months and the QPP lines G to J) and
# Part 3 lines 1 to 69 (the CPP side on lines 3, 6 to 11, 14 to 16, 18 and 20 to 26, the QPP side
# on lines 27 to 31, 34 to 36, 38 and 40 to 46, and the totals on lines 49 to 69); Parts 3a and 3b
# (lines 70 to 93) and Part 4 are not yet computed, so the T1 lines 30800, 22215, 44800, 22200,
# 31000 and 42100 below are still Schedule 8's, from the whole employment income. The other lines
# are blank.
jurisdiction: CA-ON
tax_year: 2025
description: >-
  A single Ontario resident for all of 2025, resident in Canada throughout 2025, aged 18 or
  older at the end of 2025 (a chosen figure), with employment income (T1 line 10100) of
  $70,000 (a chosen figure) on two T4 slips: a T4 for Ontario employment with box 26 of
  $30,000 and box 16 of $1,800.00, and a T4 for Quebec employment with box 26 of $40,000 and
  box 17 of $2,500.00 (chosen figures; no box 16A or 17A). Because a T4 slip has Quebec as its
  province of employment, Form RC381 is completed in place of Schedule 8. Part 2: line A (the
  months that CPP applied) and line B (the months that QPP applied) are 12 and 12 (chosen
  figures; line A is not more than line B), so lines C to F (the CPP) and G to J (the QPP) are
  the table's row for 12 months: 71,300.00, 9,900.00, 81,200.00 and 3,500.00. Part 3: line 1
  (50339), the CPP pensionable earnings of the slips outside Quebec, is 30,000; line 2 (50329),
  the QPP pensionable earnings of the slips in Quebec, is 40,000; line 3 = 30,000 + 40,000 =
  70,000.00. Line 6 = line 4 (30,000) divided by line 5 (70,000) = 0.4285714..., cut at the
  fifth decimal place without rounding: 0.42857. Line 7 = 81,200.00 x 0.42857 = 34,799.884,
  34,799.88; line 8 = 71,300.00 x 0.42857 = 30,557.041, 30,557.04; line 9 = 3,500.00 x 0.42857
  = 1,499.995, which rounds half up to 1,500.00; line 10 = 9,900.00 x 0.42857 = 4,242.843,
  4,242.84. Line 11 is the lesser of line 1 (30,000) and line 7 (34,799.88): 30,000.00. Line 3
  (70,000.00) is not more than line C (71,300.00), so lines 12 to 15 are not completed: line 15
  is 0 (line 14, line 11 less line 8 = 30,000.00 less 30,557.04, is 0 as it is negative, and
  the lesser of line 10 and line 14 is 0) and the amount from line 11 is entered on line 16:
  line 16 = 30,000.00 less 0 = 30,000.00. Line 18 = line 16 less line 17 (the amount from line
  9, 1,500.00) = 28,500.00. Line 19 (50340), the total of box 16 of the T4 slips, is
  1,800.00 (a chosen figure; box 16A, line 25, is 0): line 20 = 1,800.00 x 83.1933% =
  1,497.4794, 1,497.48; line 21 = 1,800.00 less 1,497.48 = 302.52. Line 22 = 28,500.00 x 4.95%
  = 1,410.75 (not above the maximum of 3,356.10); line 23 = 28,500.00 x 1% = 285.00; line 24 =
  Schedule 8's, as the RC381 results are not yet carried to them, and Schedule 8 reads the same T4
  box 16 total (1,800.00) as line 19: on employment income of $70,000 the required base
  contributions (line 30800) are 4.95% x (70,000 less 3,500) = 3,291.75, and the required
  enhanced contributions (line 22215) are 1% x 66,500 = 665.00; the EI premiums are the maximum
  1,077.48. Total income (line 15000) is 70,000.00; the contributions deducted are the box 16
  total less the base share (83.1933% of 1,800.00, 1,497.48), 302.52, so net income and taxable
  income are 70,000.00 less 302.52 = 69,697.48. The income tax deducted is a chosen 12,000.00.
  The federal tax and the Ontario tax are the engine's figures from the 2025 brackets and credits
  in the repository (net federal tax 7,920.12, Ontario tax 4,035.23), giving a total payable of
  11,955.35 and a refund of 44.65 (to be confirmed against CRA's
  1,410.75 + 285.00 = 1,695.75; line 26 = 0 x 4% = 0. Line 25 (50341, box 16A) is 0. The QPP
  side: line 27 = line I (81,200.00) less line 7 (34,799.88) = 46,400.12; line 28 = line G
  (71,300.00) less line 8 (30,557.04) = 40,742.96; line 29 = line J (3,500.00) less line 9
  (1,500.00) = 2,000.00; line 30 = line H (9,900.00) less line 10 (4,242.84) = 5,657.16. Line 31
  is the lesser of line 2 (40,000) and line 27 (46,400.12): 40,000.00. Line 3 (70,000.00) is not
  more than line G (71,300.00), so lines 32 to 35 are not completed: line 35 is 0 (line 34, line 31
  less line 28 = 40,000.00 less 40,742.96, is 0 as it is negative, and the lesser of line 30 and
  line 34 is 0) and the amount from line 31 is entered on line 36: line 36 = 40,000.00 less 0 =
  40,000.00. Line 38 = line 36 less line 37 (the amount from line 29, 2,000.00) = 38,000.00. Line
  39 (50330), the total of box 17 of the T4 slips, is 2,500.00 (a chosen figure; box 17A, line 45,
  is 0): line 40 = 2,500.00 x 84.375% = 2,109.375, which rounds half up to 2,109.38; line 41 =
  2,500.00 less 2,109.38 = 390.62. Line 42 = 38,000.00 x 5.4% = 2,052.00 (not above the maximum of
  3,661.20); line 43 = 38,000.00 x 1% = 380.00; line 44 = 2,052.00 + 380.00 = 2,432.00; line 46 =
  0 x 4% = 0. The totals: line 49 = 1,497.48 + 2,109.38 = 3,606.86; line 52 = 1,410.75 + 2,052.00
  = 3,462.75; line 53 = 3,606.86 less 3,462.75 = 144.11; line 56 = 302.52 + 390.62 = 693.14; line
  59 = 285.00 + 380.00 = 665.00; line 60 = 693.14 less 665.00 = 28.14; line 61 = 144.11 + 28.14 =
  172.25; line 64 = 0 + 0 = 0; line 67 = 0 + 0 = 0; line 68 = 0 less 0 = 0; line 69 = 172.25 + 0 =
  172.25, positive (the ticket's 3,462.75, 665.00 and 172.25 are what Parts 3a and 3b will carry to
  lines 30800, 22215 and 44800; they are not carried yet). The remaining lines of the T1 are
  calculator). Not triggered: Part 3 lines 70 to 93 (Parts 3a and 3b), Part 4, the second
  additional contributions of lines 25 and 45 (boxes 16A and 17A, none), and every other
  credit and deduction not named here.
sources:
  - >-
    CRA, "Form RC381 (2025), Inter-Provincial Calculation for CPP and QPP Contributions and
    Overpayments" (confirmed 2026-10-19 from the PDF, no .txt is published), "Find out if this
    form is for you": "You earned employment income in the province of Quebec in 2025 and you
    were a resident of a province or territory other than Quebec on December 31, 2025";
    "Otherwise, complete Schedule 8, Canada Pension Plan Contributions and Overpayment
    (5000-S8) or Schedule 8, Quebec Pension Plan Contributions (5005-S8), whichever applies.".
  - >-
    CRA, Form RC381 (2025), Part 2: "Enter the number of months that CPP applied in 2025.",
    "Enter the number of months that QPP applied in 2025.", "The number you enter on line A
    cannot be more than the number you enter on line B." and "Enter the corresponding amounts
    from the monthly proration table above using the number of months from lines A and B.",
    where line G is "Your maximum pensionable earnings for 2025 (maximum $71,300)", line H "Your
    maximum amount subject to second additional contributions for 2025 (maximum $9,900)", line
    I "Your additional maximum pensionable earnings for 2025 (maximum $81,200)" and line J
    "Your maximum basic exemption for 2025 (maximum $3,500)".
  - >-
    CRA, Form RC381 (2025), Part 3: "Total CPP pensionable earnings from box 26 of all of your
    T4 slips where the province of employment is not Quebec (if box 26 is blank, enter the
    amount from box 14)" (50339, line 1); "Total QPP pensionable earnings from box 26 of all of
    your T4 slips where the province of employment is Quebec (if box 26 is blank, enter the
    amount from box 14)" (50329, line 2); "Line 1 plus line 2 Total pensionable earnings" (line
    3); "Line 4 divided by line 5 (calculated to the fifth decimal place without rounding)"
    (line 6); "Amount from line E of Part 2 multiplied by the rate at line 6" (line 7), "Amount
    from line C ..." (line 8), "Amount from line F ..." (line 9), "Amount from line D ..."
    (line 10); "Enter whichever is less: amount from line 1 or line 7." (line 11); "If the amount
    from line 3 is more than the amount from line C of Part 2, complete lines 12 to 15. If not,
    enter the amount from line 11 on line 16 and continue at line 17."; "Line 12 minus line 13
    (if negative, enter "0")" (line 14); "Enter whichever is less: amount from line 10 or line
    14." (line 15); "Line 11 minus line 15" (line 16); "Line 16 minus line 17 (if negative,
    enter "0")" (line 18); "Total actual base and first additional contributions on CPP
    pensionable earnings from box 16 of all of your T4 slips" (50340, line 19); "amount from
    line 19 x 83.1933%" (line 20); "Line 19 minus line 20" (line 21); "amount from line 18 x
    4.95% = (maximum $3,356.10)" (line 22); "amount from line 18 x 1% = (maximum $678.00)" (line
    23); "Line 22 plus line 23" (line 24); "amount from line 15 x 4% = (maximum $396.00)" (line
    26).
  - >-
    CRA, Form RC381 (2025), Part 3 (continued): "Amount from line I of Part 2 minus the amount
    from line 7" (line 27), "Amount from line G of Part 2 minus the amount from line 8" (line
    28), "Amount from line J of Part 2 minus the amount from line 9" (line 29), "Amount from line
    H of Part 2 minus the amount from line 10" (line 30); "Enter whichever is less: amount from
    line 2 or line 27." (line 31); "If the amount from line 3 is more than the amount from line G
    of Part 2, complete lines 32 to 35. If not, enter the amount from line 31 on line 36 and
    continue at line 37."; "Line 32 minus line 33 (if negative, enter "0")" (line 34); "Enter
    whichever is less: amount from line 30 or line 34." (line 35); "Line 31 minus line 35" (line
    36); "Line 36 minus line 37 (if negative, enter "0")" (line 38); "Total actual base and first
    additional contributions on QPP pensionable earnings from box 17 of all of your T4 slips"
    (50330, line 39); "amount from line 39 x 84.375%" (line 40); "Line 39 minus line 40" (line
    41); "amount from line 38 x 5.4% = (maximum $3,661.20)" (line 42); "amount from line 38 x 1%
    = (maximum $678.00)" (line 43); "Line 42 plus line 43" (line 44); "Total actual second
    additional contributions on QPP pensionable earnings from box 17A of all of your T4 slips"
    (50331, line 45); "amount from line 35 x 4% = (maximum $396.00)" (line 46); "Total actual
    base contributions: line 47 plus line 48" (line 49); "Total required base contributions:
    line 50 plus line 51" (line 52); "Line 49 minus line 52 (if negative, show in brackets)" (line
    53); "Total actual first additional contributions: Line 54 plus line 55" (line 56); "Total
    required first additional contributions: Line 57 plus line 58" (line 59); "Line 56 minus
    line 59 (if negative, show in brackets)" (line 60); "Line 53 plus line 60 (if negative, show
    in brackets)" (line 61); "Total actual second additional contributions: Line 62 plus line
    63" (line 64); "Total required second additional contributions: Line 65 plus line 66"
    (line 67); "Line 64 minus line 67 (if negative, show in brackets)" (line 68); "Line 61 plus
    line 68 (if negative, show in brackets)" (line 69).
  - https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/rc381/rc381-25e.pdf
